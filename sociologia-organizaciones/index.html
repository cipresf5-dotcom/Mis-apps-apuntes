SOCIOLOGÍA DE LAS ORGANIZACIONES Prof. Mariana Valdés
UNIDAD II: CULTURA Y CLIMA ORGANIZACIONAL 2024
1. Cultura organizacional: Conceptos modalidad, funciones y subculturas. 1 2. Elementos de la cultura organizacional. 3. Clima organizacional. Definiciones. Diagnóstico del clima organizacional:
variables e indicadores para su análisis2
1 El presente punto es una adaptación del 2° capítulo de la Tesis de doctorado (inédita) Valdés, Mariana (2022). “Análisis de la Cultura Organizacional y su disposición a la Responsabilidad Social Empresaria en empresas del Sector de la Construcción de la Ciudad de Resistencia (Chaco)”. Facultad de Ciencias Económicas y Estadística. Universidad de Rosario. 2 Este punto se hizo de manera conjunta con la Lic. Chiara Sclippa

1- Cultura organizacional: definiciones, funciones, modalidades y perspectivas.
El estudio de la cultura organizacional como tal comienza a gestarse con el aporte de las teorías de las relaciones humanas o escuela humanista de administración ―Elton Mayo (1933), Kurt Lewin (1935), entre otros―. Dichas teorías empiezan a dar relevancia a la organización informal y a ciertas características sensibles de ser analizadas y estudiadas, como (a) las relaciones de cohesión y antagonismo, (b) el estatus, (c) la colaboración entre el personal, (d) el clima que se propicia, (e) la motivación, (f) el liderazgo, (g) las interacciones espontáneas que van surgiendo en el interior y que muchas veces trascienden a la organización formal, entre otras.
La noción de organización informal3, entendemos, permite destacar la importancia de los aspectos subjetivos de la organización, sobre todo teniendo en cuenta que una organización no sólo se articula a través de líneas de comunicación formal, departamentos y áreas aisladas, sino que existe además una dimensión intangible que impacta tanto en el desempeño de los trabajadores (influye en el ambiente laboral) como en la percepción que los empleados tienen de cierta organización.
Un concepto importante a tener es el de institucionalización, ya que la misma precede a la consolidación de una organización. Según Robbins, “[…] Cuando una organización se institucionaliza, adquiere valor y vida que son propios” (2004: 551), es decir, define los rasgos y componentes que la distinguen y que la singularizan, sosteniéndolos en el tiempo (poniéndolos en el plano de lo instituido).
Esta institucionalización supera al mero reflejo de un organigrama que sería una organización. Incluso, una organización entendida solamente como reflejo de un organigrama sería, siguiendo a Selznick, “[…] una herramienta remplazable, un instrumento racional diseñado para realizar un trabajo” (Selznick, 1957: 5). Este parecer refuerza la idea de que una organización no se constituye en esencia a partir de un organigrama dado o diseñado para la misma, es decir, una organización no se
3 Que surge de los trabajos de Elton Mayo (1972 [1946]) y Kurt Lewin (1948). Ver Mayo, Elton (1972 [1946]). Problemas humanos de una civilización industrial. Ciudad Autónoma de Buenos Aires: Nueva visión, disponible en [https://bit.ly/2VEdshh], consultado el 2 de abril de 2019. Ver también Lewin, Kurt (1948). Resolving social conflicts. New York: Harper International Edition, disponible en [https://cutt.ly/UyapaSf], consultado el 3 de marzo de 2019.
 institucionaliza con el instrumento racional de la organización formal, sino que lo hace (se institucionaliza) a partir de, entre otras cosas, el fundamental devenir del tiempo.
En este devenir, se va formando la cultura organizacional, la misma, no surge de manera espontánea o accidental. Los cimientos de una organización se van consolidando también cuando las personas que trabajan en la misma tienen que afrontar, por ejemplo, situaciones problemáticas y concebir juntas una solución, forjando de esta manera valores propios, formas de pensar y afrontar los problemas prácticos y cotidianos que se presentan en su desarrollo. En este sentido podríamos decir, en coincidencia con Marín (2013), que la cultura posee claramente una dimensión estabilizadora que favorece, sobre todo, “[…] conductas útiles para el logro de las metas colectivas” (Marín et al., 2013: 321).
La cultura organizacional, seguramente comparte patrones comunes que hacen al contexto general al que pertenece, aunque lo que nos interesa en este punto, son sus propias singularidades.
Etkin y Schvarstein (2005), en lo relativo a la identidad de las organizaciones, plantean que
[…] las organizaciones poseen una identidad definida como invariante en el sentido de que su transformación también implica la aparición de una nueva organización. Constituye definición de dicha identidad la enumeración de todo aquello que permita distinguir a la organización como singular y diferente de los demás, todo aquello que si desaparece afecta decisivamente a la organización. La perturbación de la invariancia implica la transformación del sistema (por ejemplo, de una empresa a una cooperativa) y, en el límite, significa su disolución (Etkin y Schvarstein, 2005: 156).
Asimismo, los autores proponer concebir distintas dimensiones en lo relativo a la identidad que están vinculadas a diferentes aspectos, como:
[…] tiempo, tamaño, localización, tangibilidad o intangibilidad del producto o servicio, ciclo de vida del producto o servicio, relación costobeneficio, grado de monetarización, organizaciones e instituciones relacionadas, influencias sobre su entorno, necesidades que satisface el producto o servicio, relaciones dialógicas dominantes […] (Etkin y Schvarstein, 2005: 159).
La identidad como tal, cobra relevancia de cara a plantearse un análisis organizacional porque es, al menos parcialmente, aquello que identifica y determina una singularidad. Por lo tanto, es importante conocer los rasgos de la identidad de una organización, así como también su cultura, porque ambas son relativamente estables en el tiempo y es lo que las constituye y a la vez lo que subyace en ellas.
Siguiendo a Etkin y Schvarstien (2005) se deduce también que esta característica de invariancia de la identidad no implica que esta última se constituya de una vez y para siempre poniendo en riesgo la vida de la organización, sino que responde a la necesidad de mantener una identidad por períodos prolongados para cumplir con la función de identificación. Por eso decimos que sus rasgos son relativamente estables. Esto quiere decir que, si existen cambios en algunas de las dimensiones de la identidad, se transforma la organización.
Definiciones de cultura organizacional (CO) Existen numerosos autores que abordaron el concepto de cultura organizacional, desde diversas connotaciones y perspectivas, aunque todos en mayor o menor medida dialogan entre sí a través de sus propuestas.
Los primeros estudios abocados al tema relacionaron al término cultura con el de organización por la importancia que habían adquirido en la época (década de los 70) los aspectos subjetivos e informales en la realidad organizacional. En estos inicios, los aportes de Ouchi (1981), Pascale y Athos (1981), Peters y Waterman (1982) y Deal y Kennedy (1982) fueron relevantes para el estudio de la cultura organizacional.
Posteriormente, otros autores desarrollaron la noción de cultura organizacional específicamente, con algo más de recorrido histórico y, por tanto, epistémico. Entre ellos, se encuentran Davis y Newstrom (2007), quienes consideran que “[…] la cultura organizacional es el conjunto de suposiciones, creencias, valores y normas que comparten los miembros. Crea el ambiente humano en que los empleados realizan su trabajo” (2007: 70). Por otra parte, Gibson, Ivancevich y Donnelly (2001) definen a la cultura como “[…] una percepción que tienen los empleados y a partir de la misma se va creando un patrón de creencias, valores y expectativas” (2001: 34). Por su parte, Schein (1998 [1985]) la conceptualiza como
[…] un conjunto de presunciones básicas, inventadas, descubiertas o desarrolladas por un grupo dado al ir aprendiendo a enfrentarse con sus problemas de adaptación externa e integración interna que hayan ejercido suficiente influencia como para ser consideradas válidas y, en consecuencia, ser enseñadas a los nuevos miembros como el modo correcto de percibir, pensar y sentir esos problemas (Schein, 1998 [1985]: 5).

El autor expresa además que la cultura organizacional está formada por diferentes niveles: Los artefactos y las creaciones, valores y presunciones básicas.
Siguiendo este último nivel (o primero, si se lo mira en tanto basamento de los dos anteriores) podemos afirmar que la cultura organizacional, para Schein (1988 [1985]), está compuesta por elementos implícitos que, si bien no se pueden ver fácilmente, constituyen la parte más fuerte de la cultura, su base natural. Así, es razonable pensar que tomaría tiempo, para un observador imaginario, dar cuenta de forma genuina de estos elementos a menudo invisibles pero presentes que articulan la interacción de los miembros del grupo observado e incluso articula su cultura misma.
Para Robbins y Judge (2004 [1993]), esta circulación de contenido o interacción entre miembros de un grupo dado es importante pues plantea que, precisamente, la cultura organizacional se ancla en “[…] un sistema de significados compartidos por parte de los miembros de una organización y que distingue a una organización de otras” (Robbins y Judge (2004 [1993]: 620). En consonancia con autores mencionados anteriormente, Robbins y Judge (2004 [1993]) también entienden que una organización atraviesa un proceso de consolidación a través del tiempo, y destacan que dicha consolidación puede tener lugar sobre todo si la organización se vincula con miembros que se sientan identificados con los valores que la misma propone. En este marco, por ejemplo: “[…] la selección [de miembros] se vuelve un asunto de dos sentidos, que permite al empleador y al solicitante evitar una incompatibilidad y mantener la cultura de una organización al eliminar a quienes socaven u obstaculicen sus valores fundamentales” (Robbins y Judge (2004 [1993]: 520).
En lo relativo a la relación valores-cultura organizacional, Pfeffer (1997) destaca los aportes de O’Reilly, Chatman y Caldwell (1991) pues éstos encontraron (dice Pfeffer) una relación explícita entre valores y cultura organizacional, sobre todo en términos de rendimiento:
O’Reilly, Chatman, and Caldwell (1991) found that the greater the degree of correspondence between an individual's values and the organization’s culture, the higher the level of performance, the longer the individual stayed in the organization and the greater the expressed commitment to the firm. Chatman (1991) reported that the congruence between organizational culture and personal values was a better predictor of tenure and performance in the job than either of the factors alone (Pfeffer, 1997: 39)4.
4 “O’Reilly, Chatman y Caldwell (1991) observaron que cuanto mayor era el grado de correspondencia entre los valores de un individuo y la cultura de la organización, mayor era el nivel de rendimiento, más tiempo permanecía el

Por otro lado, enfocándonos en las relaciones de poder que se desarrollan al interior de una organización, encontramos las propuestas teóricas de Fleury y Fischer (1989) y Freitas (1991) en lo relativo a la materia (cultura organizacional). Así, para Fleury y Fischer (1989), la cultura organizacional es “[…] un conjunto de valores y supuestos básicos expresados en elementos simbólicos que en su capacidad de ordenar, atribuir significados, construir la identidad organizacional, tanto actúan como elemento de comunicación y consenso, como ocultan e instrumentalizan las relaciones de dominación (1989: 117)5. Por su parte, Freitas (1991) la considera como un
[…] poderoso mecanismo de control [orientado a] conformar conductas, homogeneizar maneras de pensar y vivir la organización, introduciendo una imagen positiva de ella, donde todos son iguales, escamoteando las diferencias y conflictos inherentes a un sistema que guarda un antagonismo y anulando la reflexión (1991: XVIII).
Como vemos, ambas posturas ―tanto la de Freitas (1991) como la de Fleury y Fischer (1989)― incorporan otra forma (según lo que habíamos visto hasta aquí) de concebir la cultura organizacional, básicamente porque sus posturas no solo contemplan el aspecto consensual en lo relativo a valores y supuestos, sino también dimensiones relacionadas con la influencia del poder, los conflictos que se vivencian en la propia interacción de los miembros, que son dimensiones especialmente válidas para entender por qué y cómo surgen subculturas que muchas veces provocan un conflicto con la cultura dominante.
Respecto de la dominancia, para referirnos a las culturas dominantes o a los modos de pensar dominantes, Etkin propone de manera muy lúcida que
[…] los modos de pensar dominante y la cultura son una realidad, pero esto no significa que haya una aceptación por parte de sus miembros, como si ellos la hayan construido, es decir, que la cultura opera en el plano de lo implícito. La cultura es lo que subyace en una organización (2007: 273).
Así, podríamos entonces decir que cultura organizacional en términos generales es un concepto que pretende dar cuenta de lo subyacente ―en términos de Etkin (2007)― que rige los comportamientos de los miembros de una organización y articula características compartidas por ellos (en su mayoría), pero que puede articular, a la vez individuo en la organización y mayor era el compromiso expreso con la empresa. Chatman (1991) informó de que la congruencia entre la cultura de la organización y los valores personales era un mejor predictor de la permanencia y el rendimiento en el trabajo que cualquiera de los dos factores por sí solo”. La traducción es nuestra.
5 La traducción es nuestra.
 (en cada área, subdivisión o sucursal de una compañía), problemas, situaciones o experiencias propias que enfrentan todos sus miembros, dando lugar a la generación de subculturas.
A su vez, podríamos definir estas subculturas, siguiendo a Robbins (2004), como “[…] miniculturas dentro de una organización, por lo general definidas por los diseños de departamentos y la separación geográfica” (Robbins, 2004: 716). Naturalmente, esto no significa que una subcultura dada no comparta los valores centrales de la organización, sino que una subcultura dada puede modificar o agregar ciertos valores propios. También hay que considerar que esta subcultura dada probablemente esté influenciada por la propia cultura del contexto al que pertenece (pensemos en las diferencias que existen entre dos sucursales de una misma compañía que están ubicadas en dos áreas geográficas, por ejemplo).
Continuando con el concepto de subcultura organizacional, Schermerhorn et al. (2011) indica que las subculturas “[…] son grupos que exhiben características únicas en cuanto a sus valores y formas de pensar, que no son consistentes con la cultura dominante o con la organización” (Arbaiza Fermini, 2014: 8), volviéndose para este autor parcialmente incompatibles las unas con las otras (las subculturas con las culturas dominantes). Por otro lado, tenemos autores que utilizan nociones de horizontalidad y verticalidad para caracterizar diferentes tipos de subculturas. Así, existen “[…] subculturas horizontales que se relacionan con la diferenciación clásica de ocupaciones y lugares de trabajo, y subculturas verticales que se relacionan con diferenciaciones que tienen que ver con grupos de empleados, subculturas profesionales, grupos integrados por distintos orígenes étnicos” (Góngora, Nóbile y Reija, 2014: 54). Todo lo cual concuerda o tiene coherencia con la explicación que ofrece Krieger (2001) para dar cuenta del fenómeno de la diversidad al interior de una cultura organizacional: “En las organizaciones existen muchos sistemas de valores diferentes y competitivos que crean un mosaico organizacional entre diferentes grupos, más que culturas corporativas uniformes” (Krieger, 2001: 337).
Esta diversidad de valores señalada por Krieger (2001) y otros ―Góngora, Nóbile y Reija (2014)― en una cultura organizacional se vincula de manera coherente con cierto aspecto desarrollado por Cameron y Quinn (1999) y que tiene que ver con las esperables dificultades existentes a la hora de coordinar todas estas variedades de cara a una integración de procesos o actividades organizacionales, dificultades que “[…] are often a result of cultura clashes among different subunits”6 (Cameron y Quinn, 1999: 1718). Sin embargo, la peculiaridad de las subculturas existentes no podría leerse al
6 Dificultades que a menudo son el resultado de choques culturales entre diferentes subunidades. La traducción es nuestra.
 margen de la cultura organizacional dominante pues ésta es la que, al fin, las contiene, y solo a través de la relación con ella adquieren pleno significado. Esto podría abonar a la propuesta de Robbins (2004) según la cual
Si las organizaciones no tuvieran una cultura dominante y sólo estuvieran compuestas por numerosas subculturas, el valor de una cultura organizacional como variable independiente sería notablemente menor porque no habría una interpretación uniforme de lo que representa un comportamiento apropiado o inapropiado (Robbins, 2004: 526).
Por otro lado, para determinar qué tan problemática o incompatible puede resultar una subcultura respecto de la cultura dominante, Salazar (2008) retoma los aportes de Deal y Kennedy (1982) para proponer una serie de aspectos que habría que tener en cuenta:
— Cuando una cultura crece hacia adentro: es decir, si no hay un intercambio formal o informal entre ellas, las subculturas pueden desarrollarse hacia adentro y empezar a operar en detrimento de la empresa en general.
— Cuando surgen a la superficie los choques entre las subculturas: cada una intenta públicamente minar la posición de las demás.
— Cuando las subculturas se vuelven exclusivas: un síntoma seguro de que habrá problemas es cuando las subculturas asumen los requisitos de clubes exclusivos, restricciones para poder pertenecer a ellas, exclusión arbitraria de algunos individuos, rituales que son solo para los miembros, etcétera.
— Cuando los valores de la subcultura tienen mayor prioridad que los valores compartidos de la compañía: es decir, cuando las subculturas empiezan a ponderar sus creencias por considerarlas superiores a los dogmas generales de la empresa (Salazar, 2008: 35).
Como hemos podido observar, existen numerosos precursores y teóricos que han escrito sobre la cultura organizacional. Aunque hemos realizado un breve recorrido por los autores clásicos o aquellos reconocidos por su trayectoria, es importante aclarar que no representan la totalidad de las propuestas existentes.
Sin embargo, si intentamos delinear una conceptualización a partir de nuestra interpretación y resignificación, podríamos decir que “la cultura organizacional se refiere a aquello que identifica y singulariza a una organización no espontánea, la cual, a través de su status quo, regula y orienta la conducta (el deber ser) de los miembros de las organizaciones. Esto se convierte en un marco de referencia para la forma de ser y actuar, con un fuerte contenido axiológico.
Este contenido axiológico, reflejado en una funcionalidad normativa de la cultura vigente en un momento dado, es un elemento crucial a tener en cuenta al abordar un cambio dentro de las organizaciones. Es importante considerar que, ante dicho cambio, es probable que los miembros generen formas de resistencia”. ( Valdés, M, 2022, p.103 )
Modalidades que adopta la cultura organizacional Habiendo ya repasado algunas de las diferentes concepciones disponibles para definir tanto cultura organizacional como subcultura, pasaremos a revisar modalidades atribuibles al estado de una cultura dada.
Así, en una cultura fuerte, podemos presuponer que los valores centrales de la organización serían sostenidos con firmeza y ampliamente compartidos en su significación. Una cultura con esta característica tendría mayor impacto en el comportamiento de sus miembros y, naturalmente, esto generaría un ambiente interno de control, estimulando la cohesión del grupo y la lealtad de los miembros hacia la empresa. Sería esperable que una cultura fuerte, por lo general, sea impulsada por el fundador y los líderes de los grupos, quienes a través de la comunicación serían los encargados de transmitir y respaldar la misma. Por el contrario, una cultura débil sería aquella en la que hay pocos significados compartidos y, en consecuencia, una mayor heterogeneidad de conductas y pensamientos.
Pues bien, en un sentido similar, pero anteponiendo términos de funcionalidad/disfuncionalidad, Horacio Andrade (1992, 1996) homologa los términos y los agrupa en (a) fuerte-funcional y (b) débil-disfuncional, sosteniendo que una cultura fuerte-funcional es la que posee “una gran cantidad de significados compartidos que permiten que las personas tengan una percepción homogénea y realista de la crisis. Los valores organizacionales, que siguen demostrando su plena vigencia, generan acciones concertadas y planeadas de antemano” (Andrade, 1996: 4-5). Ritter (2008) también destaca, siguiendo al mismo autor pero cambiando de fuente ―Andrade (2011)―, que una cultura será funcional cuando “[…] permita a la organización alcanzar su misión y objetivos y logre motivar a sus miembros en su consecución, como así también fomentar un ambiente en donde predomine la integración” (Ritter, 2008: 64). Por su parte, una cultura débil-disfuncional será, para Andrade (1992, 1996), aquella que posee
[…] pocos significados compartidos, y ante la presencia de una crisis se cree que, debido a la funcionalidad de la cultura, las acciones que se han puesto en práctica en otras situaciones siguen siendo válidas. Este pragmatismo hace que la percepción de la crisis sea poco realista, y que la manera de enfrentarla esté basada en experiencias pasadas que no se apoyan en un conjunto de creencias y valores asumidos por los miembros de la organización, que le den sentido y dirección al esfuerzo. En estas circunstancias, el riesgo de equivocarse es alto (Andrade, 1996: 4).
Pasando a otras atribuciones que el marco teórico reserva para la cultura organizacional, tenemos la que distingue entre culturas según su densidad o cohesividad (concentrados o fragmentadas), según su tendencia (tendientes al cierre o a la apertura) o bien según la procedencia de sus pautas-directrices (autónomos o reflejos). Esta caracterización, que fue propuesta por Etkin y Schvarstein (2005 [1997]), propone que las culturas organizacionales pueden ser también clasificables en los siguientes grupos de naturaleza binaria o antagónica:
— Concentradas o fragmentadas: Considerando la cantidad de unidades componentes de la organización, donde los sistemas culturales se alojan con más fuerte raigambre. Así por ejemplo una institución […] que concentre sus esfuerzos y dirección en el núcleo identitario será concentrada; otra institución en la que cada grupo disponga de una fuerte autodeterminación, convierte al conjunto en un sistema cultural fragmentado.
— Tendientes al cierre o a la apertura: Según la permeabilidad del sistema cultural a los cambios en el entorno, es decir, si la incorporación de ideas y tecnologías es legítima o clandestina, facilitada o entorpecida.
— Autónomas o reflejas: Según que sus pautas sean producto de la singularidad o, por el contrario, de la imitación de algún modelo externo. Así hay corporaciones que intentan consciente o inconscientemente emular a otros que son exitosos en su mercado. Las estrategias de modernización suelen asociarse a esta estrategia de cultura refleja, pensando que la copia puede realizarse haciendo abstracción de las características sociales de su medio de origen (Etkin y Schvarstein: 2005: 202). Funciones de la cultura organizacional Las funciones que desempeña la cultura al interior de una organización pueden ser muy heterogéneas. En O’Reilly y Chatman (1996), por ejemplo, encontramos que la cultura puede tener hasta cinco funciones principales o bien definidas que se vinculan entre sí: a. define fronteras: “[…] people’s tendency to want to join groups and to distinguish in-groups from out-groups is too strong”7 (O’Reilly y Chatman, 1996: 188), reforzando así diferencias entre grupos de una organización y otra organización (es decir, entre los propios y los demás); b. por lo anterior, habilita un sentido de identidad: “When people perceive others as similar, they are likely to view them as members of the same group (in-group). […] people are significantly more likely to cooperate with those they consider to be part of their in-group […]. Social categorization also enhances member’s identification with the organization”8 (O’Reilly y Chatman, 1996: 170); c. genera compromiso: “[…] all strong culture organizations (1) promoting commitment through participation by designing processes such as rigorous selection and orientation processes and job designs that require multiple steps; (2) managing the informational context through management signalling, often symbolically, that certain goals, attitudes, and behavior are important, minimizing mixed or inconsistent messages to help members develop shared interpretations of events, and continuous emphasis with multiple opportunities for reinforcement; and (3) developing comprehensive reward systems that are aligned with the culture and that provide rapid feedback, an emphasis on appropriate attitudes and behavior, and continuous recognition”9 (O’Reilly y Chatman, 1996: 175);

8 “Cuando las personas perciben a otros como similares, es probable que los vean como miembros del mismo grupo (in-group). [...] las personas son significativamente más propensas a cooperar con aquellos que consideran que son parte de su in-group [...]. La categorización social también mejora la identificación del miembro con la organización”. La traducción es nuestra.
9 “[…] todas las organizaciones culturales fuertes: 1) promover el compromiso a través de la participación diseñando procesos tales como procesos rigurosos de selección y orientación y diseños de trabajo que requieren múltiples pasos; 2) gestionar el contexto informativo a través de la gestión señalando, a menudo simbólicamente, que ciertos objetivos, actitudes y comportamientos son importantes, minimizando los mensajes mixtos o inconsistentes para ayudar a los miembros a desarrollar interpretaciones compartidas de los eventos, y un énfasis continuo con múltiples oportunidades d. opera como estabilizador o cohesionante (cuando es vivenciada como culto), habilitando “a high level of social cohesiveness”10 (O’Reilly y Chatman, 1996: 182);
e. opera como mecanismo de control: “Culture is a prevalent social control system operating in organizations […] Culture as social control can, under certain circumstances, be an effectiveway of meeting legitimate strategic [...] objectives”11 (O’Reilly y Chatman, 1996: 187).
Esta función controladora o reguladora que O’Reilly y Chatman (1996) ya destacan en la década de los noventa coincide tanto con las propuestas teóricas de Freitas (1991) como con las de Fleury y Fischer (1989) ―ambas propuestas comentadas anteriormente en este trabajo―.
Sin embargo, también podemos encontrar una presunta última función, no atendida por los autores precedentes (al menos de manera explícita), y que consiste en una caracterización de cultura de tipo filosófica o metafísica (o bien dogmática, según se mire), que se vincula con el hacer y responder (esto es, dar respuestas suficientes, de ahí que sea compatible con un dogma) a interrogantes del tipo de “¿quiénes somos?”, “¿qué nos une?”, “¿qué y cómo debo hacerlo yo?” (Ritter, 2008: 57).
2- Elementos de la Cultura organizacional. En el seno de la vida organizacional la cultura pone en interrelación a los miembros a través de distintos elementos que resultan operativos para desarrollar su tránsito normal. Franklin y Krieger (2011), Arbaiza Fermini (2014) o Chiavenato (2009) ofrecen precisiones para referenciar estos elementos brevemente.
Valores Franklin y Krieger (2011) indican que los valores, o sea “[…] las creencias profundas, sostenidas consciente o inconscientemente, que especifican las preferencias y los comportamientos generales y que definen lo que está bien y lo que está mal”
de refuerzo; y 3) desarrollar sistemas de recompensa integrales que estén alineados con la cultura y que proporcionen una rápida retroalimentación, un énfasis en las actitudes apropiadas y comportamiento, y reconocimiento continuo”. La traducción es nuestra.
10 “Un alto nivel de cohesión social”. La traducción es nuestra. 11 “La cultura es un sistema de control social predominante que opera en las organizaciones [...] La cultura como control social puede, bajo ciertas circunstancias, ser una forma efectiva de cumplir con objetivos estratégicos legítimos”. La traducción es nuestra.
 (Franklin y Krieger, 2011: 174), son el núcleo duro de toda cultura. Valores como la honestidad, la credibilidad, la imparcialidad, la institucionalidad, el compromiso, el criterio, el respeto, la integración, la responsabilidad, la objetividad, el equilibrio y la confidencialidad son algunos de estos “valores personales que suelen considerarse centrales” (Franklin y Krieger, 2011: 174). Sin embargo, al contrario de lo que el sentido común puede sugerir, estos valores que en apariencia pueden pensarse como estables, serían solamente estables en general, no definitivamente: “[…] como hay momentos en que la institución asume nuevos desafíos y compromisos, deben ser revisados y monitoreados con cierta frecuencia” (Franklin y Krieger, 2011: 534).
Ya pasando a los que serían valores comunes (y no personales), Franklin y Krieger (2011) los agrupan en cuatro conjuntos: (a) valores comunes esenciales, (b) valores comunes finales, (c) valores comunes instrumentales y (d) valores comunes operativos. En sí, estos conjuntos de valores comunes nuclean en parte valores personales pero la diferencia principal vendría dada por el hecho de que se orientan a establecerse en torno de una configuración comunitaria y, por ende, más profunda. Así, estos valores comunes aportarían a la constitución de “[…] las líneas éticas fundamentales que guían la actividad de la organización e inspiran su propia conducta y la de sus integrantes. Además [del] punto de partida para la construcción de la visión compartida por éstos, y de la misión comprometida de la empresa como un todo” (Franklin y Krieger, 2011: 534).

.

Ritos y ceremonias

Articulando elementos simbólicos, los ritos y ceremonias “[…] contribuyen a la construcción de la cultura y fungen como reflejo de la misma” (Franklin y Krieger, 2011:

371). Estos suelen estar impregnados por “[…] instrucciones o procedimientos que la organización establece para indicar cómo debe comportarse su personal” (Franklin y

Krieger, 2011: 371). Entre los ritos y ceremonias podemos encontrar eventos que se accionan para celebrar, por ejemplo, la “[…] incorporación a una empresa (entrada o iniciación), las transiciones (promociones), la renovación y motivación (reuniones anuales, fiestas de navidad, días de campo), la desvinculación (despidos), las sanciones, los retiros (fiestas de jubilación, fiestas de despedida)” (Franklin y Krieger,

2011: 371).

Los ritos y ceremonias son importantes a nivel cultural, cobrando gran ascendencia a nivel subjetivo para los miembros, y resultando fundamentales para mantener muy “[…] unido al grupo” (Franklin y Krieger, 2011: 371).

Historias y mitos Al igual que los ritos y ceremonias, las historias y los mitos se inscriben al menos parcialmente en el universo de lo simbólico. Franklin y Krieger (2011) indican que los grupos y organizaciones en general desarrollan una historia particular de “[…] operaciones y sucesos a lo largo del tiempo, dándoles forma de mitos e historias que transmiten de generación en generación” (Franklin y Krieger, 2011: 372), esto es, generando una narrativa que tiende a recrearse una y otra vez. Estas narrativas “[…] sirven para motivar a los individuos y guiarlos en la adversidad y la incertidumbre” (Franklin y Krieger, 2011: 372). A menudo, las mismas se ficcionalizan o adquieren agregados pues, “[…] aunque los mitos y las historias cuentan sucesos reales, por lo general suelen exagerarse o distorsionarse con el paso del tiempo” (Franklin y Krieger, 2011: 372). Esta ficcionalización es destacada también por Arbaiza Fermini (2014) quien indica que hay “[…] leyendas y mitos exclusivos de [cada] cultura de cada organización. […] A medida que pasa el tiempo, por lo general, estos relatos basados en un hecho real introducen elementos de ficción” (Arbaiza Fermini, 2014: 19).
Tabúes A grandes rasgos, puede concebirse al tabú como la contrapartido del mito en tanto presenta lo prohibido, lo reprendido o lo penalizado. Para Arbaiza Fermini (2014) ―que se inspira en Hellriegel (2009)―, los tabúes se inscriben en el plano de prácticas y conductas que “se prohíben en la organización” (Arbaiza Fermini, 2014: 19). Al inscribirse en el plano de lo práctico, el tabú consiste en un evento concreto, por ejemplo, “en una empresa […] consistirá en pasar información a la competencia sobre un nuevo lanzamiento” (Arbaiza Fermini, 2014: 19).
Héroes Orientados a la dominación legítima o al liderazgo carismático ―según los dos aspectos que abordan Franklin y Krieger (2011: 265 y 299)―, los héroes entendidos en estos términos pueden ser concebidos como actores que imprimen mucho de personalidad a las características de la organización. Por ejemplo, un líder de carácter carismático se caracterizaría por la entrega extra-cotidiana a la santidad, el heroísmo, o ejemplaridad” (Franklin y Krieger, 2011: 265).

Por otro lado, podemos hacer la diferencia entre héroes natos y héroes creados. Los primeros pueden entenderse como “[…] personas que de cierta forma, determinaron o cambiaron el rumbo de la organización” (Belálcazar, 2012: 49) mientras que los segundos serían aquellos que “[…] que vencieron desafíos establecidos dentro de la organización y recibieron una condecoración por su éxito, como por ejemplo, el administrador del año, el campeón de ventas” (Belálcazar, 2012: 49).
Rápidamente podemos entender que la influencia de los primeros (natos) es más duradera y profunda. La funcionalidad de la figura del héroe sería, en principio, fundamentalmente la de fijar patrones de desempeño bien valorados por los miembros de la organización.
Normas En términos generales las normas podrían concebirse como un conjunto de pautas que fluyen o circulan a través de la organización determinando los comportamientos que son posibles y los que no, fungiendo como leyes que deben ser seguidas, las cuales pueden ser consignadas de manera escrita o tener su base en usos y costumbres (transmisibles mediante oralidad). Las normas, según sean obligatorias o periféricas, difieren en el grado de exigencia y aceptación que puedan tener entre los miembros de una organización. Así, según Franklin y Krieger (2011), la actitud que un individuo tenga hacia la organización de la que forma parte puede definirse a partir de la aceptación o rechazo que el mismo desarrolle respecto de tales normas (obligatorias o periféricas). En este marco, si un individuo acepta las normas obligatorias y también las periféricas, podríamos decir que “[…] el individuo trata de encajar completamente en la organización” (Franklin y Krieger, 2011: 104), mientras que si rechaza las normas obligatorias pero acepta las periféricas, “[..] la persona oculta su propia rebeldía” (Franklin y Krieger, 2011: 104). O bien, si tal miembro rechaza ambos tipos de normas, tendríamos que hablar de rebelión abierta y esto “[…] conlleva la pérdida voluntaria o involuntaria de la afiliación” (Franklin y Krieger, 2011: 104), mientras que si el individuo acepta las normas obligatorias pero rechaza las periféricas, estaríamos en presencia del individualismo creativo, es decir, en presencia de un individuo que “[…] muestra preocupación por las metas básicas de la organización y contribuye a lograrlas” (Franklin y Krieger, 2011: 104).
3-Diagnóstico de la cultura organizacional: variables e Indicadores para su análisis. Cambio cultural.

Como administradores, es esencial comprender el proceso de diagnóstico de la cultura organizacional, ya que permite analizar sus diferentes rasgos, valores y presupuestos subyacentes. Esto facilita la identificación de singularidades específicas de la cultura organizacional y la detección de rasgos, características, valores y presunciones que podrían modificarse para mejorar el desempeño organizacional. Gestionar el cambio cultural cobra relevancia en este contexto, ya que puede generar resultados positivos para el funcionamiento de la organización y sus miembros.

Para identificar las variables e indicadores relevantes en el diagnóstico de la cultura organizacional, es fundamental decidir la metodología en la que nos apoyaremos. Esta decisión es crucial para operacionalizar la matriz de análisis que servirá como referencia. La finalidad del investigador o consultor también influirá en la elección del enfoque cualitativo o cuantitativo. En general, la combinación de ambos enfoques suele ser la más acertada.

En estudios de esta naturaleza, es común comenzar con la caracterización de diferentes rasgos, la tipificación de los mismos y la observación de los diferentes niveles culturales. A continuación, se esquematizan las principales propuestas existentes en el área, teniendo en cuenta los aportes teóricos para la caracterización, tipificación y análisis de los niveles culturales, sugiriendo el estudio detallado en la literatura de referencia de la asignatura.

4- Clima organizacional. Definición. Diagnóstico del clima organizacional: variables e indicadores para su análisis.12
García Solarte sostiene que: El diagnóstico del clima proporciona retroalimentación acerca de los procesos que afectan el comportamiento organizacional y permite desarrollar planes de mejoramiento orientados al cambio de actitudes y conductas de los involucrados a través del mejoramiento de los factores diagnosticados, con el fin de elevar los niveles de motivación y rendimiento profesional (2009, pág. 57).
Zárate (2016) afirma que al evaluar el clima laboral se puede identificar qué tipo de debilidades y fortalezas coexisten en la organización a nivel de recursos humanos y organizacionales, que actúan facilitando o dificultando los procesos que conducirán a la productividad de los trabajadores y de todo el sistema organizacional. Es importante estudiar en profundidad y diagnosticar el clima organizacional porque es un concepto clave en el desarrollo empresarial que tiene implicancias sobre diversos factores como ser: la satisfacción y motivación del personal, formación de equipos de trabajo, la forma en que las personas interactúan (conflictos, competencia, rivalidad, etc.) y se comunican, el liderazgo, entre otros.
Definición
Méndez (2006, citado en García Solarte, 2009) manifiesta que el origen del clima organizacional está en la sociología; en donde el concepto de organización dentro de la teoría de las relaciones humanas enfatiza la importancia del hombre en su función del trabajo y por su participación en un sistema social. Brunet (1987, citado en Rodriguez, 2016) afirma que la definición de clima organizacional fue introducida por primera vez en el área de psicología organizacional por Gellerman en 1960. Muchos autores consideran que el concepto de clima está influenciado por dos grandes escuelas de pensamiento: la Escuela de Gestalt y la Escuela Funcionalista.
12 Autoras: Mariana Valdés- Chiara Sclippa

El enfoque de la Escuela de Gestalt está centrado en la organización de la percepción, mencionando que “el todo es mayor que la suma de sus partes”, y considera que los individuos están influenciados por la percepción que tienen ellos mismos sobre su entorno y esto influye en el comportamiento de un empleado. En cambio, la Escuela Funcionalista fórmula que “el pensamiento y comportamiento de cada individuo depende del ambiente que lo rodea y las diferencias individuales juegan un papel importante en la adaptación del individuo a su medio” (Roldán, 2019, pág. 19).
En la actualidad y muchos años después de que comenzara a caracterizar el clima organizacional, no existe un grado de consenso sobre una única definición.
Dessler (1996, citado en Sandoval, Magaña y Surdez Pérez, 2013) menciona que no existe un consenso en cuanto al significado del término de clima organizacional, sino que las definiciones existentes giran alrededor de factores organizacionales objetivos como estructura, políticas y reglas, hasta atributos subjetivos como la cordialidad y el apoyo.
Likert y Gibson (1986, citados en García Solarte, 2009) plantean que el clima organizacional es el término utilizado para describir la estructura psicológica de las organizaciones. El clima es la sensación, personalidad o carácter del ambiente de la Organización, es una cualidad relativamente duradera del medio ambiente interno de una organización que experimentan sus miembros, influye en su comportamiento y puede describirse en términos de los valores de una serie particular de características o atributos de la organización.
Góngora et. al. (2012), afirman que “el clima organizacional es la percepción de un conjunto de atributos de una organización los cuales ejercen influencia sobre los comportamientos, el rendimiento y la satisfacción de los individuos” (pág. 1).
Chiavenato (2009) describe al clima organizacional como una de las características de la cultura de una organización, definiéndola como “la sensación que transmite el local, la forma en que interactúan las personas, el trato a los clientes y proveedores, etcétera” (pág. 126). En otras palabras, el autor lo define como “la calidad o la suma de características ambientales percibidas o experimentadas por los miembros de la organización, e influye poderosamente en su comportamiento” (Chiavenato, 2009, pág. 261).
En general, el clima laboral se entiende como una variable que actúa entre el contexto organizativo, en su más amplio sentido, y la conducta que presentan los miembros de la comunidad laboral, intentando racionalizar qué sensaciones experimentan los individuos en el desarrollo de sus actividades en el entorno del trabajo (Patterson et al. 2005, citado en Olaz, 2013).
Olaz (2013) menciona que son varios los elementos a considerar cuando hablamos de clima organizacional:
● El clima puede considerarse, desde un punto de vista funcional, como variable dependiente de otras variables como la comunicación, la motivación, el liderazgo y el trabajo en equipo. Sin embargo, desde otra perspectiva, el clima también puede convertirse en variable independiente de otros aspectos relacionados como ser el nivel de desempeño, la productividad y el desarrollo organizativo, entre otras. Esta doble perspectiva convierte al clima en efecto y causa a la vez de cuántas relaciones puedan establecerse en un mapa de categorías.

● Es el resultado de un proceso generalmente fraguado en el tiempo y que suele estar influido por las propias inercias culturales de la organización (creencias, comportamientos, valores, visión y códigos éticos).
● Puede advertirse como un fenómeno exterior al individuo, no obstante, su grado de percepción puede variar en función de los umbrales de percepción de cada persona, siendo, en ocasiones, divergentes las interpretaciones que pueden hacerse del mismo, esto es, no todo el mundo necesariamente lo percibe de igual modo y manera.
● El clima laboral se encuentra vinculado a la satisfacción-insatisfacción en el puesto de trabajo.
En este sentido, Chiavenato (2009) sostiene que cuando las personas se encuentran muy motivadas, el clima organizacional mejora y se traduce en relaciones satisfactorias.
El concepto de clima organizacional abarca una amplia gama de factores ambientales que influyen en la motivación. Se refiere a las propiedades motivacionales del ambiente de la organización, es decir, a aquellos aspectos de la organización que provocan distintas clases de motivación en sus miembros. Así, el clima organizacional es favorable cuando satisface las necesidades personales de las personas y mejora su ánimo. En cambio, es desfavorable cuando produce frustración porque no satisface esas necesidades. El clima organizacional y la motivación de las personas se influyen y realimentan entre sí (2009, pág. 261).
Si bien no existe un gran grado de consenso sobre una unificación en la definición, todas las teorías analizadas coinciden en tres elementos fundamentales:
● la percepción: que se refiere al proceso por el cual los individuos a través de los sentidos reciben, organizan e interpretan sus impresiones sensoriales a fin de darle un significado a su ambiente;
● los factores organizacionales: entendidos como aquellos elementos de la organización que se consideran influenciadores directos de la motivación y desempeño de los empleados y afectan la consecución de los objetivos organizacionales; y
● El comportamiento organizacional: interpretado como la manera en que las personas de forma individual y grupal actúan en las organizaciones (Garcia Solarte, 2009).
Variables a considerar en su estudio
Góngora et al. (2012), sostienen que no existe un consenso sobre las variables que definen o componen el clima organizacional.
Como explica Zárate (2016), se han identificado tres formas diferentes de investigación sobre el fenómeno clima que dan lugar a tres acepciones distintas:
● Enfoque objetivo: se suele denominar medida múltiple de los atributos organizacionales y postula que los factores determinantes del clima son producto de un diseño proyectado o deliberado. Lo considera como un conjunto de características que describen a una organización y brindan un marco de referencia objetivo y con cierta estabilidad en el tiempo que influye en el comportamiento de los individuos. El clima se asimila a un agrupamiento objetivo de atributos físicos organizacionales. Entonces la metodología de investigación se basa en medir ciertos componentes como el tamaño, la estructura, el tipo de liderazgo, la complejidad de los sistemas. ● Enfoque subjetivo: denominado por ciertos autores como medida perceptiva de los atributos individuales, define al clima como un elemento o atributo individual relacionado con los particulares valores y motivos de los individuos más que con las características de la organización. Así el clima se vuelve función de las características personales. Esta idea implica que el individuo percibe el clima organizacional en función de las necesidades que ésta le puede satisfacer. Por ello, el clima no puede ser estable en el tiempo, ni uniforme porque cambia en función del humor de los individuos a los que se refiere. Esta definición es poco usada en las investigaciones. ● Enfoque integral: los enfoques más recientes integran las dos perspectivas anteriores, es decir, los aspectos estructurales y los subjetivos. Se lo denomina “medida perceptiva de los atributos organizacionales”. Desde esta perspectiva dentro del clima se reconoce la influencia de los factores estructurales intervinientes, tales como la estructura orgánica, el liderazgo, la asignación de tareas, el tamaño, pero remarcando que estos son seleccionados, modificados, “tamizados” por una estimación global que hace el individuo. Las variables de la organización interactúan con la personalidad del individuo para producir las percepciones que definen el clima. Por ello podemos decir que la percepción del clima es función de las características del individuo que percibe, de las características de la organización y de la interacción de estos dos elementos. Es la definición más usada por los investigadores. Según Franklin y Krieger (2011), el clima organizacional puede estudiarse a través de:
a) Análisis de las expectativas personales ● El contrato psicológico.
Es un convenio implícito que determina las expectativas mutuas entre individuo y organización. Suele renegociarse de manera periódica, y en su evolución se producen intercambios de valores que reflejan la transformación de la cultura organizacional. Por ejemplo, las personas se casan, tienen hijos y sus valores respecto de la estabilidad y la seguridad social varían. La organización evoluciona, y después de haber venido gestionándose por normas podría pasar a un modelo de gestión por resultados y por competencias de sus recursos humanos, lo cual la llevará a replantear el contrato psicológico con su personal.
Éstas son algunas de las formas en que se define el contrato psicológico y se pautan la cultura organizacional, el buen trato, el desarrollo de la autoestima y el fomento a la autorrealización, el grado en que los empleados son instados a asumir innovaciones y riesgos, o por lo contrario a mantener una actitud cauta y conservadora.
Otras variables susceptibles de verse modificadas son: la orientación de la organización al cliente interno y externo; la promoción o censura del trabajo en equipo; la sujeción a normas y procedimientos o la propensión a favorecer las iniciativas y el cumplimiento de los objetivos y metas; la valoración de los fines de sistema o estratégicos. Cada una de estas elecciones dará lugar a diferentes culturas que incidirán sobre el grado de eficiencia, productividad y creatividad de la organización, y generarán –en consecuencia– una cultura participativa e innovadora abierta al cambio, o estructuras burocráticas, ritualistas, conservadoras y refractarias a la innovación.
● Sistemas de remuneraciones, recompensas e incentivos. Si a los miembros de una organización o a los integrantes de un equipo se los remunera igual, obtengan o no ciertos logros, mantendrán una cultura burocrática y limitarán su cooperación a dicho nivel salarial sin desarrollar mayor iniciativa; en contraste, si se los remunera o recompensa por logros desarrollarán una cultura orientada al cumplimiento de éstos, y se enfocarán a desarrollar iniciativas y obtener resultados. Si las recompensas son justas y equitativas, los miembros valorarán la ecuanimidad sistema de recompensas y se establecerá una cultura de esfuerzo; en cambio, si predomina la arbitrariedad y el “amiguismo ”, se establecerá una cultura de favoritismo.
● Desarrollo de carrera y competencias. Si se establece un plan de carrera y se fomenta y remunera el desarrollo de competencias con cierta tolerancia a los errores, las personas estarán más motivadas a capacitarse y progresar en la organización, y se establecerá una cultura de aprendizaje organizacional.
b) Análisis de las perspectivas grupales Las expectativas de grupos, subgrupos, equipos e individuos, aunadas a la posibilidad de su satisfacción, también inciden en la cultura de la organización. Si existe una cultura competitiva se manifestarán conflictos entre individuos y grupos; en cambio, si se fomenta el trabajo en equipo la cultura será cooperativa.
c) Relaciones de autoridad y estilos de liderazgo ● Organización autoritaria. Si las relaciones entre niveles son formales y burocráticas y el estilo de liderazgo es autoritario, se desarrollará una cultura de orden y control, regida por normas rígidas, con sanciones por el mal desempeño o por el desvío de reglas y órdenes. El clima será conservador y los integrantes no asumirán riesgos ni se comprometerán con la organización más allá del cumplimiento de las reglas formales. ● Organización paternalista. Si el sistema de relaciones es autoritario benévolo y el liderazgo es paternalista, la cultura resultante valorará cierta informalidad, con mayor comprensión de los problemas particulares. Se crearán relaciones cordiales y amistosas, se buscará evitar el conflicto creando cálidas relaciones personales con los subalternos, y el clima será permisivo. ● Organización participativa. Si la organización tiene una estructura horizontal7 en donde se adjudica cierto nivel de responsabilidad a las personas y se estimula un liderazgo participativo, la cultura resultante será de informalidad, pero con normas de alto rendimiento para individuos y equipos. Se fomentará la innovación y el aprendizaje, y se implementarán sistemas de recompensas individuales y de equipo. Se premiarán el rendimiento y la cooperación en el trabajo; se alentará la competencia positiva, pero se censurará la negativa y el conflicto; se buscará la aceptación de riesgos pautados; se fomentará la creatividad, la innovación y la experimentación controlada, y se estimulará el orgullo de pertenencia a la organización. d) Los líderes Son quienes personifican los valores de la cultura y sirven como modelo que los empleados pueden seguir. En 1930 Chester Barnard afirmó: “El gerente es antes que nada un administrador de valores organizacionales”. El papel del líder moderno no se percibe como el de un autócrata ajeno a los valores y basado de manera exclusiva en la jerarquía; por el contrario, se concibe como un rol activamente dirigido a la búsqueda de valores genuinos, a su proyección, y a la constitución de identificaciones organizacionales en torno de ellos.
Los administradores, en especial los de nivel superior, contribuyen a crear el clima empresarial, y sus valores influyen en el proceso. En este sentido, el término valor puede definirse como “la creencia duradera sobre lo que es apropiado y lo que no lo es”. Los valores guían las acciones y el comportamiento de los empleados, instándolos a cumplir los objetivos de la organización; además, conforman una ideología que se traduce en las decisiones diarias. En muchas organizaciones exitosas los líderes corporativos, impulsados por sus valores, sirven como modelos de los roles a desempeñar, establecen los estándares para el desempeño, y motivan a los empleados, fungiendo también como referentes en el entorno externo.
e) Características de la función puesto-tarea La manera en que se organiza el trabajo y se asume la tarea determina una cultura y una productividad organizacional particulares. Si el trabajo se organiza individualmente o se agrupa por áreas afines mediante un patrón de relaciones y deberes especificados en diagramas organizacionales y manuales de procedimientos, se tendrá una organización con cultura burocrática orientada más a cumplir con las normas que preocupada por los resultados; si se le organiza en función de objetivos estratégicos que se desgranan en unidades de objetivos y resultados estructurados como equipos de trabajo, se tendrá una organización con una cultura “adhocrática” abierta al aprendizaje y a la innovación, orientada a obtener logros significativos.
f) Resolución de conflictos Se manifiesta en la manera como la organización aborda sus conflictos internos, ya sean de discriminación (sexual, racial, religiosa o hacia las minorías), jerárquicos, entre las áreas, intergrupales, interpersonales, etc. Según sea el proceso de resolución de los mismos, se generará una cultura de negociación y mediación, o de resolución autoritaria e imposición.
Por otro lado, Góngora y Nóbile (citados en Carrillo Punina, 2019) establecen 8 variables para el diagnóstico del clima organizacional que comprenden el enfoque integral citado anteriormente, las cuales son descritas en el cuadro nº1.
Cuadro Nº1: Variables de clima organizacional por Góngora y Nóbile

Fuente: Tomado de Carrillo Punina, 2019, pág. 28
Por su parte, Likert estudia el clima en las organizaciones en relación a cuatro variables: 1) proceso decisorio, 2) sistema de comunicaciones, 3) relaciones interpersonales y 4) sistema de recompensas y castigos. La interacción de estas variables trae como consecuencia la determinación de los tipos de clima organizacional, así como de cuatro sistemas y en cada uno de los sistemas administrativos, esas cuatro variables presentan diferentes características (Roldan, 2019). Como expone García Solarte:
La medición del clima se puede ver como un proceso complejo debido a que abarca un gran número de factores que depende de cada organización y sus necesidades o particularidades, es sensible porque cualquiera de los factores puede afectar la percepción de clima e incidir en gran medida en el mismo, y dinámico porque cambia constantemente y permite ser mejorado con acciones correctivas (2009, pág. 56).
Tipos de clima “La teoría de Likert es una de las más dinámicas y explicativas del clima. Postula el surgimiento y el establecimiento del clima participativo como el que puede facilitar la eficacia individual y organizacional” (Roa Rojas, 2004, pág. 15). Los 4 tipos de clima definidos por Likert se caracterizan en el cuadro nº 2.
Cuadro Nº 2: Tipos de clima organizacional basado en el modelo de Likert (1968)

Fuente: Chiavenato (2011, en Rodriguez, 2016)
Los cuatro sistemas propuestos por Likert tienen la ventaja de mostrar las diversas y graduales alternativas existentes para administrar empresas. Destaca que los cuatro sistemas no tienen límites definidos entre sí, por lo que una empresa puede estar situada por encima del sistema 2 y por debajo del sistema 3, o sea, alrededor del 2.5; por ejemplo, puede actuar como 2 en el proceso decisorio y como 3 en los sistemas de recompensas (Roldán, 2019, pág. 27).
Diagnóstico del clima organizacional
Carrillo Punina (2019) hace mención a dos instrumentos que posibilitan el diagnóstico del clima organizacional:
1) Cuestionario Litwin y Stringer: Los autores desarrollan un cuestionario que se basa en la teoría motivacional de McClelland con el propósito de describir las percepciones de los miembros en la organización y, su comportamiento en el ambiente laboral. El instrumento que consta de 50 preguntas busca identificar la relación entre clima y liderazgo, analizar los efectos del clima en la motivación y establecer la influencia del clima sobre la satisfacción personal y el desempeño. En definitiva, las dimensiones de análisis son la estructura en la organización, responsabilidad, recompensa, riesgo, apoyo y calidez, normas, conflicto, identidad y lealtad.
2) Cuestionario de Rensis Likert: Likert (1969) diseña un cuestionario denominado sistema de organización que sirve para conocer el perfil organizacional, identificar las relaciones de causa-efecto entre clima y sus variables. De esta manera, Likert define cuatro sistemas de gestión que determinan un tipo de clima cerrado de estructura rígida compuesto por los sistemas autoritarismoexplorador y, autoritarismo-paternalista y; el clima abierto de estructura flexible que se describe en los sistemas consultivos y participación en grupo. En fin, el instrumento cuenta con dimensiones de métodos de mando, fuerzas motivacionales, procesos de comunicación, influencia, toma de decisiones, planificación, control y, objetivos de rendimiento y mejora.
