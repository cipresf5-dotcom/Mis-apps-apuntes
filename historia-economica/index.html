<title>Cuaderno de Historia Económica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7E3D4; --surface:#F4F1E6; --surface-2:#DDD8C5; --raised:#FBF9F1;
  --ink:#22241F; --ink-soft:#54564B; --ink-faint:#83816F;
  --border:#C8C2AA; --border-soft:#D9D4C0;
  --accent:#AD4A26; --accent-ink:#7C3419; --accent-soft:#EEDCCB;
  --teal:#2B6B5E; --teal-soft:#DCE7DF; --teal-ink:#194138;
  --gold:#A87A24; --gold-soft:#EFE3C3;
  --danger:#9A3E3E;
  --font-display:'Fraunces',ui-serif,Georgia,serif;
  --font-body:'Archivo',ui-sans-serif,system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',monospace;
  --shadow-card:0 1px 2px rgba(30,25,10,.06), 0 6px 20px -8px rgba(30,25,10,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171A; --surface:#1C1F23; --surface-2:#262A2F; --raised:#20242A;
    --ink:#EDE9DC; --ink-soft:#B9B4A2; --ink-faint:#7D7A6E;
    --border:#33373D; --border-soft:#2A2E34;
    --accent:#E08A5B; --accent-ink:#F3B893; --accent-soft:#33251C;
    --teal:#5FAE9C; --teal-soft:#1B2B27; --teal-ink:#9BD4C4;
    --gold:#D8AC5C; --gold-soft:#2E2716;
    --danger:#E3908F;
    --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#15171A; --surface:#1C1F23; --surface-2:#262A2F; --raised:#20242A;
  --ink:#EDE9DC; --ink-soft:#B9B4A2; --ink-faint:#7D7A6E;
  --border:#33373D; --border-soft:#2A2E34;
  --accent:#E08A5B; --accent-ink:#F3B893; --accent-soft:#33251C;
  --teal:#5FAE9C; --teal-soft:#1B2B27; --teal-ink:#9BD4C4;
  --gold:#D8AC5C; --gold-soft:#2E2716;
  --danger:#E3908F;
  --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -10px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:15.5px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft); color:var(--accent-ink);}
a{color:var(--teal);}
h1,h2,h3,h4{font-family:var(--font-display); text-wrap:balance; margin:0; color:var(--ink); font-weight:700;}
p{margin:0 0 1em; max-width:66ch;}
button{font-family:inherit; cursor:pointer;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px;}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}

/* ---------- shell ---------- */
.app-shell{
  display:grid; grid-template-columns:322px 1fr; min-height:100vh;
}
@media (max-width:880px){
  .app-shell{grid-template-columns:1fr;}
  .sidebar{position:fixed; inset:0 20% 0 0; z-index:40; transform:translateX(-101%); transition:transform .25s ease;}
  .sidebar.open{transform:translateX(0);}
  .sidebar-scrim{display:none; position:fixed; inset:0; background:rgba(10,10,8,.4); z-index:39;}
  .sidebar-scrim.open{display:block;}
  .menu-btn{display:inline-flex !important;}
}

/* ---------- sidebar ---------- */
.sidebar{
  background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; height:100vh; position:sticky; top:0;
}
.sidebar-head{padding:22px 20px 14px; border-bottom:1px solid var(--border-soft);}
.brand{display:flex; align-items:baseline; gap:8px; margin-bottom:3px;}
.brand-mark{font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; color:var(--accent); border:1px solid var(--accent); border-radius:3px; padding:2px 5px;}
.brand-title{font-family:var(--font-display); font-weight:700; font-size:18px; letter-spacing:-.01em;}
.brand-sub{font-size:12.5px; color:var(--ink-faint); margin-top:2px;}
.search-wrap{padding:14px 16px 8px;}
.search-input{
  width:100%; padding:9px 12px; border-radius:8px; border:1px solid var(--border);
  background:var(--raised); color:var(--ink); font-size:13.5px; font-family:var(--font-body);
}
.search-input::placeholder{color:var(--ink-faint);}
.overall-progress{padding:2px 16px 12px;}
.op-row{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-faint); font-family:var(--font-mono); margin-bottom:5px; letter-spacing:.03em;}
.op-track{height:5px; border-radius:3px; background:var(--surface-2); overflow:hidden;}
.op-fill{height:100%; background:linear-gradient(90deg,var(--teal),var(--accent)); border-radius:3px; transition:width .3s ease;}

.nav-scroll{flex:1; overflow-y:auto; padding:6px 10px 10px;}
.nav-static{padding:3px 6px 8px;}
.nav-link{
  display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:8px; font-size:13.5px;
  color:var(--ink-soft); text-decoration:none; font-weight:600;
}
.nav-link svg{flex:none; opacity:.75;}
.nav-link:hover{background:var(--surface-2); color:var(--ink);}
.nav-link.active{background:var(--accent-soft); color:var(--accent-ink);}

.unit-block{border-radius:10px; margin-bottom:3px;}
.unit-head{
  display:flex; align-items:center; gap:10px; width:100%; padding:9px 8px; border:none; background:none;
  border-radius:9px; text-align:left; color:var(--ink);
}
.unit-head:hover{background:var(--surface-2);}
.unit-tab{
  font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--surface);
  background:var(--ink-soft); border-radius:5px; width:24px; height:20px; display:flex; align-items:center; justify-content:center; flex:none;
}
.unit-block.u1 .unit-tab,.unit-block.u1 .up-fill{background:var(--accent);}
.unit-block.u2 .unit-tab,.unit-block.u2 .up-fill{background:var(--teal);}
.unit-block.u3 .unit-tab,.unit-block.u3 .up-fill{background:var(--gold);}
.unit-block.u4 .unit-tab,.unit-block.u4 .up-fill{background:var(--accent);}
.unit-block.u5 .unit-tab,.unit-block.u5 .up-fill{background:var(--teal);}
.unit-block.u6 .unit-tab,.unit-block.u6 .up-fill{background:var(--gold);}
.unit-titlewrap{flex:1; min-width:0;}
.unit-name{font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.unit-range{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint);}
.unit-chevron{flex:none; transition:transform .18s ease; opacity:.6;}
.unit-block.open .unit-chevron{transform:rotate(90deg);}
.unit-progress-track{height:3px; background:var(--surface-2); border-radius:2px; margin:2px 8px 6px; overflow:hidden;}
.up-fill{height:100%; border-radius:2px;}
.section-list{list-style:none; margin:0; padding:0 0 6px 34px; display:none;}
.unit-block.open .section-list{display:block;}
.section-link{
  display:flex; align-items:center; gap:7px; padding:6px 8px; margin:1px 0; border-radius:7px;
  font-size:12.5px; color:var(--ink-soft); text-decoration:none; border-left:2px solid transparent;
}
.section-link:hover{background:var(--surface-2); color:var(--ink);}
.section-link.active{color:var(--accent-ink); border-left-color:var(--accent); background:var(--accent-soft);}
.dot{width:6px; height:6px; border-radius:50%; background:var(--border); flex:none;}
.dot.done{background:var(--teal);}

/* ---------- topbar / main ---------- */
.main{min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:10; background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--border-soft);
  display:flex; align-items:center; gap:12px; padding:12px 28px;
}
.menu-btn{display:none; align-items:center; justify-content:center; width:34px; height:34px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:var(--ink);}
.breadcrumb{font-family:var(--font-mono); font-size:12px; color:var(--ink-faint); letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.breadcrumb b{color:var(--ink-soft); font-weight:600;}
.topbar-spacer{flex:1;}
.pill-btn{
  display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:999px; border:1px solid var(--border);
  background:var(--surface); color:var(--ink-soft); font-size:12.5px; font-weight:600; white-space:nowrap;
}
.pill-btn:hover{border-color:var(--accent); color:var(--accent-ink);}
.pill-btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.pill-btn.primary:hover{opacity:.92;}

.view{padding:34px 30px 90px; max-width:900px; margin:0 auto; width:100%;}

/* ---------- home ---------- */
.hero{margin-bottom:34px;}
.eyebrow{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:10px;}
.hero h1{font-size:clamp(28px,4vw,40px); line-height:1.08; margin-bottom:14px;}
.hero p.lead{font-size:16px; color:var(--ink-soft); max-width:62ch;}

.timeline-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px 22px 12px; box-shadow:var(--shadow-card); margin:26px 0 34px;}
.timeline-card h3{font-size:14px; font-family:var(--font-body); font-weight:700; color:var(--ink-soft); margin-bottom:10px;}
.timeline-svg{width:100%; height:auto; display:block;}
.tl-band.u1{fill:var(--accent);} .tl-band.u2{fill:var(--teal);} .tl-band.u3{fill:var(--gold);}
.tl-band.u4{fill:var(--accent);} .tl-band.u5{fill:var(--teal);} .tl-band.u6{fill:var(--gold);}
.tl-band{opacity:.88;}
.tl-num{font-family:var(--font-mono); font-size:10px; fill:var(--ink-faint); letter-spacing:.04em;}
.tl-axis,.tl-tick{stroke:var(--border);}
.tl-label{fill:var(--ink-faint); font-family:var(--font-mono); font-size:10.5px;}
.milestone-row{display:flex; flex-wrap:wrap; gap:7px; margin-top:16px; padding-top:16px; border-top:1px solid var(--border-soft);}
.milestone-chip{font-size:11.5px; color:var(--ink-soft); background:var(--surface-2); border-radius:999px; padding:5px 11px 5px 9px; display:inline-flex; gap:6px; align-items:center;}
.milestone-chip b{font-family:var(--font-mono); color:var(--accent); font-weight:600;}

.howto{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:38px;}
@media (max-width:700px){.howto{grid-template-columns:1fr;}}
.howto-item{background:var(--surface); border:1px solid var(--border-soft); border-radius:12px; padding:16px 17px;}
.howto-num{font-family:var(--font-mono); font-size:11px; color:var(--accent); font-weight:600; margin-bottom:6px;}
.howto-item h4{font-size:14px; margin-bottom:5px;}
.howto-item p{font-size:13px; color:var(--ink-soft); margin:0;}

.section-heading{font-size:13px; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.08em; margin:0 0 14px;}
.unit-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
@media (max-width:700px){.unit-grid{grid-template-columns:1fr;}}
.unit-card{
  text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 19px;
  display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow-card);
  text-decoration:none; color:inherit;
}
.unit-card:hover{border-color:var(--accent);}
.unit-card-top{display:flex; align-items:center; justify-content:space-between;}
.unit-card-tab{font-family:var(--font-mono); font-size:12px; font-weight:700; padding:3px 8px; border-radius:5px; color:#fff;}
.unit-card.u1 .unit-card-tab{background:var(--accent);}
.unit-card.u2 .unit-card-tab{background:var(--teal);}
.unit-card.u3 .unit-card-tab{background:var(--gold);}
.unit-card.u4 .unit-card-tab{background:var(--accent);}
.unit-card.u5 .unit-card-tab{background:var(--teal);}
.unit-card.u6 .unit-card-tab{background:var(--gold);}
.unit-card-range{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint);}
.unit-card h4{font-size:16.5px; line-height:1.25;}
.unit-card p{font-size:13px; color:var(--ink-soft); margin:0;}
.unit-card-progress{margin-top:auto; padding-top:6px;}
.ucp-track{height:4px; border-radius:2px; background:var(--surface-2); overflow:hidden;}
.ucp-fill{height:100%; border-radius:2px;}
.unit-card.u1 .ucp-fill{background:var(--accent);}
.unit-card.u2 .ucp-fill{background:var(--teal);}
.unit-card.u3 .ucp-fill{background:var(--gold);}
.unit-card.u4 .ucp-fill{background:var(--accent);}
.unit-card.u5 .ucp-fill{background:var(--teal);}
.unit-card.u6 .ucp-fill{background:var(--gold);}
.ucp-label{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); margin-top:4px;}

/* ---------- section content ---------- */
.crumb-eyebrow{font-family:var(--font-mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:10px;}
.article-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:20px; padding-bottom:20px; border-bottom:1px solid var(--border-soft);}
.article-head h1{font-size:clamp(24px,3vw,32px); line-height:1.15;}
.study-toggle{
  display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:10px; border:1px solid var(--border);
  background:var(--surface); font-size:12px; font-weight:600; color:var(--ink-soft); white-space:nowrap; flex:none;
}
.study-toggle input{width:15px; height:15px; accent-color:var(--teal);}
.study-toggle.done{border-color:var(--teal); color:var(--teal-ink); background:var(--teal-soft);}

.prose h2{font-size:19px; margin:30px 0 12px;}
.prose h2:first-child{margin-top:0;}
.prose h3{font-size:15.5px; margin:22px 0 8px; color:var(--ink);}
.prose p{color:var(--ink); font-size:15px;}
.prose ul,.prose ol{margin:0 0 1em; padding-left:22px; max-width:64ch;}
.prose li{margin-bottom:5px; font-size:15px;}
.prose strong{color:var(--ink); font-weight:700;}
.prose em.tag{
  font-style:normal; font-family:var(--font-mono); font-size:12.5px; background:var(--surface-2); color:var(--ink-soft);
  padding:1px 6px; border-radius:4px;
}

.callout{border-radius:12px; padding:16px 18px; margin:20px 0; border:1px solid var(--border-soft);}
.callout-terms{background:var(--gold-soft); border-color:color-mix(in srgb, var(--gold) 40%, transparent);}
.callout-recap{background:var(--teal-soft); border-color:color-mix(in srgb, var(--teal) 35%, transparent);}
.callout-link{background:var(--accent-soft); border-color:color-mix(in srgb, var(--accent) 35%, transparent);}
.callout h4{font-size:12px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:7px;}
.callout-terms h4{color:var(--gold);}
.callout-recap h4{color:var(--teal-ink);}
.callout-link h4{color:var(--accent-ink);}
.term-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 18px;}
@media (max-width:640px){.term-grid{grid-template-columns:1fr;}}
.term-item dt{font-weight:700; font-size:13px; color:var(--ink);}
.term-item dd{margin:1px 0 8px; font-size:12.5px; color:var(--ink-soft);}
.callout-recap ul{margin:0; padding-left:18px;}
.callout-recap li{font-size:13.5px; color:var(--teal-ink); margin-bottom:5px;}
.callout p{font-size:13.5px; margin:0;}

.section-nav{display:flex; justify-content:space-between; gap:12px; margin-top:38px; padding-top:22px; border-top:1px solid var(--border-soft);}
.section-nav a{
  flex:1; display:flex; flex-direction:column; gap:3px; text-decoration:none; padding:12px 15px; border-radius:10px;
  border:1px solid var(--border); background:var(--surface); max-width:48%;
}
.section-nav a:hover{border-color:var(--accent);}
.section-nav a.next{text-align:right; margin-left:auto; align-items:flex-end;}
.section-nav small{font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em;}
.section-nav span{font-size:13.5px; font-weight:600; color:var(--ink);}

/* ---------- glossary ---------- */
.glossary-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
@media (max-width:700px){.glossary-grid{grid-template-columns:1fr;}}
.gloss-item{background:var(--surface); border:1px solid var(--border-soft); border-radius:11px; padding:14px 16px;}
.gloss-item dt{font-family:var(--font-display); font-weight:700; font-size:15px; margin-bottom:4px;}
.gloss-item .gloss-unit{font-family:var(--font-mono); font-size:10px; color:var(--accent); margin-left:6px;}
.gloss-item dd{margin:0; font-size:13px; color:var(--ink-soft);}

/* ---------- quiz ---------- */
.quiz-wrap{display:flex; flex-direction:column; align-items:center; gap:20px;}
.quiz-filters{display:flex; flex-wrap:wrap; gap:7px; justify-content:center;}
.chip{
  font-family:var(--font-mono); font-size:11.5px; padding:6px 11px; border-radius:999px; border:1px solid var(--border);
  background:var(--surface); color:var(--ink-soft);
}
.chip.active{background:var(--ink); color:var(--surface); border-color:var(--ink);}
:root:not([data-theme="light"]) .chip.active{background:var(--accent); border-color:var(--accent); color:#1a1006;}
:root[data-theme="dark"] .chip.active{background:var(--accent); border-color:var(--accent); color:#1a1006;}
.quiz-stats{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-faint); display:flex; gap:16px;}
.quiz-stats b{color:var(--ink);}
.card-stage{width:100%; max-width:560px; perspective:1400px; height:300px;}
.flashcard{
  width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.4,.2,.2,1); cursor:pointer;
}
.flashcard.flipped{transform:rotateY(180deg);}
.card-face{
  position:absolute; inset:0; backface-visibility:hidden; border-radius:16px; border:1px solid var(--border);
  background:var(--surface); box-shadow:var(--shadow-card); padding:30px 32px; display:flex; flex-direction:column;
}
.card-face.back{transform:rotateY(180deg); background:var(--teal-soft); border-color:color-mix(in srgb, var(--teal) 40%, transparent);}
.card-kicker{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:14px;}
.card-face.back .card-kicker{color:var(--teal-ink);}
.card-text{font-family:var(--font-display); font-size:21px; line-height:1.35; font-weight:600; flex:1; display:flex; align-items:center;}
.card-hint{font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); text-align:center;}
.quiz-actions{display:flex; gap:12px;}
.quiz-btn{padding:12px 22px; border-radius:11px; border:1px solid var(--border); background:var(--surface); font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:8px;}
.quiz-btn.no{color:var(--danger); border-color:color-mix(in srgb, var(--danger) 40%, transparent);}
.quiz-btn.yes{color:var(--teal-ink); border-color:color-mix(in srgb, var(--teal) 45%, transparent); background:var(--teal-soft);}
.quiz-empty{text-align:center; padding:50px 20px; color:var(--ink-soft);}
.quiz-round-end{text-align:center; padding:40px 20px;}
.quiz-round-end h3{font-size:22px; margin-bottom:8px;}
.quiz-round-end p{color:var(--ink-soft); margin:0 auto 20px;}

/* ---------- search results ---------- */
.search-results-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
.sr-item{display:block; padding:13px 16px; border:1px solid var(--border-soft); border-radius:10px; background:var(--surface); text-decoration:none;}
.sr-item:hover{border-color:var(--accent);}
.sr-item small{font-family:var(--font-mono); font-size:10.5px; color:var(--accent); text-transform:uppercase; letter-spacing:.05em;}
.sr-item div{font-size:14px; color:var(--ink); font-weight:600; margin-top:3px;}

.scroll-top-space{height:1px;}
</style>

<div class="sidebar-scrim" id="scrim"></div>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand"><span class="brand-mark">HE</span><span class="brand-title">Cuaderno</span></div>
      <div class="brand-sub">Historia Económica &middot; 6 unidades</div>
    </div>
    <div class="search-wrap">

      <h2>Un cambio de más de 150 años</h2>
      <p>Antes de estudiar la Argentina hay que entender el sistema en el que se insertó. El <strong>capitalismo</strong> es el sistema económico en el que individuos y empresas privadas organizan la producción e intercambian bienes y servicios a través del mercado, donde los precios —no una autoridad central— coordinan qué se produce, cómo y para quién. La <strong>Revolución Industrial</strong> es el proceso que llevó ese sistema a su forma moderna: comenzó en Inglaterra hacia 1770 por una combinación de causas agrarias (cercamientos y mejoras en el rendimiento de la tierra, que liberaron mano de obra rural), demográficas (crecimiento poblacional sostenido) e institucionales (un Estado que garantizaba propiedad privada y contratos, un sistema financiero temprano y acceso a mercados coloniales). No fue un invento puntual sino un <em class="tag">cambio estructural</em>: se transformó el modo mismo de producir, permitiendo aumentar la cantidad de bienes disponibles y acortar los tiempos de fabricación, rompiendo con el techo que imponía la producción artesanal.</p>

      <h3>Etapa 1 (1770–1850): del taller artesanal a la fábrica</h3>
      <p>El proceso avanzó por fases. Primero hubo una transformación artesanal anclada en las ciudades. Luego surgió la <strong>protoindustrialización</strong> o "sistema a domicilio": la producción ya no ocurre solo en talleres urbanos sino que se reparte también en el campo, incorporando a familias rurales como mano de obra dispersa antes de que existiera la fábrica moderna. A partir de ahí aparecen las <strong>manufacturas centralizadas</strong>, grandes establecimientos urbanos que concentran la producción, y finalmente el <strong>sistema fabril</strong>: la división de tareas dentro del proceso productivo, la idea que Adam Smith llevaría a la teoría clásica liberal como base de la ganancia de productividad (su ejemplo de la fábrica de alfileres es el caso de manual). Esta innovación organizativa —fábricas que reemplazan al taller disperso— tuvo consecuencias concretas: nuevas fuentes de energía (agua, luego carbón y vapor), el despegue de las ramas textil y metalúrgica, un aumento notable en la cantidad y variedad de bienes disponibles, migraciones internas del campo a la ciudad, y la aparición de dos clases sociales nuevas y antagónicas: el <strong>proletariado</strong> (el trabajador asalariado, sin más propiedad que su fuerza de trabajo) y el <strong>empresario industrial</strong>.</p>

      <h3>Etapa 2 (1850–1914): la Segunda Revolución Industrial</h3>
      <p>La segunda fase profundiza el proceso a escala mundial. Se consolida la <strong>alianza entre industriales e inversores</strong> del sector financiero, que permite llevar la industria a nuevas regiones del planeta; aparecen nuevas fuentes de energía (electricidad, petróleo, motor de combustión interna); y se produce una fuerte <strong>concentración económica</strong> de sectores y ramas —los primeros grandes trusts y carteles—. Es en esta etapa cuando el capitalismo industrial deja de ser un fenómeno británico para convertirse en un sistema-mundo, y es también el momento en que la Argentina se conecta con él.</p>

      <h3>Los tres pilares que arman el mercado mundial</h3>
      <p>Tres elementos integraron la economía internacional entre 1870 y 1914:</p>
      <ol>
        <li><strong>El patrón oro</strong>, como mecanismo monetario internacional.</li>
        <li><strong>Las inversiones internacionales</strong>, que financiaron la infraestructura de los países periféricos.</li>
        <li><strong>Los movimientos migratorios</strong>, que trasladaron mano de obra desde Europa hacia las "tierras nuevas".</li>
      </ol>
      <p>El <strong>patrón oro</strong> es un mecanismo que fija el valor de cada moneda nacional a una cantidad determinada de oro, garantizando así un tipo de cambio fijo entre países. Su funcionamiento exigía tres reglas: libre convertibilidad de la moneda nacional en oro al valor oficial (para lo cual el país necesitaba contar con reservas metálicas), plena libertad de entrada y salida de oro —cuyo flujo dependía del comercio exterior y de la balanza de pagos— y una oferta monetaria respaldada directamente por esas reservas. La ventaja era la estabilidad cambiaria y la seguridad en las transacciones internacionales; la desventaja, una fuerte dependencia externa: como la cantidad de dinero en circulación dependía del oro disponible, una economía con pocas reservas quedaba muy vulnerable a shocks externos que no podía controlar. Entre 1870 y 1880 la mayoría de los países centrales lo adoptaron, generando por primera vez un sistema monetario internacional común.</p>
      <p>Las <strong>inversiones internacionales</strong> circularon principalmente desde los tres grandes gigantes industriales —Gran Bretaña, Francia y Alemania— hacia territorios recientemente ocupados o conquistados, financiando la infraestructura básica que esos países periféricos no podían costear por sí mismos: industrias extractivas, comunicaciones, suministro de energía y préstamos directos a los gobiernos. Cada potencia siguió un patrón geográfico propio: Gran Bretaña privilegió los países de "población reciente" (Argentina, Australia, Canadá, donde financió sobre todo ferrocarriles y servicios públicos); Francia se concentró en el Mediterráneo y Europa oriental, y más tarde en Sudamérica, África y Asia; Alemania orientó sus capitales hacia América Latina y el Próximo Oriente.</p>
      <p>Las <strong>migraciones</strong> tuvieron dos sentidos: del campo a las ciudades dentro de cada país, y —lo más novedoso del siglo XIX— movimientos masivos de un continente a otro. Millones de europeos, empujados por la crisis agrícola y demográfica en su continente, cruzaron el Atlántico hacia las "tierras nuevas" de ultramar, entre ellas la Argentina.</p>

      <h3>1870–1914: la "paz armada" y el fin de una era</h3>
      <p>Este período de expansión convivió con una creciente carrera imperialista y armamentista entre las potencias europeas —el reparto colonial de África y Asia, el nacionalismo exacerbado— que se conoce como la "paz armada". Esa tensión estalla en la <strong>Primera Guerra Mundial</strong> (1914-1918), que cierra la etapa de expansión clásica del capitalismo industrial: rompe la división internacional del trabajo tal como se la conocía hasta entonces (centros industriales / periferias productoras de materias primas) y obliga a repensar las bases del crecimiento económico, abriendo paso a nuevas teorías económicas.</p>

      <h3>Una alternativa al capitalismo: la Revolución Rusa</h3>
      <p>En ese mismo contexto de crisis del orden liberal surge, en 1917, la <strong>Revolución Rusa</strong>, que inicia la formación del primer Estado socialista: un sistema en el que la propiedad de los medios de producción pasa a manos del Estado. Conviene conocer sus tres etapas, porque el contraste con el capitalismo occidental reaparecerá como telón de fondo a lo largo de todo el curso.</p>
      <p><strong>Etapa 1 — Comunismo de guerra:</strong> nacionalización de industrias, control centralizado de la producción, expropiación de grandes propietarios y creación de monopolios estatales. Las consecuencias fueron duras: caída de la producción agrícola e industrial, desabastecimiento, alta inflación y expansión del mercado negro, resistencia campesina reprimida y movimientos contrarrevolucionarios.</p>
      <p><strong>Etapa 2 — NEP (Nueva Política Económica):</strong> ante el fracaso del comunismo de guerra, la dirigencia soviética retrocede dos pasos para poder avanzar. Se abandona la transformación radical para resistir el aislamiento internacional tras la guerra, restablecer la colaboración entre el Estado y los campesinos, y concretar la recuperación económica apoyándose primero en la producción agrícola y luego en la industrial. Se permite nuevamente el capital privado a pequeña escala. Fue pensada como una medida transitoria, y resultó profundamente impopular entre los sectores marxistas más ortodoxos, que la vivían como una claudicación.</p>
      <p><strong>Etapa 3 — Planificación central (Stalin):</strong> se introduce la planificación económica centralizada, se renacionaliza toda la economía y se impulsa una industrialización acelerada. Se fijan planes industriales con objetivos y medios definidos desde el Estado, y se elimina la agricultura individual a favor de cooperativas campesinas (koljós). Los resultados: fuerte aumento de la tasa de inversión, crecimiento de la industria pesada (con un PBI que llegó a crecer en torno al 6% anual), expansión educativa y desarrollo de regiones antes marginales. Un dato que conviene recordar para más adelante: <strong>la URSS, con una economía cerrada al comercio mundial, quedó inmune a la crisis de 1930</strong> que sí devastó al capitalismo occidental —el tema con el que arranca la Unidad 2.</p>

      html:`
      <h2>Un territorio que se puebla y se organiza</h2>
      <p>El modelo agroexportador argentino se divide en dos etapas: la <strong>clásica (1880-1914)</strong>, que se desarrolla en esta sección, y la <strong>de transición (1914-1930)</strong>, marcada por la Primera Guerra Mundial, que se aborda en el punto 1.3. Su formación, sin embargo, arranca antes: hacia 1850 las tierras del Río de la Plata estaban, en su mayor parte, despobladas, sin asentamientos permanentes salvo comunidades indígenas trashumantes que no practicaban agricultura. Con la llegada española se instalan las primeras colonias, relativamente equilibradas entre sí en recursos —ganado de corral, principalmente— hasta que Buenos Aires, gracias a su puerto, se transforma en el centro político del territorio. Toda la actividad económica comienza a orientarse hacia allí, concentrando población asalariada en comparación con el Litoral, Córdoba y el Noroeste: es lo que suele describirse como la <strong>"atlantización" de la economía</strong> rioplatense. El proceso de formación del Estado argentino se extiende desde la Revolución de Mayo de 1810 hasta la sanción de la Constitución Nacional en 1853.</p>

      <h3>Los factores que hicieron posible el modelo</h3>
      <p>La expansión agroexportadora combinó condiciones externas e internas. Del lado externo: el desarrollo tecnológico (barcos a vapor, frigoríficos, ferrocarril), la creciente demanda de alimentos de la Europa industrializada, la disponibilidad de capitales europeos buscando colocación, y precios internacionales favorables para la producción agropecuaria. Del lado interno: las ventajas naturales de la región pampeana (clima templado, suelos fértiles), la organización institucional lograda con la Constitución de 1853, la seguridad jurídica que permitió formar un mercado interno e integrar económicamente las regiones, la pacificación del interior tras décadas de guerras civiles, y una decidida expansión territorial —la Campaña del Desierto (1878-1885) y la Guerra del Chaco contra el Paraguay (Guerra de la Triple Alianza, 1865-1870)— que fijó los límites del país e incorporó nuevas tierras productivas. A esto se sumaron políticas activas de ocupación del territorio a través de la inmigración. Políticamente, el período se sostiene sobre una alianza conservadora entre familias terratenientes que se reparten el poder provincial —la llamada "Liga de los Gobernadores"— y que domina la escena hasta 1916.</p>

      <h3>De la vaquería al frigorífico: 200 años de ganadería</h3>
      <p>La ganadería recorrió etapas bien definidas. La primera fue la <strong>vaquería</strong>: caza de ganado cimarrón (salvaje) para aprovechar solo el cuero, el primer producto de exportación de la región, sin que existiera aún propiedad organizada sobre los animales. Le sigue la etapa de la <strong>estancia</strong>, con el tasajo (carne salada, secada al sol, destinada sobre todo a alimentar esclavos en Brasil y Cuba) como producto central, elaborado en los saladeros hasta cerca de 1850. Aquí aparece la figura del gaucho y, aunque los límites de la propiedad todavía eran difusos, ya se reconoce la propiedad privada del ganado. Dentro de esta etapa se distinguen dos momentos: la <strong>estancia lanar</strong>, que a partir de inversiones extranjeras refina la oveja criolla mediante razas especiales y cuidados productivos (el tasajo convive con la lana hasta 1890, mientras la vaca queda relegada a tierras marginales); y la <strong>estancia vacuna</strong>, que nace con la aparición del frigorífico y la tecnología del congelado/enfriado, lo que permite exportar carne vacuna de calidad a Gran Bretaña. Esta innovación tiene un efecto territorial decisivo: las mejores tierras pampeanas, antes ocupadas por ovejas, pasan a manos del ganado vacuno, que se convierte en el negocio más rentable. Todo este recorrido —de la vaquería colonial al frigorífico de exportación— cubre cerca de dos siglos de historia ganadera rioplatense. Sostenerlo exigió una inversión extranjera constante: genética de razas europeas, alambrados (que además de mejorar el manejo del rodeo terminaron de consolidar la propiedad privada de la tierra) y molinos de viento para asegurar agua en zonas más secas.</p>

      <h3>La inmigración: promesa y frustración</h3>
      <p>El primer censo nacional (1869) revela una densidad de población muy baja. A partir de 1870 la política oficial busca atraer inmigración —originalmente se soñaba con colonos anglosajones o nórdicos— para fomentar la colonización agrícola. La <strong>Ley 817 de Inmigración y Colonización</strong> (1876, bajo la presidencia de Avellaneda) organiza un sistema mixto: el Estado se encarga de instalar a los recién llegados en algunas zonas, mientras que en otras actúan concesionarios privados. En la práctica, sin embargo, la inmigración llegó de manera espontánea, no planificada, empujada por una combinación de factores internos —estabilidad política y económica, fin de las guerras civiles, la eliminación del indígena que liberó tierras— y externos: la depresión económica que golpeó a Europa entre 1880 y 1890, la salida masiva de italianos y españoles, la creciente competencia de Estados Unidos en la producción agrícola mundial (que restaba oportunidades a los campesinos europeos) y la disponibilidad de capitales para financiar el pasaje transatlántico. Hacia 1914 el país alcanza unos 8.000.000 de habitantes, cuatro veces la población de 1869, con los extranjeros representando cerca del 30% del total, concentrados en la pampa húmeda y Buenos Aires.</p>
      <p>Pero muy pocos inmigrantes lograron radicarse en el campo como propietarios: la imposibilidad de acceder a la tierra —por la negativa de los grandes ganaderos a subdividir sus estancias— hizo fracasar buena parte de los proyectos de colonización agrícola. La mayoría terminó como mano de obra urbana, arrendatario o trabajador rural golondrina. Esta frustración explica, en buena medida, por qué la Argentina no reprodujo el modelo de "granja familiar" propietaria que sí se dio en Estados Unidos o Canadá, y sembró tensiones sociales que estallarían más adelante en conflictos como el Grito de Alcorta (1912).</p>

      <h3>Los tres ejes del desarrollo agrario</h3>
      <p>Tres procesos hicieron posible poner en producción la pampa húmeda. Primero, la <strong>Conquista del Desierto</strong>: eliminó la amenaza indígena, incorporó nuevas tierras al circuito productivo y, como consecuencia directa, disparó su precio —un proceso que terminó concentrando la propiedad en pocas manos, ya que fueron sobre todo inversores y familias con capital quienes pudieron comprar los lotes rematados. Segundo, el <strong>ferrocarril</strong>: incorporó tierras antes marginales, redujo drásticamente el costo del transporte y generó nuevos núcleos urbanos a lo largo de sus vías, aunque su trazado en forma de abanico, centrado en el puerto de Buenos Aires, terminó de reforzar la lógica exportadora del modelo antes que una integración territorial equilibrada. Tercero, la <strong>modificación de la actividad ganadera</strong>: la mejora genética de los planteles exigía pasturas más blandas, lo que llevó a introducir la rotación de alfalfa y cereales en los campos —y de allí nació la figura del <strong>arrendamiento</strong>: el propietario cedía la tierra a un agricultor por unos años para que la trabajara y mejorara la pastura, tras lo cual el campo volvía a la ganadería.</p>
      <p>Sobre esa base se desarrolla la agricultura: en 1880 la producción de cereales apenas alcanza a cubrir la demanda interna; hacia 1890 ya aparecen excedentes exportables de trigo, maíz y lino, y la Argentina empieza a ganarse el mote de "granero del mundo".</p>

      <h3>Moneda, bancos y la crisis de 1890</h3>
      <p>Desde 1860 la Argentina se incorpora plenamente al mercado mundial y comienza a recibir flujos de capital externo, tanto inversión privada como préstamos a los gobiernos provinciales y nacional. Puertas adentro, el sistema monetario y bancario era, antes de 1880, prácticamente anárquico: convivían distintas monedas y bancos emisores (el Banco de Buenos Aires, el Banco Hipotecario, el Banco Nacional) sin una legislación unificada sobre el papel moneda. En 1883 el presidente Roca intenta adoptar el patrón oro, pero la paridad no logra sostenerse por falta de reservas suficientes. Su sucesor, <strong>Juárez Celman</strong>, estimula fuertemente la actividad económica y atrae una ola de inversiones dejando en segundo plano la estabilidad monetaria y cambiaria. En 1887 se sanciona la <strong>Ley de Bancos Garantidos</strong>: cualquier banco podía emitir billetes siempre que depositara oro en el Tesoro nacional a cambio de bonos de respaldo. En la práctica, esto disparó la especulación: muchos bancos, sin reservas propias, pedían préstamos externos solo para poder constituir el depósito que les permitía emitir más billetes —una verdadera burbuja de crédito construida sobre crédito. El desenlace es la conocida <strong>crisis de 1890</strong> (crisis de Baring), que hunde al sistema financiero. <strong>Carlos Pellegrini</strong> asume entonces la tarea de reconstrucción: negocia con los acreedores extranjeros, crea la <strong>Caja de Conversión</strong> (1890) —un fondo destinado a respaldar la emisión de billetes— y funda el <strong>Banco de la Nación Argentina</strong> (1891). Finalmente, la <strong>Ley de Conversión de 1899</strong> adopta de manera definitiva y estable el patrón oro, cerrando dos décadas de inestabilidad monetaria y abriendo un período de solidez cambiaria que se sostendrá hasta la Primera Guerra Mundial.</p>

      <h3>El ferrocarril y la industria naciente</h3>
      <p>El ferrocarril fue, sin dudas, el cambio más drástico en el transporte del siglo XIX: permitió mover volúmenes y alcanzar velocidades impensadas hasta entonces, unificando espacios económicos del interior —como Mendoza y Tucumán— con el litoral. Su desarrollo tuvo tres etapas: inicio y consolidación (1857-1886); una etapa de "manía" especulativa (1886-1889), en la que se otorgaron concesiones de tierras de manera casi indiscriminada —65 concesiones, 24 de ellas con una garantía estatal de interés del 5%, lo que alimentó la burbuja que estalla en 1890—; y una etapa final de maduración (1890-1915). En paralelo crece un incipiente sector industrial, ligado tanto al propio modelo exportador (frigoríficos, molinos harineros) como al consumo de un mercado interno en expansión (alimentos, bebidas, construcción). Existieron además aranceles —pensados originalmente con fines fiscales, no industrialistas— que tuvieron el efecto colateral de proteger industrias regionales como la azucarera en Tucumán y la vitivinícola en Mendoza, que abastecían al mercado del litoral: un primer antecedente, aunque menor, de lo que más adelante será la industrialización por sustitución de importaciones.</p>
      `,
      terms:[

      html:`
      <h2>La Primera Guerra Mundial cierra una era</h2>
      <p>La guerra europea de 1914-1918 clausura la etapa de gran expansión y libre flujo de capitales que había caracterizado al modelo clásico. Sus efectos inmediatos sobre la Argentina fueron duros: la salida de oro y la interrupción del crédito externo provocan una recesión entre 1913 y 1917, con caída de importaciones esenciales —carbón, maquinaria— y escasez de insumos. Paradójicamente, esa misma escasez de productos extranjeros estimula, aunque de forma limitada, a la industria local (textil, metalúrgica): es una <strong>sustitución de importaciones "de emergencia"</strong>, no planificada, que además impulsa el comercio con países neutrales como Estados Unidos. A partir de 1915 la caída abrupta de las importaciones genera saldos comerciales favorables, aunque sobre un volumen total de comercio mucho menor que antes de la guerra.</p>

      <h3>El triángulo comercial imposible de cerrar</h3>
      <p>En la posguerra se consolida una estructura de comercio desequilibrada conocida como el <strong>triángulo comercial</strong>: la Argentina vende sus carnes y cereales a Gran Bretaña, pero compra manufacturas y tecnología —automóviles, maquinaria— a Estados Unidos. El problema es que Estados Unidos, proteccionista y además competidor agrícola directo de la Argentina, no le compra lo suficiente como para equilibrar esa relación: se genera así un <strong>déficit comercial con Estados Unidos</strong> que resulta muy difícil de financiar, porque la libra esterlina —la moneda en la que la Argentina cobra sus exportaciones a Gran Bretaña— pierde convertibilidad plena en la posguerra y no puede usarse libremente para pagarle a Washington. Este desajuste estructural —vender a un socio y comprar a otro que no compra de vuelta— es una tensión que reaparecerá, bajo distintas formas, a lo largo de todo el curso.</p>

      <h3>La industria empieza a diversificarse</h3>
      <p>A diferencia de los británicos, que históricamente habían invertido en ferrocarriles y servicios públicos, el capital norteamericano que llega en estos años se dirige directamente a la industria manufacturera radicada en el país, como forma de saltar las barreras arancelarias. Así se instalan nuevas ramas: frigoríficos como Swift y Armour, terminales automotrices como Ford y General Motors, laboratorios farmacéuticos, empresas eléctricas, fábricas de cemento y neumáticos. Durante los años veinte la industria crece de manera significativa —textiles, alimentos, petróleo— aunque sigue siendo una industria subordinada, complementaria del modelo agroexportador y no un proyecto de desarrollo autónomo.</p>

      <h3>La pampa llega a su límite geográfico</h3>
      <p>Hacia 1914 se agotan las tierras vírgenes de la pampa húmeda: ya no hay más frontera hacia donde expandirse horizontalmente, de modo que cualquier aumento futuro de la producción deberá venir de la productividad y la tecnología, no de sumar hectáreas nuevas. En los años veinte, tras la crisis ganadera de 1921 —una fuerte caída de los precios de la carne por el desplome de la demanda europea de posguerra—, se produce un vuelco masivo de tierras antes ganaderas hacia la agricultura (lino, maíz, trigo): es el proceso de <strong>agriculturización</strong>. Al mismo tiempo se incorporan maquinarias —tractores, cosechadoras, mayormente importadas de Estados Unidos— para reducir costos y compensar la falta de nuevas tierras.</p>

      <h3>Economías regionales bajo presión</h3>
      <p>Las economías regionales sufren en estos años la volatilidad de sus mercados: tanto la caña de azúcar de Tucumán como el vino de Mendoza enfrentan crisis de sobreproducción durante los años veinte, ya que sus mercados protegidos resultan demasiado chicos frente a una capacidad productiva que había crecido rápido. Frente a esto, el Estado fomenta nuevos <strong>cultivos industriales</strong> orientados al mercado interno —el algodón en el Chaco y la yerba mate en Misiones— tanto para sustituir importaciones como para poblar y consolidar territorios nacionales todavía poco integrados: el puente directo hacia la historia del NEA que se desarrolla en el próximo punto.</p>

      <p>Se nacionalizan servicios públicos —los ferrocarriles (comprados, en rigor, a las compañías británicas usando las libras esterlinas que la Argentina había acumulado durante la guerra sin poder gastarlas), los teléfonos— y también el BCRA, con lo cual el Estado pasa a controlar de manera plena la política de crédito. Se aumentan fuertemente los salarios reales y el consumo interno, en el marco de un incipiente Estado de Bienestar "a la criolla": derechos laborales, aguinaldo, vacaciones pagas, tribunales de trabajo.</p>

      <h2>Una economía que avanza en zigzag</h2>
      <p>Este período se caracteriza por una marcada inestabilidad macroeconómica y política: gobiernos civiles y militares se alternan sin que ninguno logre consolidarse, en un escenario condicionado por la <strong>proscripción del peronismo</strong> —el partido más votado del país no podía presentarse a elecciones—. El politólogo Juan Carlos Portantiero acuñó para esto la idea del <strong>"empate hegemónico"</strong>: ni la coalición vinculada al campo, la industria liviana y el capital extranjero, ni la coalición sindical-peronista lograban imponer de forma duradera su propio proyecto económico, y el resultado era una inestabilidad crónica que ninguna receta lograba cerrar del todo.</p>

      <h3>El ciclo "stop and go" (pare y siga)</h3>
      <p>La economía argentina de estos años funciona bajo una dinámica cíclica muy reconocible, que conviene tener clara paso a paso:</p>
      <ol>
        <li>En la fase expansiva crece la industria y el consumo interno.</li>
        <li>Eso aumenta la demanda de insumos y bienes de capital <strong>importados</strong>, que la industria local no produce.</li>
        <li>Como las exportaciones agropecuarias crecen lento —el agro sigue relativamente estancado— y las importaciones industriales crecen rápido, se genera un <strong>déficit de balanza de pagos</strong>: faltan dólares.</li>
        <li>Eso obliga a una <strong>devaluación brusca</strong> para frenar las importaciones y abaratar las exportaciones.</li>
        <li>La devaluación encarece los alimentos (muchos de ellos exportables, cuyo precio interno sube al ritmo del dólar) y reduce el salario real.</li>
        <li>Cae el consumo, entra en recesión la economía —la fase de "pare"— hasta que el equilibrio externo se restablece y el ciclo puede volver a empezar.</li>
      </ol>
      <p>Este esquema no es un accidente pasajero sino la expresión de un <strong>desequilibrio estructural</strong>: el sector agropecuario, proveedor de las divisas, crece lento y de forma casi estancada, mientras que el sector industrial, que necesita esas divisas para importar, lidera el crecimiento pero no exporta. La industria, además, avanza hacia ramas cada vez más complejas —automotriz, metalmecánica— que dependen todavía más de insumos importados, agravando el problema en cada ciclo. El economista Marcelo Diamand bautizó a este fenómeno <strong>"estructura productiva desequilibrada"</strong>, y a la falta crónica de dólares, <strong>restricción externa</strong>: es la clave analítica de toda esta unidad.</p>

      <h3>La puja distributiva</h3>
      <p>En este contexto, la inflación se instala como un mecanismo casi permanente: resulta del conflicto entre los trabajadores, que buscan recuperar el poder adquisitivo perdido con cada devaluación, y los empresarios, que trasladan sus costos a los precios para proteger su margen de ganancia. Como ningún sector logra imponerse de manera definitiva sobre el otro —el "empate" del que hablaba Portantiero—, la puja se resuelve una y otra vez a través de la suba de precios, sin resolverse nunca del todo.</p>

      <h2>Frondizi: integrar la industria hacia atrás</h2>
      <p><strong>Arturo Frondizi</strong> (1958-1962) llega a la presidencia con el respaldo tácito del voto peronista proscripto, y con un diagnóstico propio —elaborado junto a su principal asesor, Rogelio Frigerio— sobre el subdesarrollo argentino: la industria liviana ya estaba instalada, pero faltaban las industrias de base (acero, petroquímica, energía) que le dieran sustento, y la fuerte dependencia energética era uno de los cuellos de botella más urgentes.</p>

      <p>El límite del modelo llegó por el lado de siempre: la fuerte importación de maquinaria y repuestos para instalar toda esa nueva industria generó un déficit de balanza de pagos que obligó, en 1959, a un plan de estabilización ortodoxo (con Álvaro Alsogaray como ministro de Economía) que provocó una recesión y una caída del salario real —un ejemplo de manual del ciclo stop and go descripto en 3.1—. Frondizi terminó derrocado en 1962 por un golpe militar, harto de tolerar los avances electorales del peronismo que él mismo había habilitado.</p>

      <h3>Illia: gradualismo keynesiano-cepalino</h3>

      html:`
      <h2>Onganía y el Estado Burocrático Autoritario</h2>
      <p>La dictadura de <strong>Juan Carlos Onganía</strong> instaura lo que el politólogo Guillermo O'Donnell definiría luego como un <strong>Estado Burocrático Autoritario</strong>: un régimen tecnocrático que busca disciplinar a la sociedad y modernizar la economía con criterios de eficiencia técnica, suspendiendo directamente la actividad partidaria en lugar de negociar con ella.</p>

      <h3>El Plan Krieger Vasena (1967-1969): ortodoxia con herramientas heterodoxas</h3>
      <p>Combina piezas que normalmente no van juntas. Primero, una <strong>devaluación compensada</strong>: una gran devaluación (del orden del 40%), pero acompañada de <strong>retenciones</strong> (impuestos) a las exportaciones agropecuarias, que evitan que el nuevo valor del dólar se traslade por completo a los precios de los alimentos. El mecanismo es ingenioso: en lugar de que la ganancia de la devaluación quede íntegra en manos de los exportadores, el Estado se queda con una parte vía retenciones y la usa para financiar el déficit fiscal y obra pública —rompiendo, al menos temporalmente, el círculo vicioso descripto en 3.1—. Segundo, se suspenden las paritarias (la negociación colectiva de salarios) por dos años, para frenar la inflación de costos. Tercero, se lanza un vasto plan de <strong>inversión pública</strong> —represas como El Chocón, puentes, caminos— que además de estimular la demanda deja una infraestructura que perdura hasta hoy.</p>
      <p>Los resultados macroeconómicos fueron buenos —bajó la inflación, creció el PBI—, pero el plan generó un fuerte descontento social por la caída del salario real y por la asfixia que sufrieron las economías regionales y las pymes del interior, menos competitivas frente a la liberalización financiera que favorecía a los grandes conglomerados. Ese malestar estalló en el <strong>Cordobazo</strong> (mayo de 1969): una rebelión popular en Córdoba que combinó a trabajadores metalúrgicos y automotrices —indignados, entre otras cosas, por la pérdida del "sábado inglés"— con estudiantes universitarios, y que se transformó en una verdadera insurrección urbana contra la dictadura. Krieger Vasena renuncia pocos días después; la autoridad de Onganía queda herida de muerte, y el país entra en una década mucho más radicalizada y violenta, con la aparición poco después de organizaciones armadas como Montoneros y el ERP.</p>

      <h3>El retorno del nacionalismo económico con Ferrer (1970-1971)</h3>
      <p>Tras la caída de Onganía y bajo la breve presidencia de Roberto Levingston, el ministro <strong>Aldo Ferrer</strong> impulsa la <strong>"argentinización"</strong> de la economía: promueve el "Compre Nacional" —obligando al Estado a priorizar la compra a empresas locales— y busca fortalecer al capital nacional, debilitado por la extranjerización que había avanzado desde la etapa de Frondizi y Krieger Vasena, apoyándolo con líneas de crédito específicas. Es un episodio breve, parte de la desintegración política general de la "Revolución Argentina", que termina con Alejandro Lanusse convocando al Gran Acuerdo Nacional y abriendo el camino de regreso a elecciones —y, con ellas, al retorno del peronismo que ocupa la Unidad 4.</p>

      html:`
      <h2>Crisis en el NEA, tecnificación en la pampa</h2>
      <p>Mientras la pampa húmeda y el litoral industrial se transformaban con la integración vertical desarrollista, el Nordeste enfrentaba crisis y reestructuraciones profundas.</p>
      <p>La <strong>crisis del algodón</strong> golpea de lleno al "oro blanco" de Chaco y Formosa: la aparición de las fibras sintéticas —nailon, poliéster, producto de la petroquímica de posguerra— desplaza al algodón natural dentro de la industria textil, provocando una caída sostenida de precios y de superficie sembrada. El resultado es la expulsión de mano de obra rural y un éxodo hacia las ciudades o directamente hacia Buenos Aires, que se suma al proceso más amplio de migración interna que en estos años alimenta el crecimiento del conurbano bonaerense. A esto se añade una <strong>promoción industrial que termina perjudicando a la región</strong>: regímenes de fomento como el "Operativo Tucumán" o la promoción industrial en provincias como La Rioja y San Luis desincentivan que se radiquen industrias textiles en el propio NEA, impidiendo así que la región agregue valor a su propia producción primaria de algodón.</p>

      html:`
      <h2>El fin de la edad de oro del capitalismo</h2>
      <p>El período 1973-1983 marca el cierre de la "edad de oro" del capitalismo de posguerra y el comienzo de un escenario de inestabilidad y reconfiguración global. En 1971 colapsa el sistema de <strong>Bretton Woods</strong> cuando Estados Unidos suspende unilateralmente la convertibilidad del dólar en oro, generando inestabilidad cambiaria a escala mundial. A eso se suma la <strong>crisis del petróleo</strong> —primero en 1973, con el embargo de la OPEP tras la Guerra de Yom Kipur, y luego en 1979, con la Revolución Iraní— que dispara los precios del crudo. El resultado, en los países centrales, es un fenómeno hasta entonces inédito: la <strong>estanflación</strong> (estancamiento económico combinado con inflación alta), que las políticas keynesianas no lograban explicar ni resolver, porque su supuesto básico —que inflación y desempleo se mueven en sentidos opuestos— dejó de cumplirse. Esa crisis teórica abre la puerta, en la década siguiente, a las ideas económicas que van a dominar la Unidad 5.</p>

      html:`
      <h2>El último Pacto Social y su derrumbe</h2>
      <p>Tras dieciocho años de proscripción, el peronismo vuelve al poder en un clima de altísima conflictividad política, intentando reeditar la vieja alianza de clases de 1945. Bajo el ministerio de <strong>José Ber Gelbard</strong>, la política económica se organiza en torno al <strong>Pacto Social</strong>: un acuerdo tripartito entre la CGT (los trabajadores), la CGE (los empresarios nacionales) y el Estado. Su objetivo era frenar la inflación mediante el congelamiento de precios y salarios —tras un aumento inicial del 20%— y redistribuir el ingreso por consenso, no por conflicto. Al principio funcionó, y bastante bien: la inflación cae de manera drástica y la actividad económica crece en 1973 y comienzos de 1974, algo que vale la pena remarcar porque suele quedar eclipsado por lo que vino después.</p>
      <p>En paralelo se lanza el <strong>Plan Trienal para la Reconstrucción y Liberación Nacional</strong>, que busca la expansión industrial, el apoyo al capital nacional y una fuerte intervención estatal, incluyendo leyes de "argentinización" del crédito (nacionalización de los depósitos bancarios, para que el Estado decidiera a quién se prestaba) y del comercio exterior.</p>

      html:`
      <h2>Martínez de Hoz: de la industria a la valorización financiera</h2>
      <p>La dictadura cívico-militar que toma el poder en 1976 no aplica simplemente "otro" plan de estabilización: impone un cambio estructural radical, que abandona el proyecto de industrialización sostenido desde 1930 para instaurar una economía de <strong>"valorización financiera"</strong> —un modelo en el que la ganancia deja de buscarse principalmente en la producción y pasa a buscarse en la especulación y el arbitraje financiero—. El ministro <strong>José Alfredo Martínez de Hoz</strong> organiza su plan (desde el 2 de abril de 1976) en tres ejes:</p>
      <h3>1. Apertura económica</h3>
      <p>Se reducen los aranceles a la importación, exponiendo de golpe a la industria local —que se había desarrollado bajo décadas de protección— a una competencia externa desigual. El resultado es el cierre de miles de pymes y una fuerte desindustrialización, sobre todo en las ramas de mano de obra intensiva (textil, calzado).</p>
      <h3>2. Reforma financiera (1977)</h3>

      <h3>3. La "tablita" cambiaria (1978)</h3>
      <p>Un cronograma de devaluaciones programadas y decrecientes, anunciado de antemano, pensado para anclar las expectativas de inflación —si todos saben cuánto va a devaluar el peso, ajustarán precios y salarios en consecuencia—. El problema es que la inflación interna real corrió, sistemáticamente, por encima del ritmo de devaluación anunciado, lo que fue apreciando el tipo de cambio real: es el fenómeno conocido como <strong>atraso cambiario</strong> o "plata dulce" —la época en que viajar al exterior se volvió, para quien podía, sorprendentemente barato—. Eso alimentó un boom de importaciones y una creciente fuga de capitales, financiada mientras duró por los ingresos de la bicicleta financiera, hasta que la confianza se quebró: en 1981 se desata una crisis cambiaria masiva, se abandona la tablita, sobrevienen fuertes devaluaciones escalonadas y estalla una crisis bancaria de magnitud (varias entidades financieras quiebran).</p>

      <p>El costo social del modelo fue enorme: la participación de los asalariados en el ingreso nacional cae del 45% al 25%, se suprimen derechos laborales y crece la pobreza estructural, todo ello en el marco de la violencia estatal y la represión que caracterizaron a la dictadura —la disciplina social necesaria para imponer un ajuste de esta magnitud sin la resistencia política que en otros momentos había frenado reformas parecidas.</p>

      <h2>La fase terminal de la Convertibilidad</h2>
      <p>El gobierno de la Alianza (<strong>Fernando de la Rúa</strong>, 1999-2001) recibe una economía ya en recesión, con alto desempleo y fuerte endeudamiento, agravada por un factor externo poco recordado pero decisivo: la devaluación brasileña de 1999, que de un día para otro vuelve mucho menos competitivas a las exportaciones argentinas dentro del Mercosur. Para sostener el "1 a 1" el gobierno aplica ajustes fiscales —el "impuestazo", recortes de salarios estatales y jubilaciones— que resultan <strong>procíclicos</strong>: en lugar de reactivar la economía, profundizan la recesión, porque recortar el gasto público en plena caída de la actividad achica la economía más rápido de lo que reduce el déficit medido como porcentaje del PBI. Es una trampa de política económica que se discute todavía hoy.</p>
      <p>El <strong>Blindaje</strong> (diciembre de 2000) es un paquete de ayuda financiera del FMI por casi 40.000 millones de dólares, condicionado a una reforma previsional y a mayor austeridad fiscal: fracasa en recuperar la confianza de los mercados. El <strong>Megacanje</strong> (junio de 2001), bajo la gestión de Domingo Cavallo —de regreso como ministro—, canjea títulos de deuda de corto plazo por otros a plazos más largos, pero convalidando tasas de interés exorbitantes (cerca del 15% anual en dólares): compra tiempo en lo inmediato, pero aumenta la deuda futura y, paradójicamente, empeora la percepción de insolvencia del país en los mercados.</p>
      <p>En diciembre de 2001, ante la fuga masiva de depósitos bancarios, Cavallo impone el <strong>"corralito"</strong>: restricciones al retiro de dinero en efectivo. La medida paraliza buena parte de la economía informal —dependiente del efectivo para funcionar día a día— y desata el estallido social. Las jornadas del <strong>19 y 20 de diciembre de 2001</strong> terminan con la renuncia de De la Rúa —que abandona la Casa Rosada en helicóptero, una imagen que quedó grabada en la memoria colectiva— en medio de una represión violenta. El presidente interino <strong>Adolfo Rodríguez Saá</strong> declara la cesación de pagos de la deuda externa: en ese momento, el default más grande de la historia financiera hasta esa fecha. Argentina llega a tener cinco presidentes en apenas diez días, hasta que asume <strong>Eduardo Duhalde</strong>.</p>
      <p>Duhalde pone fin a la convertibilidad: devalúa el peso —que llega a cotizar cerca de 4 por dólar— y "pesifica" de manera asimétrica las deudas y los depósitos (las deudas en dólares se convierten a pesos a 1 a 1, favoreciendo a los deudores; los depósitos, a una relación menos favorable, perjudicando a los ahorristas), una medida profundamente redistributiva y legalmente muy discutida que generó litigios durante años. El costo social inmediato es enorme —el salario real cae un 30% y la pobreza supera el 50% de la población—, pero el reacomodamiento de los precios relativos que produce la devaluación, sumado a la enorme capacidad ociosa que dejó la recesión, sienta —de manera paradójica— las bases de la recuperación que viene después.</p>
      `,

      html:`
      <h2>Viento de cola, superávits gemelos y un nuevo agotamiento</h2>
      <p>Bajo los gobiernos de <strong>Néstor Kirchner</strong> y <strong>Cristina Fernández</strong>, este ciclo se caracteriza por un fuerte crecimiento inicial y la reaparición, hacia el final, de los mismos límites estructurales que atraviesan todo el curso.</p>
      <h3>Recuperación y nuevo rol del Estado (2003-2007)</h3>
      <p>El crecimiento "a tasas chinas" de estos años se explica por tres factores que conviene distinguir con precisión, porque no todos son igual de repetibles: la <strong>capacidad ociosa</strong> heredada de la crisis (fábricas que podían aumentar producción sin nueva inversión, tras años de funcionar muy por debajo de su capacidad), un <strong>tipo de cambio real alto</strong> que protegía a la industria local (justo lo contrario del atraso cambiario de la Convertibilidad), y un contexto internacional excepcionalmente favorable —el <strong>"viento de cola"</strong>— con precios récord de la soja impulsados por la demanda china: el mismo cultivo que había arrancado como una curiosidad experimental en la pampa de los años 60 (Unidad 3) se convierte ahora en el motor macroeconómico del país.</p>
      <p>Se sostienen los <strong>"superávits gemelos"</strong>: superávit fiscal, apoyado en buena medida en las retenciones a las exportaciones de soja —el mismo mecanismo que Krieger Vasena había usado en 1967 (Unidad 3), ahora reeditado— y superávit comercial, gracias al tipo de cambio competitivo y a los altos precios de exportación. El Estado interviene activamente en la economía mediante subsidios a las tarifas de servicios públicos, control de precios y una fuerte obra pública.</p>
      <h3>Desendeudamiento</h3>
      <p>La normalización de la deuda es un eje central para recuperar autonomía de política económica. El <strong>canje de 2005</strong> reestructura la deuda que seguía en default desde 2001, logrando una quita histórica de capital e intereses con una adhesión del 76% de los acreedores (los tenedores que no entraron —los "holdouts", entre ellos los llamados "fondos buitre"— seguirán litigando durante años, aunque ese conflicto excede el período de este curso). En 2006 se cancela la totalidad de la deuda con el FMI (9.500 millones de dólares) usando reservas propias, en una decisión explícitamente política: evitar los condicionamientos del organismo, revirtiendo el patrón de dependencia del FMI que atraviesa el país desde la Unidad 4.</p>
      <h3>Agotamiento del modelo (2008-2015)</h3>
      <p>Durante las presidencias de Cristina Fernández el modelo enfrenta límites crecientes. El <strong>conflicto con el campo</strong> (2008): el intento de aplicar retenciones móviles a la soja (Resolución 125) genera una crisis política mayúscula —cortes de ruta, un prolongado paro agropecuario— y termina en un empate en el Senado que desempata el voto "no positivo" del vicepresidente Julio Cobos en contra del propio gobierno: un quiebre entre el Estado y el sector que, hasta entonces, había financiado buena parte de la recuperación.</p>
      <p>Ante la crisis financiera global de 2008 (vista en 6.1), se estatizan las <strong>AFJP</strong> (los fondos de pensión privados vuelven al sistema estatal de reparto), en parte para acceder a sus activos en un momento de fuerte estrechez de liquidez. En 2012, ante un creciente déficit energético, se expropia el 51% de <strong>YPF</strong> a Repsol para recuperar el autoabastecimiento —revirtiendo, dos décadas después, la privatización de 1999 vista en la Unidad 5: otro círculo que se cierra dentro de este mismo relato—.</p>
      <p>La inflación, la pérdida del superávit energético —la Argentina pasa a ser importadora neta de energía, justo cuando comienza a explorarse el desarrollo de Vaca Muerta— y la fuga de capitales terminan drenando las reservas del Banco Central; en 2011 se impone el <strong>"cepo cambiario"</strong>, un conjunto de controles a la compra de divisas. Entre 2012 y 2015 la economía se estanca en un cuadro de "estanflación", el déficit fiscal crece financiado cada vez más con emisión monetaria, y se priorizan medidas de corto plazo para sostener el consumo sin resolver los problemas de fondo: la inflación persistente y la falta de inversión productiva.</p>
      <h3>El hilo que atraviesa las seis unidades</h3>
      <p>Es un buen punto para cerrar todo el recorrido con una idea de síntesis: desde el modelo agroexportador de 1880 hasta el cepo cambiario de 2011, la economía argentina vuelve una y otra vez sobre la misma tensión de fondo —un sector exportador sujeto a los ciclos de precios internacionales y una economía urbano-industrial que depende de insumos y bienes de capital que no puede financiar por sí misma—. Ese es, en definitiva, el núcleo de la <strong>restricción externa</strong> presentada en la Unidad 3: el problema que organiza, con matices distintos en cada época, buena parte de la historia económica argentina del último siglo y medio.</p>
      `,
      terms:[
        {t:"Viento de cola", d:"Contexto internacional excepcionalmente favorable (precios altos de exportación) que impulsa el crecimiento sin depender de reformas internas."},
        {t:"Superávits gemelos", d:"Superávit fiscal y superávit comercial simultáneos, sostenidos en retenciones y en un tipo de cambio competitivo (2003-2007)."},
        {t:"Cepo cambiario (2011)", d:"Controles a la compra de divisas impuestos ante la pérdida de reservas por inflación, déficit energético y fuga de capitales."},
      ],
