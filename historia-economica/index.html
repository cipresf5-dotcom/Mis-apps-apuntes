  {u:"u4",q:"¿Cuáles son los tres ejes del Plan Martínez de Hoz (1976)?",a:"Apertura económica, reforma financiera (1977) y la tablita cambiaria (1978)."},
  {u:"u4",q:"¿Qué es la 'bicicleta financiera'?",a:"Arbitraje: tomar deuda barata en dólares, invertir en pesos a tasas altas, y volver a dólares con ganancia gracias al tipo de cambio casi fijo de la tablita."},
  {u:"u4",q:"¿Qué decisión toma el Estado en 1982 respecto de la deuda privada?",a:"La estatiza: asume como deuda pública los compromisos externos contraídos por empresas privadas durante la bicicleta financiera."},
  {u:"u4",q:"¿Cuánto cae la participación de los asalariados en el ingreso durante la dictadura?",a:"Del 45% al 25% del ingreso nacional."},
  {u:"u5",q:"¿Qué es el Consenso de Washington?",a:"Un paquete de reformas de mercado (disciplina fiscal, privatizaciones, apertura, desregulación) impulsado por el FMI y el Banco Mundial desde fines de los 80."},
  {u:"u5",q:"¿Qué diagnóstico está detrás del Plan Austral (1985)?",a:"Que buena parte de la inflación era 'inercial' (por expectativas y contratos indexados), por eso combina congelamiento, nueva moneda (el Austral) y desagio."},
  {u:"u5",q:"¿Cómo termina el gobierno de Alfonsín?",a:"Con una hiperinflación en 1989 (4.923% anual) que lo obliga a entregar el poder a Menem cinco meses antes de lo previsto."},
  {u:"u5",q:"¿Qué diferencia estructural tiene la Convertibilidad (1991) frente a la tablita de 1978?",a:"La Convertibilidad es una restricción legal dura: por ley, el BCRA debe respaldar el 100% de la base monetaria con reservas, sin margen de emisión."},
  {u:"u5",q:"¿Qué fue el 'Efecto Tequila' (1995) y qué provocó en la Argentina?",a:"El contagio de la crisis del peso mexicano de 1994, que disparó el desempleo argentino a un pico del 18%."},
  {u:"u5",q:"¿Qué empresas emblemáticas se privatizan en los años 90?",a:"ENTEL, Aerolíneas Argentinas, la red ferroviaria e YPF (esta última en 1999, vendida a Repsol)."},
  {u:"u6",q:"¿Qué evento detona la crisis financiera global de 2008?",a:"La quiebra del banco de inversión Lehman Brothers en septiembre de 2008."},
  {u:"u6",q:"¿Qué fue el 'corralito' de diciembre de 2001?",a:"Una restricción al retiro de efectivo de los bancos que paralizó la economía informal y desató el estallido social del 19 y 20 de diciembre."},
  {u:"u6",q:"¿Qué es la 'pesificación asimétrica' de 2002?",a:"La conversión de deudas a pesos a 1 a 1 (favorable a deudores) y de depósitos a una relación menos favorable (perjudicial para ahorristas), al salir de la Convertibilidad."},
  {u:"u6",q:"¿Cuáles fueron los tres factores del crecimiento 2003-2007?",a:"Capacidad ociosa heredada de la crisis, tipo de cambio real alto, y un contexto internacional favorable ('viento de cola') con precios récord de la soja."},
  {u:"u6",q:"¿Qué son los 'superávits gemelos'?",a:"Superávit fiscal (apoyado en retenciones a la soja) y superávit comercial simultáneos, entre 2003 y 2007."},
  {u:"u6",q:"¿Qué generó la Resolución 125 (2008)?",a:"Un intento de subir las retenciones móviles a la soja que provocó un conflicto con el campo y terminó en un empate en el Senado, desempatado en contra del gobierno."},
  {u:"u6",q:"¿Qué medidas revierten privatizaciones/reformas de los 90 durante 2008-2012?",a:"La estatización de las AFJP (2008) y la expropiación del 51% de YPF a Repsol (2012)."},
  {u:"u6",q:"¿Qué controles se imponen en 2011 ante la pérdida de reservas?",a:"El 'cepo cambiario', un conjunto de restricciones a la compra de divisas."},
];

(function(){
  const UNITS = window.UNITS, GLOSSARY = window.GLOSSARY, CARDS = window.CARDS;
  const view = document.getElementById('view');
  const breadcrumb = document.getElementById('breadcrumb');
  const unitsNav = document.getElementById('unitsNav');
  const opFill = document.getElementById('opFill');
  const opPct = document.getElementById('opPct');
  const searchInput = document.getElementById('searchInput');
  const sidebar = document.getElementById('sidebar');
  const scrim = document.getElementById('scrim');
  const menuBtn = document.getElementById('menuBtn');

  const MILESTONES = [
    {y:1890,l:"Crisis de Baring"},{y:1914,l:"Primera Guerra Mundial"},{y:1929,l:"Crac de Wall Street"},
    {y:1949,l:"Crisis del modelo peronista"},{y:1955,l:"Revolución Libertadora"},{y:1969,l:"Cordobazo"},
    {y:1976,l:"Golpe y Plan Martínez de Hoz"},{y:1982,l:"Malvinas / estatización de la deuda"},
    {y:1989,l:"Hiperinflación"},{y:1991,l:"Convertibilidad"},{y:2001,l:"Crisis de diciembre"},
    {y:2008,l:"Crisis financiera global"},{y:2012,l:"Expropiación de YPF"},
  ];

  let openUnits = new Set();
  let quiz = { filter:new Set(UNITS.map(u=>u.id)), deck:[], idx:0, flipped:false, known:0, seen:0 };

  function escapeHtml(str){
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function stripHtml(html){ return html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(); }

  function getProgress(){
    try{ return JSON.parse(localStorage.getItem('he_progress')||'{}'); }catch(e){ return {}; }
  }
  function setProgress(id,val){
    const p = getProgress();
    if(val) p[id]=true; else delete p[id];
    try{ localStorage.setItem('he_progress', JSON.stringify(p)); }catch(e){}
  }
  function totalSections(){ return UNITS.reduce((a,u)=>a+u.sections.length,0); }
  function unitDoneCount(u){ const p=getProgress(); return u.sections.filter(s=>p[s.id]).length; }
  function overallDoneCount(){ const p=getProgress(); return UNITS.reduce((a,u)=>a+u.sections.filter(s=>p[s.id]).length,0); }

  function currentRoute(){
    const h = location.hash.replace(/^#\/?/,'');
    return h.split('/').filter(Boolean);
  }
  function findSection(unitId, sectionId){
    const u = UNITS.find(x=>x.id===unitId);
    if(!u) return null;
    const s = u.sections.find(x=>x.id===sectionId);
    if(!s) return null;
    return {u,s};
  }

  function closeSidebarMobile(){ sidebar.classList.remove('open'); scrim.classList.remove('open'); }

  // ---------- sidebar ----------
  function renderSidebarNav(){
    const p = getProgress();
    const route = currentRoute();
    unitsNav.innerHTML = UNITS.map(u=>{
      const done = unitDoneCount(u);
      const total = u.sections.length;
      const pct = total? Math.round(done/total*100):0;
      const isActiveUnit = route[0]==='unidad' && route[1]===u.id;
      const isOpen = openUnits.has(u.id) || isActiveUnit;
      if(isOpen) openUnits.add(u.id);
      const secs = u.sections.map(s=>{
        const active = isActiveUnit && route[2]===s.id;
        const label = s.title.replace(/^\d+(\.\d+)?\s*/,'');
        return `<li><a class="section-link ${active?'active':''}" href="#/unidad/${u.id}/${s.id}"><span class="dot ${p[s.id]?'done':''}"></span>${label}</a></li>`;
      }).join('');
      return `<div class="unit-block ${u.id} ${isOpen?'open':''}">
        <button class="unit-head" data-toggle="${u.id}" type="button">
          <span class="unit-tab">${u.num}</span>
          <span class="unit-titlewrap"><div class="unit-name">${u.title}</div><div class="unit-range mono">${u.range}</div></span>
          <svg class="unit-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <div class="unit-progress-track"><div class="up-fill" style="width:${pct}%"></div></div>
        <ul class="section-list">${secs}</ul>
      </div>`;
    }).join('');

    unitsNav.querySelectorAll('[data-toggle]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = btn.getAttribute('data-toggle');
        if(openUnits.has(id)) openUnits.delete(id); else openUnits.add(id);
        renderSidebarNav();
      });
    });

    document.querySelectorAll('.nav-link').forEach(a=>{
      const nav = a.getAttribute('data-nav');
      const active = (nav==='home' && (route.length===0 || route[0]==='home')) || route[0]===nav;
      a.classList.toggle('active', !!active);
    });

    const doneTotal = overallDoneCount(); const tot = totalSections();
    const opctv = tot? Math.round(doneTotal/tot*100):0;
    opFill.style.width = opctv+'%';
    opPct.textContent = opctv+'%';
  }

  // ---------- timeline ----------
  function renderTimeline(){
    const scale = 960/(2015-1880);
    const x = y => (20 + (y-1880)*scale).toFixed(1);
    const bandDefs = [
      {id:'u1',from:1880,to:1930},{id:'u2',from:1930,to:1955},{id:'u3',from:1955,to:1973},
      {id:'u4',from:1973,to:1983},{id:'u5',from:1983,to:1999},{id:'u6',from:1999,to:2015},
    ];
    const years = [1880,1930,1955,1973,1983,1999,2015];
    const bandsHtml = bandDefs.map((b,i)=>{
      const u = UNITS[i];
      const w = (x(b.to)-x(b.from)).toFixed(1);
      return `<rect class="tl-band ${b.id}" x="${x(b.from)}" y="66" width="${w}" height="26" rx="4"><title>${escapeHtml(u.title)} (${u.range})</title></rect>
      <text class="tl-num" x="${(parseFloat(x(b.from))+4).toFixed(1)}" y="58">${u.num}</text>`;
    }).join('');
    const axisY = 108;
    const ticksHtml = years.map(y=>{
      const anchor = y===1880 ? 'start' : (y===2015 ? 'end' : 'middle');
      return `<line class="tl-tick" x1="${x(y)}" x2="${x(y)}" y1="${axisY}" y2="${axisY+5}"/><text class="tl-label" x="${x(y)}" y="${axisY+19}" text-anchor="${anchor}">${y}</text>`;
    }).join('');
    return `<svg class="timeline-svg" viewBox="0 0 1000 132" role="img" aria-label="Línea de tiempo de las seis unidades, 1880 a 2015">
      ${bandsHtml}
      <line class="tl-axis" x1="20" x2="980" y1="${axisY}" y2="${axisY}"/>
      ${ticksHtml}
    </svg>`;
  }

  // ---------- views ----------
  function renderHome(){
    breadcrumb.textContent = 'Inicio';
    view.innerHTML = `
      <div class="hero">
        <div class="eyebrow">Cuaderno de estudio &middot; 6 unidades &middot; 1880–2015</div>
        <h1>Historia Económica Argentina</h1>
        <p class="lead">Del granero del mundo a la restricción externa crónica: un recorrido completo por el programa, con el contexto internacional y las razones detrás de cada giro de política económica — no solo qué pasó, sino por qué.</p>
      </div>
      <div class="timeline-card">
        <h3>Las seis unidades a lo largo del tiempo</h3>
        ${renderTimeline()}
        <div class="milestone-row">
          ${MILESTONES.map(m=>`<span class="milestone-chip"><b>${m.y}</b>${m.l}</span>`).join('')}
        </div>
      </div>
      <div class="howto">
        <div class="howto-item"><div class="howto-num">01</div><h4>Leé por unidad</h4><p>Cada punto del programa está desarrollado con contexto, causas y consecuencias, no solo la síntesis del apunte original.</p></div>
        <div class="howto-item"><div class="howto-num">02</div><h4>Marcá tu avance</h4><p>Tildá "estudiado" al pie de cada sección. El progreso se guarda en este navegador.</p></div>
        <div class="howto-item"><div class="howto-num">03</div><h4>Repasá con tarjetas</h4><p>El modo repaso toma preguntas de todas las unidades para practicar antes del parcial o el final.</p></div>
      </div>
      <h2 class="section-heading">Unidades del programa</h2>
      <div class="unit-grid">
        ${UNITS.map(u=>{
          const done = unitDoneCount(u); const total = u.sections.length; const pct = total? Math.round(done/total*100):0;
          return `<a class="unit-card ${u.id}" href="#/unidad/${u.id}/${u.sections[0].id}">
            <div class="unit-card-top"><span class="unit-card-tab">${u.num}</span><span class="unit-card-range mono">${u.range}</span></div>
            <h4>${u.title}</h4>
            <p>${u.blurb}</p>
            <div class="unit-card-progress">
              <div class="ucp-track"><div class="ucp-fill" style="width:${pct}%"></div></div>
              <div class="ucp-label">${done}/${total} secciones estudiadas</div>
            </div>
          </a>`;
        }).join('')}
      </div>
    `;
  }

  function renderSection(unitId, sectionId){
    const found = findSection(unitId, sectionId);
    if(!found){ location.hash = '#/home'; return; }
    const {u,s} = found;
    const idx = u.sections.findIndex(x=>x.id===s.id);
    const uidx = UNITS.findIndex(x=>x.id===u.id);
    let prevUnit=u, prevLink = idx>0? u.sections[idx-1]: null;
    if(!prevLink && uidx>0){ prevUnit = UNITS[uidx-1]; prevLink = prevUnit.sections[prevUnit.sections.length-1]; }
    let nextUnit=u, nextLink = idx<u.sections.length-1? u.sections[idx+1]: null;
    if(!nextLink && uidx<UNITS.length-1){ nextUnit = UNITS[uidx+1]; nextLink = nextUnit.sections[0]; }

    breadcrumb.innerHTML = `Unidad ${u.num} &middot; <b>${escapeHtml(u.title)}</b> &rsaquo; ${escapeHtml(s.title)}`;
    const p = getProgress();
    const isDone = !!p[s.id];
    const termsHtml = (s.terms && s.terms.length) ? `
      <div class="callout callout-terms">
        <h4>Términos clave</h4>
        <dl class="term-grid">
          ${s.terms.map(t=>`<div class="term-item"><dt>${t.t}</dt><dd>${t.d}</dd></div>`).join('')}
        </dl>
      </div>` : '';
    const recapHtml = (s.recap && s.recap.length) ? `
      <div class="callout callout-recap">
        <h4>Para recordar</h4>
        <ul>${s.recap.map(r=>`<li>${r}</li>`).join('')}</ul>
      </div>` : '';

    view.innerHTML = `
      <div class="crumb-eyebrow">Unidad ${u.num} &middot; ${u.range}</div>
      <div class="article-head">
        <h1>${escapeHtml(s.title)}</h1>
        <label class="study-toggle ${isDone?'done':''}" id="studyToggle">
          <input type="checkbox" ${isDone?'checked':''} />
          <span id="studyToggleLabel">${isDone? 'Estudiado':'Marcar como estudiado'}</span>
        </label>
      </div>
      <div class="prose">${s.html}</div>
      ${termsHtml}
      ${recapHtml}
      <div class="section-nav">
        ${prevLink? `<a href="#/unidad/${prevUnit.id}/${prevLink.id}"><small>&larr; Anterior</small><span>${escapeHtml(prevLink.title)}</span></a>`:'<div></div>'}
        ${nextLink? `<a class="next" href="#/unidad/${nextUnit.id}/${nextLink.id}"><small>Siguiente &rarr;</small><span>${escapeHtml(nextLink.title)}</span></a>`:'<div></div>'}
      </div>
    `;
    const cb = view.querySelector('.study-toggle input');
    cb.addEventListener('change', ()=>{
      setProgress(s.id, cb.checked);
      view.querySelector('#studyToggle').classList.toggle('done', cb.checked);
      view.querySelector('#studyToggleLabel').textContent = cb.checked? 'Estudiado':'Marcar como estudiado';
      renderSidebarNav();
    });
  }

  function renderGlossary(){
    breadcrumb.textContent = 'Glosario';
    const items = GLOSSARY.slice().sort((a,b)=>a.t.localeCompare(b.t,'es'));
    view.innerHTML = `
      <div class="hero">
        <div class="eyebrow">Referencia rápida</div>
        <h1>Glosario</h1>
        <p class="lead">${items.length} términos clave del programa, con la unidad donde aparecen por primera vez.</p>
      </div>
      <dl class="glossary-grid">
        ${items.map(g=>`<div class="gloss-item"><dt>${g.t}<span class="gloss-unit">${g.u}</span></dt><dd>${g.d}</dd></div>`).join('')}
      </dl>
    `;
  }

  // ---------- quiz ----------
  function buildQuizDeck(){
    let cards = CARDS.filter(c=>quiz.filter.has(c.u));
    for(let i=cards.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cards[i],cards[j]]=[cards[j],cards[i]]; }
    quiz.deck = cards; quiz.idx=0; quiz.flipped=false; quiz.known=0; quiz.seen=0;
  }
  function attachQuizFilterHandlers(){
    unitsNav && null;
    document.querySelectorAll('.chip[data-u]').forEach(ch=>{
      ch.addEventListener('click', ()=>{
        const id = ch.getAttribute('data-u');
        if(quiz.filter.has(id)){ if(quiz.filter.size>1) quiz.filter.delete(id); }
        else quiz.filter.add(id);
        buildQuizDeck();
        renderQuiz();
      });
    });
  }
  function renderQuiz(){
    breadcrumb.textContent = 'Modo repaso';
    if(quiz.deck.length===0) buildQuizDeck();
    const chips = UNITS.map(u=>`<button class="chip ${quiz.filter.has(u.id)?'active':''}" data-u="${u.id}" type="button">U${u.num}</button>`).join('');
    const header = `<div class="hero"><div class="eyebrow">Práctica activa</div><h1>Modo repaso</h1><p class="lead">Tarjetas de pregunta y respuesta para practicar antes del parcial o el final. Elegí qué unidades entran en la ronda.</p></div>`;

    if(quiz.deck.length===0){
      view.innerHTML = `${header}
        <div class="quiz-wrap">
          <div class="quiz-filters">${chips}</div>
          <div class="quiz-empty">No hay tarjetas para las unidades seleccionadas. Elegí al menos una.</div>
        </div>`;
      attachQuizFilterHandlers();
      return;
    }
    if(quiz.idx >= quiz.deck.length){
      view.innerHTML = `${header}
        <div class="quiz-wrap">
          <div class="quiz-filters">${chips}</div>
          <div class="quiz-round-end">
            <h3>Ronda terminada</h3>
            <p>Repasaste ${quiz.seen} tarjetas y marcaste ${quiz.known} como sabidas.</p>
            <button class="pill-btn primary" id="restartQuiz" type="button">Repetir ronda</button>
          </div>
        </div>`;
      attachQuizFilterHandlers();
      document.getElementById('restartQuiz').addEventListener('click', ()=>{ buildQuizDeck(); renderQuiz(); });
      return;
    }
    const card = quiz.deck[quiz.idx];
    const unit = UNITS.find(u=>u.id===card.u);
    view.innerHTML = `${header}
      <div class="quiz-wrap">
        <div class="quiz-filters">${chips}</div>
        <div class="quiz-stats"><span>Tarjeta <b class="mono">${quiz.idx+1}</b> / <b class="mono">${quiz.deck.length}</b></span><span>Sabidas: <b class="mono">${quiz.known}</b></span></div>
        <div class="card-stage">
          <div class="flashcard ${quiz.flipped?'flipped':''}" id="flashcard">
            <div class="card-face front">
              <div class="card-kicker">Unidad ${unit.num} &middot; Pregunta</div>
              <div class="card-text">${escapeHtml(card.q)}</div>
              <div class="card-hint">Clic o barra espaciadora para ver la respuesta</div>
            </div>
            <div class="card-face back">
              <div class="card-kicker">Respuesta</div>
              <div class="card-text">${escapeHtml(card.a)}</div>
              <div class="card-hint">&nbsp;</div>
            </div>
          </div>
        </div>
        <div class="quiz-actions">
          <button class="quiz-btn no" id="quizNo" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>No la sabía</button>
          <button class="quiz-btn yes" id="quizYes" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 13l4 4L19 7"/></svg>La sabía</button>
        </div>
      </div>`;
    attachQuizFilterHandlers();
    const fc = document.getElementById('flashcard');
    fc.addEventListener('click', ()=>{ quiz.flipped = !quiz.flipped; fc.classList.toggle('flipped'); });
    document.getElementById('quizYes').addEventListener('click', (e)=>{ e.stopPropagation(); quiz.known++; quiz.seen++; quiz.idx++; quiz.flipped=false; renderQuiz(); });
    document.getElementById('quizNo').addEventListener('click', (e)=>{ e.stopPropagation(); quiz.seen++; quiz.idx++; quiz.flipped=false; renderQuiz(); });
  }

  document.addEventListener('keydown', (e)=>{
    if(currentRoute()[0] !== 'repaso') return;
    if(e.code==='Space'){ e.preventDefault(); const fc=document.getElementById('flashcard'); if(fc){ quiz.flipped=!quiz.flipped; fc.classList.toggle('flipped'); } }
    else if(e.key==='ArrowRight'){ const b=document.getElementById('quizYes'); if(b) b.click(); }
    else if(e.key==='ArrowLeft'){ const b=document.getElementById('quizNo'); if(b) b.click(); }
  });

  // ---------- search ----------
  function renderSearch(q){
    breadcrumb.innerHTML = `Buscar: <b>${escapeHtml(q)}</b>`;
    const query = q.toLowerCase();
    const results = [];
    UNITS.forEach(u=>{
      u.sections.forEach(s=>{
        const text = stripHtml(s.html).toLowerCase();
        if(s.title.toLowerCase().includes(query) || text.includes(query)){
          results.push({unit:u, section:s});
        }
      });
    });
    const glossHits = GLOSSARY.filter(g=> g.t.toLowerCase().includes(query) || g.d.toLowerCase().includes(query));
    view.innerHTML = `
      <div class="hero"><div class="eyebrow">Resultados de búsqueda</div><h1>&ldquo;${escapeHtml(q)}&rdquo;</h1><p class="lead">${results.length} secciones y ${glossHits.length} términos del glosario coinciden.</p></div>
      <ul class="search-results-list">
        ${results.map(r=>`<a class="sr-item" href="#/unidad/${r.unit.id}/${r.section.id}"><small>Unidad ${r.unit.num}</small><div>${escapeHtml(r.section.title)}</div></a>`).join('')}
        ${glossHits.map(g=>`<a class="sr-item" href="#/glosario"><small>Glosario</small><div>${escapeHtml(g.t)}</div></a>`).join('')}
      </ul>
      ${(results.length+glossHits.length)===0? '<p style="color:var(--ink-soft)">No se encontraron resultados. Probá con otro término.</p>':''}
    `;
  }

  let searchDebounce;
  searchInput.addEventListener('input', ()=>{
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(()=>{
      const q = searchInput.value.trim();
      if(q.length===0){ route(); return; }
      breadcrumb.textContent = 'Buscando…';
      renderSearch(q);
    }, 180);
  });

  // ---------- router ----------
  function route(){
    const parts = currentRoute();
    closeSidebarMobile();
    if(parts.length===0 || parts[0]==='home'){ renderHome(); }
    else if(parts[0]==='glosario'){ renderGlossary(); }
    else if(parts[0]==='repaso'){ renderQuiz(); }
    else if(parts[0]==='unidad' && parts[1] && parts[2]){ renderSection(parts[1], parts[2]); }
    else { renderHome(); }
    renderSidebarNav();
    window.scrollTo(0,0);
  }
  window.addEventListener('hashchange', route);
  menuBtn.addEventListener('click', ()=>{ sidebar.classList.add('open'); scrim.classList.add('open'); });
  scrim.addEventListener('click', closeSidebarMobile);

  route();
})();
</script>
