UNIVERSIDAD NACIONAL DEL NORDESTE Facultad de Ciencias Económicas Sociología de las Organizaciones
METODOLOGÍAS PARA EL ABORDAJE DE LA CULTURA ORGANIZACIONAL
Autoras: Mariana Valdés Adriana E. Chávez Chiara A. Sclippa
Año 2020

INTRODUCCIÓN
El presente material tiene por objetivo exponer diferentes metodologías para abordar la cultura organizacional en diversos contextos. Los casos que se presentan a continuación son locales (pertenecientes a las ciudades de Resistencia y Corrientes), correspondientes a organizaciones públicas y privadas, y fueron desarrollados por tesistas de grado de la Licenciatura en Administración. Uno de los temas clave dentro de la Sociología es la cultura. Entendemos a la cultura como una propiedad de las unidades sociales. Schein (1988) señala que cuando un grupo determinado de personas ha compartido experiencias significativas en el proceso de resolución de problemas externos e internos, puede asumirse que las mismas al ser comunes han originado con el tiempo entre los miembros una visión compartida del mundo que los rodea y del lugar que ocupan en él, hasta llegar al punto en que esa visión es dada por supuesta. La cultura es “un producto aprendido de la experiencia grupal, y por consiguiente algo localizable solo allí donde exista un grupo definible y poseedor de una historia significativa” (1988, p. 24) Etkin (2000, p. 222) comenta que la cultura tiene un papel activo sobre la realidad: orienta a los participantes sobre el modo aceptado de actuar, sobre la forma en que deben entenderse y hacerse las tareas. Se trata de un contexto de significados que los individuos aprenden y comparten en lo implícito y que también transmiten a los nuevos miembros por interacción y comunicación. Además de Schein y Etkin, diversos autores se han ocupado del estudio de esta temática, entre ellos, por citar algunos, se encuentran Robbins quien la define como “un sistema de significados compartidos por los miembros de una organización, que la distinguen de otras” (2004, p. 525); Davis y Newstrom la entienden como “el conjunto de suposiciones, creencias, valores y normas que comparten sus miembros” (2007, p.70), Gibson Ivancevich & Donnelly consideran que “la cultura organizacional es lo que los empleados perciben y cómo esta percepción crea un patrón de creencias, valores y expectativas” (2001, p. 34). Podemos decir, a partir de las definiciones anteriores, que los autores coinciden en que la cultura es algo compartido por los miembros de la organización, ya sean percepciones, creencias, supuestos, valores, normas, historia o significados es una entidad que puede conocerse a través de la investigación científica.
DIFERENTES FORMAS DE ABORDAR LA CULTURA ORGANIZACIONAL
A partir de las diversas perspectivas de los autores surgen modelos teóricos que proponen metodologías de análisis de este objeto. Entre todas las metodologías existentes para estudiar la cultura organizacional en la Sociología Organizacional, en este trabajo se desarrollarán cuatro, las propuestas por Robbins (2004), Hofstede (1999) y Flecman & Bultman (2001) y Cameron y Quinn (1999), cada una tiene sus particularidades. El modelo propuesto por Robbins (2004) considera un conjunto de características básicas que captan la esencia de una organización, representa la base de los sentimientos que comparten los miembros en cuanto a la organización, la forma de realizar las cosas en ella y la conducta que se espera de ellos, ellas son: identidad de los miembros, énfasis en el grupo, enfoque hacia las personas, integración, control, tolerancia al riesgo y al conflicto, criterios para establecer recompensas, perfil hacia fines o medios y enfoque hacia un sistema abierto. Por su parte, Hofstede (1999) considera que los valores básicos de cada país influyen en el comportamiento organizacional, y la cultura organizacional se encuentra permeada por los mismos. El autor propone cuatro dimensiones de análisis para el estudio de la cultura organizacional que dependen, significativamente, de la cultura nacional: distancia jerárquica, control de la incertidumbre, individualismo y masculinidad. A su vez, nos plantea dos preguntas que habría que analizar siempre en cualquier organización: ¿Quién tiene poder para decidir qué? y ¿Qué normas y procedimientos se van a seguir para alcanzar los fines deseados? La respuesta a la primera pregunta estará determinada por las normas culturales sobre distancia jerárquica. La respuesta a la segunda vendrá dada por las normas culturales sobre control de la incertidumbre. Las otras dos dimensiones especificadas por Hofstede: individualismo y masculinidad, afectan a nuestra forma de pensar sobre las personas en las organizaciones más que a las organizaciones en sí mismas. Felcman & Blutman (2001) analizan como influye la cultura organizacional en los procesos de reforma del Estado y desarrollan un marco conceptual especifico referido a las instituciones públicas, construido a partir de los modelos de análisis de cultura organizacional de Edgar Schein y Hofstede. En su propuesta desarrollan tres niveles de análisis de la cultura organizacional: valores laborales, tipos culturales y presunciones básicas. Por último, Cameron y Quinn (1999) proponen una metodología para el estudio de la cultura organizacional basada en el modelo Competing Values Framework (CVF), donde a partir de seis factores organizativos (Características dominantes, Líderes de la organización, Estilo gerencial, Énfasis estratégico, Unión de la organización y Criterio de éxito) se diagnostica la cultura dominante de una organización. El modelo desarrolla cuatro tipos culturales.
METODOLOGÍA DE TRABAJO
Las tesinas que se presentan a continuación son casos de estudio de organizaciones tanto públicas como privadas de nuestra región, de Resistencia y Corrientes. Un caso de estudio puede ser definido según Yin como “una descripción y análisis detallados de unidades sociales o entidades educativas únicas” (Yin, 1989, citado en Martínez Carazo, 2006, p. 167). Para Stake “es el estudio de la particularidad y de la complejidad de un caso singular, para llegar a comprender su actividad en circunstancias concretas” (Stake, 1998, p. 16).
El abordaje de los casos se realizó a partir de diseños de tipo: • Básico: busca ampliar el conocimiento existente respecto de la cultura organizacional de un tipo específico de organización. • Descriptivo: “busca especificar propiedades, características y rasgos importantes de cualquier fenómeno que se analice. Describe tendencias de un grupo o población” (Hernández Sampieri, Fernández Collado y Baptista Lucio, 2006, p. 103).

• Cuantitativo: se analiza la cultura de la organización en función a un marco teórico específico, siguiendo modelos delimitados y considerando las variables y dimensiones propuestas por los mismos.
• Transversal: los datos se relevan en un momento en tiempo, configurando una imagen de la cultura organizacional de dicho momento.
• De campo: recoge información empírica del objeto de estudio.
1. Análisis de las características de la cultura organizacional de la Secretaría de Hacienda y Administración de la Municipalidad de Barranqueras. Tesista: Jara, Natalia Gabriela. Año 2017
1.1. Introducción
La cultura organizacional nace, se materializa y se institucionaliza en conductas y acciones. Concretamente, ha sido definida como el conjunto de normas o mandatos aprendidos por los nuevos miembros, gracias a la conciencia que toman de lo que significa una conducta aceptable o una inaceptable. Esta consideración descarta la imposición mediante la formalización de reglas escritas, por lo que resulta difícil encontrarla consignada en algún tipo de documento –manual, código o prontuario-, en su lugar, es transmitida de manera casual (Toca Torres, & Carrillo Rodríguez, 2009). Para el objeto de estudio del presente trabajo se considera la teoría de Robbins, dado que ese sistema de significados constituye un conjunto de características básicas que captan la esencia de una organización.
1.2. Objetivo general Analizar las características de la cultura organizacional de la Secretaría de Hacienda y Administración de la Municipalidad de Barranqueras, según el modelo teórico de Stephen Robbins.
1.3. Objetivos Específicos • Describir las características de la secretaría y cómo se realizan las actividades, • Mencionar cómo se comportan los miembros de la secretaria; entre pares y su actitud ante la institución. • Detallar la relación entre superiores y subordinados.
1.4. Modelo de Stephen Robbins De acuerdo con Robbins (1993) existen diez características primarias que concentran la esencia de la cultura organizacional:
1. “La identidad de los miembros: el grado con que los empleados se identifican con la organización como un todo y no solo con su tipo de trabajo o campo de conocimientos profesionales”

2. “Énfasis en el grupo: el grado en que las actividades laborales se organizan en torno a grupos y no a personas”.
3. “El enfoque hacia las personas: el grado en que las decisiones de la administración toman en cuenta las repercusiones que los resultados tendrán en los miembros de la organización”.
4. “La integración en unidades: el grado en que se fomenta que las unidades de la organización funcionen de forma coordinada o interdependiente”.
5. “El control: el grado en que se emplean reglas, reglamentos y supervisión directa para vigilar y controlar la conducta de los empleados”.
6. “Tolerancia al riesgo: el grado en que se fomenta que los empleados sean agresivos, innovadores y arriesgados”.
7. “Los criterios para recompensar: el grado en que se distribuyen las recompensas, como los aumentos de sueldos y los ascensos, de acuerdo con el rendimiento del empleado y no con su antigüedad, favoritismo y otros factores ajenos al rendimiento”.
8. “Tolerancia al conflicto: el grado en que se fomenta que los empleados traten abiertamente sus conflictos y críticas”.
9. “El perfil hacia los fines o los medios: el grado en que la administración se perfila hacia los resultados o metas y no hacia las técnicas o procesos usados para alcanzarlos”.
10. “El enfoque hacia un sistema abierto: el grado en que la organización controla y responde a los cambios del entorno externo” (Robbins, 1993, p. 620).
Así pues, cuando se evalúa a una organización en función de estas diez características se obtiene un panorama general de su cultura. “Este panorama representa la base de los sentimientos que comparten los miembros en cuanto a la organización, la forma de realizar las cosas en ella y la conducta que se espera de ellos” (Robbins, 1993, p. 621).
1.5. Metodología Se trata de un estudio de caso de tipo básico, descriptivo, transversal, cuantitativo y de campo. 1.5.1. Variables de análisis Se trabajaron tres ejes de análisis, de lo general a lo particular: Secretaría de Hacienda y Administración, Cultura Organizacional y Miembros de la Secretaría de Hacienda y Administración. Para cada eje de análisis se tomaron variables específicas relacionadas a la cultura organizacional que permitieron la profundización en la temática. Así tenemos:
• Para Secretaría de Hacienda y Administración las variables fueron: grado de formalidad de la estructura organizacional, cantidad de sectores, cantidad de miembros y valores centrales.
• Para Cultura Organizacional las variables fueron: normas de conducta, comunicación, innovación en la tarea, organización del trabajo y definición de tareas.

• Para Miembros de la Secretaría de Hacienda y Administración las variables fueron: antigüedad, capacitación, relación miembros, equipos de trabajo, competencia, expectativas del puesto, incentivos, relación superior-subordinado, conflictos y resolución conflictos.
1.5.2. Técnica de la Investigación Para la recolección de los datos se utilizaron cuestionarios semiestructurados. Se realizaron ciento diez cuestionarios, abarcando a la totalidad de los integrantes de las distintas direcciones que conforman la Secretaría antes mencionada, tanto directivos como personal administrativo. De los cuales veinte corresponden a los directivos y jefes de departamentos (un director general, cinco directores, un jefe de área, ocho jefes departamentales y cinco a/c de departamentos) y los restantes noventa son de los empleados (treinta personal dependiente, treinta y cinco inspectores, nueve obreros, ocho administrativos y ocho personal de laboratorio) que integran los distintos sectores de la Secretaría de Hacienda y Administración. Es decir se emplearon dos tipos de encuestas, una destinada a los líderes (directivos y jefes departamentales) de la Secretaría citada y otra al personal administrativo. Se utilizó una encuesta que considera las variables del modelo teórico de Stephen Robbins, diseñada por la tesista Ortega Laura Rocío (2013) realizando las adaptaciones al caso de estudio, dicha encuesta incluyó preguntas abiertas y dicotómicas y de selección múltiple. Además, los encuestados durante las entrevistas ampliaron sus respuestas para tener mayor información sobre el tema. Con respecto a los resultados, las respuestas se consideraron en conjunto, realizando un promedio de las mismas. Ésta técnica se basa en los modelos utilizados por la cátedra de Sociología de las Organizaciones de la Facultad de Ciencias económicas, realizada a jefes y empleados de empresas de familia, de acuerdo con la escala de Likert (escala psicométrica comúnmente utilizada en cuestionarios), siendo la de uso más amplio en las encuestas de investigación, en especial en las ciencias sociales.
1.6. Principales conclusiones A través de la investigación se pudo identificar las características de la cultura organizacional de la Secretaría de Hacienda y Administración de la Municipalidad de Barranqueras, a través del modelo teórico de las diez variables básicas propuesto por Stephen Robbins (1993, p. 620). Luego de considerar las respuestas obtenidas en las encuestas, se puede señalar que todas las características fueron aplicables a la organización analizada. Asimismo, se apreció que las características más relevantes (debido a que hay más consenso en las respuestas obtenidas) fueron: Identidad de los miembros, Énfasis en el grupo, Integración en unidades, Tolerancia al conflicto y Criterios para recompensar. Además, se observó que la falta de capacitación del personal constituye el principal problema de la institución e influye en las características de su cultura organizacional.

2. Caracterización la cultura organizacional de la Secretaría de Desarrollo Humano y la Secretaría de Desarrollo Económico de la ciudad de Corrientes. Tesista: Falzetti, María Belén. Año 2019
2.1. Introducción
2.2. Objetivo general Caracterizar la cultura organizacional de la Secretaría de Desarrollo Humano y la Secretaría de Desarrollo Económico; de la Municipalidad de Corrientes.
2.3. Objetivos específicos 1. Describir a la Municipalidad de la ciudad de Corrientes en función de su marco normativo, estructura, misión y visión. 2. Analizar los valores relevantes que comparten los miembros de las Secretarías de Desarrollo Humano y de Desarrollo Económico. 3. Caracterizar los rasgos de la cultura organizacional según Hosftede. 4. Identificar los tipos culturales que predominan en las Secretarías de Desarrollo Humano y de Desarrollo Económico según Felcman I.
2.4. Modelos teóricos
Hofstede - Teoría de las dimensiones culturales En primer lugar, Hosftede (1999) (tomado de Chiavenato, 2009, p.121), realiza una investigación para analizar cómo influyen los valores básicos de cada país en el comportamiento organizacional. Para ello estableció cinco dimensiones, las cuales definimos como un rasgo de una cultura particular que es comparado con otra: 1. La distancia del poder: se refiere a la actitud ante la autoridad. Las calificaciones más altas indican que las personas prefieren tener jefes autocráticos e impositivos. 2. La aversión a la incertidumbre: se refiere al deseo de estabilidad. Refleja la medida en que las personas de una sociedad se sienten amenazadas por situaciones ambiguas. Las culturas que obtienen una puntuación elevada en este índice toleran peor el cambio y suelen implementar reglas, normativas o leyes para minimizar la ansiedad que provoca lo desconocido. Por el contrario, las sociedades que obtienen una puntuación baja de este índice, están más abiertas al cambio y tienen pautas más flexibles. 3. El individualismo en comparación con el colectivismo: se refiere al dominio de alguna de las dos tendencias en la sociedad. Las culturas que son individualistas dan importancia a la consecución de los objetivos personales. En las sociedades colectivistas, los objetivos del grupo y su bienestar se valoran por encima de los del individuo. 4. Masculinidad en comparación con feminidad: se refiere al predominio de lo masculino sobre lo femenino en una sociedad. La masculinidad retrata valores tradicionalmente asociados con los varones, como la seguridad en uno mismo, el materialismo y la falta de interés por los demás. Por otra parte, la feminidad valora el interés por los demás, las relaciones y la calidad de vida.
Felcman - Análisis de la cultura organizacional de la administración pública argentina Felcman & Blutman (2001) desarrolla un marco conceptual especifico referido a las instituciones públicas, partiendo del modelo de análisis de cultura organizacional que aporta Edgar Schein, considera tres niveles de análisis de la cultura organizacional: (Felcman, 2001, p. 9)
1. Valores laborales: Básicos, sociales, de reconocimiento y de autorrealización. 2. Tipos culturales: se proponen cinco tipos de cultura, que se identifican a partir de la interrelación de dos variables; y diez dimensiones. En cuanto a las variables se analiza la orientación a los resultados o a la gente, para poder a partir de ello inferir si la administración pública cuenta con un modelo de gestión orientado normativamente, o si por el contrario, su modelo de gestión es del tipo gerencial moderno en el cual lo que tienden a prevalecer son los resultados. (Felcman, 2001, p.7). En cuanto a las dimensiones, se analizan las siguientes:
1. Características del jefe inmediato 2. Percepción del cambio 3. Sistema de remuneración 4. Planificación 5. Disponibilidad de la información 6. Tratamiento del error 7. Percepción de los plazos de actuación 8. Tipos de tareas que se realizan 9. Posibilidades de cambio/ éxito 10. Criterios de éxito
De esta interrelación surgen las cinco alternativas o tipos de culturas, que se presentan a continuación:
A. Cultura paternalista: Prioriza el cuidado de las relaciones entre los miembros de la organización dando lugar a un buen ambiente de trabajo, lealtad entre la gente y una buena comunicación entre los distintos niveles jerárquicos.
B. Cultura apática: Poseen una baja orientación a la gente y a los resultados. Se caracteriza por el conservadurismo y el apego a las normas y reglas escritas, fuertemente lineada con los modelos de gestión burocráticos.
C. Cultura anómica: Es sinónimo de desinterés y falta de involucramiento, la falta de entusiasmo y poca seguridad laboral, lo que lleva a una indiferencia por el comportamiento de la gente y a una preocupación excesiva por lo inmediato centrada principalmente en evitar el despido.
D. Cultura exigente: Se basa en un vínculo laboral inflexible, que conlleva la fijación de objetivos y exigir su cumplimiento. Así se incentiva la competencia entre los empleados y la insensibilidad ante las necesidades de los demás. Hay un énfasis especial en los resultados y en los aportes individuales.

E. Cultura integrativa: Este tipo de cultura está basado en la cultura de aprendizaje, y supone un equilibrio entre altos niveles de orientación a la gente y altos niveles de orientación a los resultados. Se trata de aprender de los errores y sacar provecho de los conflictos. Implica dirección, estrategias, trabajo en equipo y adaptación a los cambios, comunicación interna fluida y preocupación por el desempeño individual o grupal.
3. Presunciones básicas: constituyen la esencia de la cultura de una organización. Son los valores y creencias más profundamente arraigadas y por lo tanto más difíciles de modificar. Para el análisis, Felcman se basa en las presunciones o dimensiones establecidas por Hosftede (1999): 1. Cultura orientada al proceso/ a los resultados. 2. Cultura orientada al empleado/ tareas. 3. Cultura parroquial/ Profesional 4. Cultura abierta/ cerrada 5. Cultura con control alto/ bajo 6. Cultura normativa/ pragmática
2.5. Metodología El estudio adoptó un diseño de tipo puro, descriptivo, transversal, combinando diseños bibliográficos y de campo, siguiendo un enfoque cuantitativo (se analizó la cultura de dicha institución en función al marco teórico elegido, siguiendo modelos específicos y considerando las variables y dimensiones propuestas por los mismos).
2.5.1. Variables de análisis Se trabajaron tres ejes: Municipalidad de la ciudad de Corrientes, Secretaría de Desarrollo Humano y de Desarrollo Económico y Miembros. Para cada eje, se tomaron variables específicas, entre ellas: Municipalidad de la ciudad de Corrientes: Marco normativo, Estructura organizativa, Historia Secretaría de Desarrollo Humano y de Desarrollo Económico: Misión y visión, Objetivos, Valores, Estructura Miembros: Nivel socio demográfico, Valores organizacionales, Rasgos culturales, Perfil del jefe, Situaciones de cambio, Sistemas de remuneración, Sistemas de planificación, Disponibilidad de información, Tratamiento de error, Horizonte temporal, Tipo de tareas, Criterio de éxito
2.5.2. Técnica de investigación Se empleó la técnica de encuesta personal en horario laboral. La población de estudio estuvo conformada por miembros de la secretaría de desarrollo humano y de la secretaría de desarrollo económico. Se tomó una muestra de 22 individuos, diez miembros de la Secretaría de Desarrollo humano y doce miembros de la Secretaría de Desarrollo Económico. La encuesta fue diseñada por la Lic. Mariana Valdés, la misma constaba de cuatro partes. En la primera parte se relevaron las características socio demográficas de los miembros, como edad, sexo, niveles de estudio, situación de revista dentro de la secretaria y el turno de trabajo. En la segunda parte, se realizó una pregunta acerca de los valores organizacionales que los miembros consideraban más importantes en la institución. La tercer parte, constaba en 6 (seis) pares de afirmaciones opuestas sobre las dimensiones descriptas por Hoftede (1999) para identificar los rasgos culturales. Por último, se realizaron 10 (diez) preguntas relacionadas directamente con los cinco tipos de cultura descriptos por el Lic. Felcman (2001).
2.6. Principales conclusiones La principal conclusión a la que se arribó es que en la institución predomina la cultura integrativa, teniendo preponderancia en seis de las diez dimensiones analizadas, las cuales son: las características del jefe, planificación, disponibilidad de información, el tratamiento de los errores, las posibilidades y los criterios de éxito. En las restantes cuatro dimensiones, aparecen los otros tipos de cultura. La cultura apática en cuanto al sistema de remuneración, en las situaciones de cambio la cultura paternalista, en lo referido al contenido de las tareas tiene preponderancia la cultura anómica, y por último, la cultura de tipo exigente en el horizonte temporal de las actividades. En cuanto a los valores, se identificó que los más importantes para los miembros son: la responsabilidad, el compañerismo y el trabajo en equipo. Siguiendo en orden de importancia los valores de calidad, compromiso, confianza y lealtad, los cuales están un poco menos presentes que los primeros. Por último, en lo referido a los rasgos, se identificó que la cultura está orientada a los resultados; es profesional, abierta, con alto control. Mientras que la orientación a los empleados o a las tareas no se encuentra totalmente definida, así como tampoco existe una marcada tendencia hacia una cultura normativa o pragmática.
3. Cultura organizacional de Rotary Internacional en Resistencia. Tesista: Sclippa, Chiara Ayelén. Año 2017
3.1. Introducción De Souza (1998) sostiene que la identificación de la cultura es algo muy importante tanto para el administrador como para el psicólogo de una organización, para que ambos actúen de forma consistente en la misma, trabajando en sentido de promover cambios propiciadores de mejoras. Como manifiesta Robbins (2004), si una organización carece de una cultura dominante y sólo está compuesta por diferentes subculturas, el valor de la cultura organizacional como variable independiente es notablemente menor ya que no existiría una interpretación uniforme de lo que diferencia que un comportamiento sea interpretado como apropiado o inapropiado por la mayoría de sus miembros. De observarse que existen grandes diferencias culturales dentro de Rotary por la creación de clubes en distintas partes del mundo, los directivos podrán promover acciones para reducir las mismas, fomentando la cultura organizacional dominante y los valores claves de la organización.

El Marco de Valores en Competencia es un modelo teórico desarrollado por Cameron y Quinn (1999) que posee validez y confiabilidad en el ámbito científico y cuenta con abundante evidencia empírica en el estudio de la cultura en diversas organizaciones. De esta manera surge la pregunta central que guía la investigación: ¿cuál es el tipo de cultura organizacional dominante, según el Marco de Valores en Competencia, de Rotary Internacional en la ciudad de Resistencia? A partir de la cual se desarrollaron los objetivos generales y específicos.
3.2. Objetivo general Identificar el tipo de cultura organizacional dominante, según el Marco de Valores en Competencia, de Rotary Internacional en la ciudad de Resistencia.
3.3. Objetivos Específicos 1. Identificar los valores compartidos por los miembros de la organización. 2. Describir los tipos de subculturas, identificados según el Marco de Valores en
Competencia, de cada uno de los clubes rotarios de la ciudad de Resistencia. 3. Identificar la fuerza y congruencia de cada una de esas subculturas para obtener la cultura dominante en la organización.
3.4. Modelo teórico: Marco de Valores en Competencia de Cameron y Quinn Cameron y Quinn (1999) proponen una metodología para el estudio de la cultura organizacional basada en el modelo Competing Values Framework (CVF). En 1974, John Campbell y sus colegas crearon una lista de 39 indicadores que ellos aseguraban representaban un amplio conjunto de todas las medidas posibles para la efectividad organizacional. Sin embargo, como 39 indicadores parecían demasiados, en 1983 Quinn y Rohrbaugh los redujeron a un análisis estático y dos dimensiones principales. Salazar (2008) explica que la primera dimensión diferencia los criterios de efectividad que enfatizan la flexibilidad, la discrecionalidad y el dinamismo, de los criterios de estabilidad, el control y el orden. Por otra parte, la segunda dimensión diferencia los criterios de efectividad que enfatizan la orientación interna, la integración y la unidad (característico de organizaciones que persiguen una cierta armonía interna), de los criterios que enfatizan la orientación externa, la diferenciación y la rivalidad (propio de aquellas organizaciones que ponen mayor énfasis en la interacción y la competencia). Los cuatro tipos de cultura organizacional a los que da origen este modelo son:
• Cultura clan o de grupo: donde la organización es un lugar muy amistoso para trabajar y donde las personas comparten mucho entre sí. Es como una familia extendida. Los líderes o cabezas de la organización, se consideran mentores y figuras paternales con profunda llegada al interior de la institución. La organización es unida por la lealtad o la tradición. El compromiso de sus miembros es alto. La organización concede gran importancia a la cohesión y moral. El éxito institucional se define en términos de satisfacción al cliente y consideración de las personas. La organización premia el trabajo en equipo, participación y el consenso.
• Cultura adhocrática o de desarrollo: donde la organización es un lugar dinámico, emprendedor y creativo para trabajar. Las personas tienden a ser creativas y a tomar riesgos. Los líderes son considerados innovadores y tomadores de riesgo. Lo que sostiene a la organización en el tiempo es la experimentación de nuevos productos o servicios, la innovación, el estar en constante crecimiento y adquiriendo nuevos recursos. El éxito institucional implica tener utilidades considerables por la venta de nuevos productos o servicios; es importante ser los líderes de mercado. La organización estimula la iniciativa individual y la libertad de intelecto. • Cultura jerárquica/jerarquizada o burocrática: donde la organización es un lugar muy estructurado y formalizado para trabajar. Los procedimientos gobiernan el quehacer diario y lo que las personas deben hacer. Los líderes se enorgullecen por ser buenos coordinadores y organizadores. Las reglas formales y las políticas sostienen a la organización unida. La preocupación fundamental de la dirección es la estabilidad y el funcionamiento eficiente. El éxito se define en términos de entrega fidedigna, planificación adecuada y costo bajo. La administración del personal se basa en entregar un puesto de trabajo seguro y previsible. • Cultura orientada al mercado o racional: es una organización orientada a los resultados, cuya mayor preocupación es realizar el trabajo bien hecho. Las personas son competitivas y orientadas a los resultados. Los líderes son directivos exigentes, demandantes y a la vez competidores. Lo que mantiene a la organización unida es el énfasis en ganar, siendo el éxito y la reputación muy importantes. El éxito se define en términos de participación de mercado y posicionamiento. En este tipo de organización, los miembros están en un ambiente en el cual prima el control del trabajo realizado y prefieren la estabilidad. Los cuatro tipos de cultura pueden definirse a partir de seis factores organizativos: 1. Las características dominantes de la organización; es el cómo es la organización en su conjunto. 2. Los líderes de la organización; se refiere al estilo de liderazgo que caracteriza a la empresa y qué función cumplen los líderes dentro de ella. 3. El estilo gerencial; lo que indica cuáles son los principios básicos que orientan la gestión de los empleados y cómo es el ambiente de trabajo. 4. El énfasis estratégico; o áreas que orientan la estrategia de la organización. 5. La unión de la organización; se refiere al vínculo organizacional o mecanismo que le ayuda a permanecer unida. 6. Criterio de éxito; hace referencia a cómo se define el triunfo de la organización y qué es recompensado dentro de la misma. Esta metodología consta de la aplicación del instrumento “Organizational Culture Assessment Instrument” (en adelante OCAI) que debe ser aplicado a distintos miembros de la organización. El OCAI es un instrumento que permite diagnosticar la cultura dominante de una organización, su fuerza y congruencia, basándose en los cuatros tipos culturales previamente explicados.
3.5. Metodología El estudio adoptó un diseño transversal, descriptivo, y estructurado. Por el alcance que persigue la investigación, la misma se define como básica, siendo el enfoque escogido el cuantitativo. Teniendo en cuenta las fuentes utilizadas, se trata de una investigación de campo. 3.5.1. Variables de Análisis:
• Rotary Intenacional: Historia, Objetivos, Avenidas de servicio, Misión, Visión, Valores y Estructura.
• Rotary Internacional en Resistencia: Estructura organizativa, Antigüedad y Cantidad de miembros.
• Socios rotarios de Resistencia: Características demográficas, Antigüedad como socios, Cargos, Valores organizacionales, Características dominantes, Líderes de la organización, Estilo gerencial, Énfasis estratégico, Unión de la organización y Criterio de éxito.
3.5.2. Técnica de la Investigación La población de esta investigación está constituida por el total de socios de los clubes rotarios de la ciudad de Resistencia. La muestra de la investigación es no probabilística por conveniencia; las encuestas autoadministradas fueron completadas voluntariamente por socios rotarios de la ciudad de Resistencia que asistieron a una reunión ordinaria específica a la cual se recibió invitación. En total se aplicaron 42 encuestas de las cuales se validaron sólo 38. Por lo tanto la muestra quedó conformada de la siguiente manera:
• Socios del Rotary Club Resistencia Centro: 16 socios • Socios del Rotary Club Resistencia Oeste: 11 socios • Socios Rotary Club Resistencia Sur: 11 socios El instrumento seleccionado para la recolección de datos fue el OCAI, el cual permite hacer un diagnóstico de la cultura organizacional, a partir de seis preguntas tipo acerca de Características dominantes, Líderes de la organización, Estilo gerencial, Énfasis estratégico, Unión de la organización y Criterio de éxito. Originalmente el instrumento consta de dos partes, una para evaluar la cultura organizacional actual y otra para evaluar la cultura organizacional deseada. Sin embargo, para esta investigación se omitió la columna de la cultura deseada, por lo tanto, los participantes sólo evaluaron la cultura tal y como es en la actualidad. Cada pregunta del OCAI consta de cuatro descripciones o respuestas factibles catalogadas con las letras A, B, C y D. Cada letra está relacionada a uno de los cuatro tipos de cultura dominante descritos por el Marco de Valores en Competencia. En esta investigación el cuestionario original fue modificado por cuanto se solicitó a los rotarios que seleccionaran con una X entre las cuatro posibles descripciones de cada pregunta, para evitar dificultades a los encuestados a la hora de asignar una puntuación a cada respuesta factible. Además, al cuestionario se le adicionaron preguntas identificadoras y clasificatorias sobre los socios como el sexo, edad, la antigüedad y el cargo ocupado, y una pregunta abierta sobre los valores organizacionales.
3.6. Principales conclusiones Al observar los porcentajes obtenidos en el OCAI para cada uno de los tres clubes que forman parte de la organización, es posible distinguir claramente un énfasis en la cultura clan en cada uno de ellos. Debido a los altos porcentajes obtenidos por la cultura clan en cada uno de los clubes es claramente visible que ésta es la cultura dominante de la organización, cuya fuerza influencia el comportamiento de sus integrantes y además se corresponde con el hecho de que el compañerismo sea el valor más compartido por todos sus socios. Además del compañerismo, existen otros valores que son ampliamente compartidos por los socios rotarios. Ellos son el servicio, la solidaridad y el respeto. Todos valores muy importantes no sólo para los socios de Resistencia, sino para todo Rotary Internacional ya que se pueden asociar con el valor organizacional integridad establecido por el Plan Estratégico de RI mediante el cual los rotarios cumplen con la palabra empeñada y observan elevadas normas éticas para servir a las distintas comunidades del mundo. A partir del análisis de los porcentajes obtenidos en cada uno de los ítems individuales del OCAI dentro de cada club, se pudo evaluar la existencia de congruencia entre los aspectos culturales analizados y la cultura global de Rotary Internacional, lo que significa que la mayoría de los aspectos de la cultura de la organización están alineados.

 ÉTICA Y RESPONSABILIDAD SOCIAL EMPRESARIA1
Lic. Adriana Moglia Dra. Mariana Valdés Dr. Cristian Marenco
Objetivos:
➢Comprender la importancia de la ética y la responsabilidad social empresaria en la gestión de las organizaciones y el impacto que causan en las mismas.
1. Ética. Concepto. Diferencia con la moral. La era de la tecnología, de las comunicaciones, de la globalización; debería de colaborar con el hombre para generar diferentes herramientas y maneras de propiciar una mejor calidad de vida; pero esto no es así, cada vez hay mayor número de personas que padecen hambre, que no poseen agua potable, electricidad, que no tienen acceso a la salud, a la educación. Y lo más contundente es lo que están padeciendo los jóvenes, con altos índices de desempleo, sin posibilidades de acceder al mercado del trabajo, y lo que es peor sin aspiraciones a que dicha situación se modifique. (Kliksberg, 2013, pág. 11)
Las personas perciben que existen grandes responsables de estas situaciones, les demandan la generación de acciones libres de corrupción, con transparencia y respeto por las personas a quienes conducen.
Cada vez son mayores los reclamos en torno a estas situaciones, y las demandas están dirigidas a quienes nos dirigen; a quienes tienen el poder de modificarlas. Lo cierto, es que además del poder público, existe una vasta categoría que también tienen injerencia en nuestras vidas; el poder privado. Las empresas privadas han ido tomando una participación muy importante en la economía. El poder cada vez más, se concentra en un puñado de ellas, de tal manera que sus decisiones influyen en las condiciones de nuestras vidas.
Si dichas decisiones tienen su base en pensamientos que se relacionan con el costo-beneficio; o mejor dicho con las rentabilidades de sus empresas en el menor plazo posible; y no considerando principios rectores de una conducta que mire al bien común; estamos muy lejos de poder atender las necesidades de los individuos.
1 La presente unidad es un extracto del libro Sociología de las Organizaciones (inédito) Valdés, Marenco, Moglia, Chávez (2025)

Esos principios rectores como la prudencia, la responsabilidad, justicia, humanidad, empatía, etc. deben ser pilares necesarios que conduzcan nuestras vidas.
“Sobre estos conceptos trata la Ética, pero ¿qué es la Ética? Ética es: entendida como parte de la Filosofía que se dedica a la reflexión sobre la moral. La diferencia entre una y otra es que la última nos indica sobre acciones concretas, mientras que la Ética (filosofía moral), reflexiona sobre los distintos modos de justificar racionalmente la vida moral, es decir nos orienta indirectamente; orienta nuestros comportamientos concebidos en el conjunto de la vida entera.”
(Cortina & Martinez Navarro, 2001, pág. 9)
En nuestra vida tratamos de encontrar sentido a lo que somos y hacemos, buscamos sentido para calmar nuestra ansiedad de libertad, que nos proporciona el saber, ya que la falta de sentido nos reporta un cierto tipo de esclavitud.
La palabra Ética, procede del griego ethos, que significa originariamente “morada”, “lugar en donde vivimos”, pero posteriormente pasó a significar “el carácter”, el “modo de ser” que una persona o grupo va adquiriendo a lo largo de su vida. (Cortina & Martinez Navarro, 2001, pág. 21)
Si bien se tiende a confundir con el término “moral”, no debemos tratarlos como sinónimos, pues se trata de dos niveles de reflexión diferentes, dos niveles de pensamiento y lenguaje acerca de la acción moral. Según Cortina y Martinez Navarro (2001, p.22):
Llamamos MORAL: al conjunto de principios, normas y valores que cada generación transmite a la siguiente en la confianza de que se trata de un buen legado de orientaciones sobre el modo de comportarse para llevar una vida buena y justa.
Y llamamos ÉTICA: a la disciplina filosófica que constituye una reflexión de segundo orden sobre los problemas morales.
La pregunta básica de la moral sería: ¿Qué debemos hacer?
La pregunta central de la Ética sería: ¿Por qué debemos?
“La ética es la disciplina que se ocupa de la conducta humana, más específicamente, de aquellos actos racionales y voluntarios de los cuales el sujeto puede hacerse responsable” (CORTINA,, 1994)

Adela Cortina menciona en una entrevista que: “las personas, las sociedades tienen carácter (Ethos: “carácter”)”(…) “a través de disposiciones, virtudes que nos llevan a ser felices, lo inteligente es labrar un buen carácter para tratar de ser feliz, lo estúpido es hacer lo contrario”. (RTVE- Radio Televisión Española, 2014)
La Autora habla de la formación del carácter, que no está determinado, se cultiva con el ambiente, donde la EDUCACIÓN es fundamental y todos tenemos la libertad para forjar un buen carácter. No hay seres humanos AMORALES, se puede ser más moral que otro según determinados códigos, pero todos tenemos MORAL. Es mejor estar dotado de alta ética. La ética sirve para abaratar costes, estableciendo relaciones de confianza entre los clientes y banqueros, se aligeran las relaciones y abaratan costes. La confianza abarata en sufrimiento y dinero.
2. Ética del administrador público y privado. Por todo lo dicho anteriormente, ¿hay diferencia entre la Ética Pública y la
Privada?, ¿por qué?, ¿en qué sentido?
La ética de las personas, en general, no es diferente en el ámbito de la empresa como en lo estatal. Según donde se aplique, la ética puede ser individual, grupal, familiar, profesional, social, empresarial. En los ámbitos organizacionales, dicha ética debería incidir en las decisiones que cada administrador o trabajador debe tomar para una correcta gestión de la misma.
La decisión, como toda actividad humana, está guiada por valores. Siguiendo a Frondizi (1972) entendemos por “valor” a una cualidad estructural que surge de la reacción de un sujeto frente a propiedades que se encuentran en un objeto, y esa relación no se da en el vacío, sino en una situación física y humana determinada. Desde una perspectiva ética, el valor se relaciona con los principios y normas que guían el comportamiento humano y la toma de decisiones. Los valores éticos incluyen conceptos como la justicia, la equidad, la honestidad, la responsabilidad y el respeto hacia los demás. Por lo dicho se espera que esas decisiones tengan en consideración los valores y que éstos, a su vez, se reflejan en la conducta del líder.
La ética no es solamente importante cuando existen dilemas o cuando una decisión trae aparejada una consecuencia negativa, sino también cuando se alteran las reglas de juegos, cuando los comportamientos viciosos se generalizan, cuando el relativismo pretende dar validez a cualquier decisión.

Quien decide enfrenta una situación problemática, y al considerar alternativas posibles de solución, los valores constituyen un recurso importante, entre ellos debería primar: la coherencia, legitimidad, lealtad, equidad.
En determinadas circunstancias, cuando evaluamos un curso de acción, debemos analizar, además de considerar su efecto económico, cuáles serán las demás consecuencias y quienes estarán afectados por la decisión que tomaremos.
Respecto de la ética empresarial, que bien podría relacionarse con la administración privada, encierra aquellos valores éticos sobre los cuales descansa su decisión. Las prácticas comerciales que aplican se basan en principios, en normas de los individuos en primera instancia, para luego trasladarlo a la empresa y luego a la sociedad (Debeljuh, 2009, pág. 16). Una organización privada puede o no establecer por escrito lo que espera que sus gerentes y empleados cumplan.
Asimismo implica la aplicación material de principios objetivos de la ética para los que trabajan en el mundo de los intercambios económicos; de tal manera que la aplicación de dichas operaciones se sustenta en principios que permitan la felicidad, como fin último del hombre. En lo público, su función es proteger los recursos y bienes aportados por los ciudadanos a partir de distintas imposiciones tributarias, para su correcta gestión y satisfacer las necesidades sociales.
Cada vez surgen con mayor amplitud, conflictos entre las convicciones personales de los empleados y alguna decisión empresarial contraria a ellas; si a este fenómeno le sumamos inconvenientes técnicos se pone a prueba la solidez moral de una organización. Por ej: un ejecutivo puede plantearse si es ético vender un producto a bajo precio porque sabe que la empresa competidora está a punto de declararse en quiebra.
Respecto a la ética en el Estado, a través de normativas específicas, se establece una lista taxativa de conductas esperadas por parte de los funcionarios y los empleados públicos al realizar su trabajo. La amplitud de la organización estatal, la cantidad de puestos de trabajo que emplea y la necesidad de resguardar el uso y el manejo de los fondos públicos son los justificativos para sancionar una ley manifestando dichas obligaciones morales.
En el ámbito nacional, la Ley N° 25188 de Ética en el ejercicio de la Función Pública, en su artículo 1, establece que su objetivo es establecer un conjunto de deberes, prohibiciones e incompatibilidades aplicables, sin excepción, a todas las personas que se desempeñen en la función pública en todos sus niveles y jerarquías, en forma permanente o transitoria, por elección popular, designación directa, por concurso o por cualquier otro medio legal, extendiéndose su aplicación a todos los magistrados, funcionarios y empleados del Estado.
En su artículo 2, establece los comportamientos esperados:
ARTICULO 2º — Los sujetos comprendidos en esta ley se encuentran obligados a cumplir con los siguientes deberes y pautas de comportamiento ético:
a) Cumplir y hacer cumplir estrictamente Constitución Nacional, las leyes y los reglamentos que en su consecuencia se dicten y defender el sistema republicano y democrático de gobierno;
b) Desempeñarse con la observancia y respeto de los principios y pautas éticas establecidas en la presente ley: honestidad, probidad, rectitud, buena fe y austeridad republicana;
c) Velar en todos sus actos por los intereses del Estado, orientados a la satisfacción del bienestar general, privilegiando de esa manera el interés público sobre el particular;
d) No recibir ningún beneficio personal indebido vinculado a la realización, retardo u omisión de un acto inherente a sus funciones, ni imponer condiciones especiales que deriven en ello;
e) Fundar sus actos y mostrar la mayor transparencia en las decisiones adoptadas sin restringir información, a menos que una norma o el interés público claramente lo exijan;
f) Proteger y conservar la propiedad del Estado y sólo emplear sus bienes con los fines autorizados. Abstenerse de utilizar información adquirida en el cumplimiento de sus funciones para realizar actividades no relacionadas con sus tareas oficiales o de permitir su uso en beneficio de intereses privados;
g) Abstenerse de usar las instalaciones y servicios del Estado para su beneficio particular o para el de sus familiares, allegados o personas ajenas a la función oficial, a fin de avalar o promover algún producto, servicio o empresa;
h) Observar en los procedimientos de contrataciones públicas en los que intervengan los principios de publicidad, igualdad, concurrencia razonabilidad;
i) Abstenerse de intervenir en todo asunto respecto al cual se encuentre comprendido en alguna de las causas de excusación previstas en ley procesal civil.

Asimismo, establece un mecanismo para la presentación de declaraciones juradas anuales de los funcionarios públicos y un régimen de incompatibilidades horarias para el trabajo público.
El no cumplimiento de estas conductas provoca sanciones que pueden llegar a sanciones civiles y penales.
Para una mayor ampliación sobre el tema de la ética en ámbito público argentino, se puede consultar la “Guía para el Ejercicio Ético de la Función Pública”, cuya función es “difundir los principales deberes, principios, incompatibilidades y obligaciones que el funcionario público debe conocer y respetar para garantizar la integridad en el desempeño de su función” (Secretaria de Gestión y Empleo Público, 2020).
3. Código de ética del profesional en Ciencias Económicas. En el ámbito de las Ciencias Económicas, la Federación de Consejos
Profesionales de Ciencias Económicas, elaboró un Código de Ètica Unificado para Profesionales en Ciencias Económicas de la República Argentina a través del cual invita a todos los Consejo Profesionales a adoptarlo, y define a la ética profesional, como el arte de ejercer una profesión adecuando el trabajo profesional a la singular dignidad humana tanto en su dimensión personal como social. (FACPCE, Res. 204/2000; CPCE CHACO, 2001)
El mismo es un marco referencial conceptual que guía la conducta ética de los profesionales en este campo. Fue elaborado por la Comisión de Ética de la Federación Argentina de Consejos Profesionales de Ciencias Económicas (FACPCE) y aprobado en 2001. Su objetivo es establecer principios y normas que orienten la actuación de los matriculados, considerando valores universales y las particularidades de cada jurisdicción.
Este código no cobra vida solo por su sanción; su relevancia radica en su adopción por parte de los colegas y su arraigo en la comunidad profesional. Algunos de los principios esenciales que conforman el Código de Ética incluyen la búsqueda de valores objetivamente válidos, la definición de valores imperativos y la adopción de políticas que promuevan el criterio ético de los profesionales
Los atributos fundamentales sobre los cuales se edifica la personalidad profesional basada en un perfil ético son: la integridad, veracidad, objetividad, independencia, competencia, lealtad, discreción y solidaridad.
La comunidad necesita de profesionales creíbles y capaces de dar respuesta a los requerimientos sociales.

Puede parecer que hablar de ética en las profesiones sea ilusorio, imposible de alcanzar, hasta algunos lo pueden considerar como incompatible, pero lo cierto es que aporta “sanidad interior a la persona humana”.
Por Resolución 204/2000, la Federación Argentina de Consejos Profesionales en Ciencias Económicas aprobó el Código de Ética Unificado para Profesionales en Ciencias Económicas y recomendó a los Consejos Profesionales adheridos a su adopción.
Su estructura es la siguientes:
• Preámbulo • Prólogo • Título I –Ámbito de Aplicación – Sujetos • Título II –Normas Generales • Título III –Normas Especiales
✓ Capítulo 1: Principios Técnicos ✓ Capítulo 2: Clientela ✓ Capítulo 3: Relaciones Interprofesionales ✓ Capítulo 4: Solidaridad ✓ Capítulo 5: Publicidad ✓ Capítulo 6: Secreto Profesional ✓ Capítulo 7: Honorarios • Título IV –Incompatibilidades para el ejercicio de las actividades profesionales
✓ Capítulo 1: Incompatibilidades ✓ Capítulo 2: Independencia ✓ Capítulo 3: Falta de Independencia ✓ Capítulo 4: Vinculación Económica ✓ Capítulo 5: Alcance de las Incompatibilidades • Título V: Sanciones
PREÁMBULO:
“El Código de Ética Unificado de los Profesionales en Ciencias Económicas de la República Argentina es un conjunto homogéneo y ordenado de principios y normas de los que se deducen consecuencias prácticas éticamente obligatorias.

Por su propia naturaleza las normas que expresamente se exponen no excluyen otras, que mediante un criterio ético sano y sentido del deber, inducen a tener un comportamiento profesional digno.
El fundamento de los principios y normas éticas se basan en el valor de la responsabilidad para con: la sociedad, la casa de estudios de la cual egresaron, las instituciones profesionales de la que forman parte, sus colegas, otros profesionales universitarios y para quienes requieran sus servicios.
Esa responsabilidad se basa en los principios éticos de contribución al bien común, de idoneidad, de fidelidad a la palabra dada, la integridad, objetividad, confidencialidad, prudencia, fortaleza y humildad profesional. Todo lo cual exige que se deben realizar los mayores esfuerzos para mejorar continuamente, adquirir mayor madurez, que conlleva a una mejoría en la calidad de la actuación y contribuyan al prestigio, respeto y progreso de la profesión.” ( FACPCE, 2000:17)
Es necesario identificar dos elementos fundamentales:
El concepto de Código de Ética y la definición de quiénes son los sujetos pasivos de la responsabilidad del profesional.
Según el preámbulo, el Código de Ética no es una enunciación de reglas y definiciones, sino un “esquema sistematizado”, facilitando ser leído y comprendido no como una simple enumeración de reglas.
El otro tema es a quién debe responder el profesional:
• La sociedad: no es más que el usuario fundamentalmente; cuyas decisiones basadas en los servicios prestados por el profesional, tienen injerencia en la sociedad directa o indirectamente.
• La casa de estudios de la cual egresó: pues es él quien sirve de propaganda (si se puede decir de alguna manera) a la universidad con su accionar.
• Las instituciones profesionales: Los CPCE, que nuclean a los profesionales, controlando la matrícula, el correcto ejercicio de la profesión, y aplicar sanciones disciplinarias.
• Sus colegas: pues sus acciones repercuten en la de sus colegas. • Otros profesionales: por su interacción con otras profesiones.

• Quienes requieran sus servicios: CLIENTE: la relación de responsabilidad más estrecha y directa.
PRÓLOGO:
El Código de Ética Unificado, debe constituir la base sobre la que se sustenta el sistema ético de los profesionales en Ciencias Económicas de la República Argentina.
La búsqueda de valores objetivamente válidos, la definición de los valores imperativos de la comunidad profesional, la adopción de políticas y acciones que tiendan a generar el criterio ético de nuestros matriculados y a moldear su conducta, de modo tal que adopten los principios esenciales acorde a nuestra doble condición, de egresados universitarios con el nivel cultural superior dentro de la sociedad, y profesionales amparados por leyes que regulan y protegen al ejercicio de nuestra actividad; ha sido, es y será la misión más trascendente de los Consejos Profesionales.
Aquellos principios, valores, normas o cualidades que conforman el Código de Ética, no tiene vigencia real por su mera sanción, cobran vida cuando son adoptados por los colegas, cuando echan raíces en la comunidad profesional convirtiéndose en “hábitos colectivos”, cuando alcanzan un alto rango de funcionamiento y otorga “identidad” al grupo llegan a constituir “sistema ético” del mismo.” ( FACPCE, 2000:2)
Este Prólogo revela y explicita, la atribución que la ley 20488 en su art 21 inc e, otorga a los Consejo Profesionales cuando enuncia: “cuidar que se cumplan los principios de ética que rigen el ejercicio profesional de Ciencias Económicas”.
A través de este prólogo, se enuncia más fehacientemente las acciones que debieran adoptar las instituciones en torno a este tema. Pero no es una tarea de vigilancia, va más allá de esto. No termina con castigar el comportamiento antiético; significa “educar en valores éticos”. Porque de una educación ética se genera una actitud ética, tal como lo venimos señalando desde otras exposiciones.
Continúa el Código mencionando conceptos muy importantes, que van a demarcar la senda por donde se debe encaminar el comportamiento del profesional .
● CULTURA Y COMUNIDAD PROFESIONAL

Primero define la cultura como un conjunto de fidelidades: lenguaje, hábitos, formas de comportamiento, tradiciones, leyendas, desde nuestro nacimiento. Que existen subculturas, tantas como realidades existen.
Por lo dicho la comunidad que conforman los Profesionales en Ciencias Económicas, forman una cultura, con sus propias características, que se transmite de generación en generación y es el fundamento de actitudes frente a la vida social.
Como existen varias culturas, según lo comentado, éstas se yuxtaponen, a través de la participación de cada cultura particular, a los valores comunes de la comunidad profesional argentina.
Esta Cultura incide en las decisiones y en las formas de actuar de las personas que las conforman; de modo que aquellas acciones realizadas por unos son ejemplarizantes para los otros, sean éstas buenas o malas.
Las conductas éticamente irresponsables de un profesional, y sus injusticias dan origen a tensiones, malestar y a distorsiones funcionales. Si la sociedad no castiga impera la corrupción, con consecuencias lamentables para toda la sociedad.
Primero fomenta la pérdida de la calidad humana y profesional de quienes se dejan corromper.
Segundo, destruye valores éticos y otras cualidades, que hacen a la sana competencia.
Tercero, perjudica a los verdaderamente competentes, deteriorando la eficacia y consecuentemente provocando el desprestigio profesional.
“La corrupción plantea un reto a la inventiva ética y pone a prueba la paciencia y coraje de las personas honestas”.
● LIBERTAD Y RESPONSABILIDAD
La Ética está relacionada con el uso de la libertad. Esta libertad es personal e indelegable; cada uno debe hacer el esfuerzo de tomar una decisión.
El problema ético se centra en la toma de decisiones; ya que a través de la decisión el actuar humano involucra la responsabilidad.
La responsabilidad es el reverso inevitable de la libertad.
● ÉTICA PROFESIONAL

Consiste en la búsqueda, la invención y la aplicación de principios y valores imperativos de nuestra comunidad profesional, tales principios deben formar parte de la ética universal, la que ha sido definida como ciencia del hombre.
La ética profesional: arte de ejercer la profesión, que permite adecuar el trabajo profesional a la singular dignidad humana tanto en su dimensión personal como social.
Los principales valores que deben guiar la conducta de los profesionales deben ser objetivamente válidos, los mismos son:
1. Justicia: Es la virtud del orden o medida en relación con los otros: “dar a cada uno lo suyo”. El valor de la justicia está en la base de cualquier ordenamiento social justo.
En orden a la justicia existen dos valores fundamentales:
Veracidad: pone orden en la multiplicidad de las relaciones interpersonales, que lleva consigo la vida profesional. Se funda en la verdad (adecuación del pensamiento con la realidad), es a lo que la inteligencia debe buscar para no caer en el error, el engaño o el delito.
Fidelidad a la palabra dada: aspecto especial de la verdad o veracidad y consiste en ajustar los hechos a la palabra dada. En la vida profesional es un pilar sobre el que se construye cualquier relación profesional.
2. Fortaleza profesional:No basta sentirse obligados a obrar de acuerdo con lo que sugiere el conocimiento objetivo y sereno de la realidad. El empuje laborioso, el saber arriesgarse, una sana forma de agresividad a la que habitualmente llamamos empuje, ser emprendedor, son parte de lo requerido para ser un buen profesional.
3. Humildad Profesional:La humildad es una cualidad cuyo fin es dar un equilibrio interior al hombre, dotando de paz y tranquilidad de ánimo para el ejercicio de su libertad y así tomar sanas decisiones impidiendo acciones que perjudiquen su propia personalidad y la de los demás. A través de la humildad se reconocen las propias limitaciones, sin necesidad de menos valorar la propia personalidad o el propio prestigio profesional.
4. Prudencia o Saber Hacer: Es lo que hoy se denomina: “excellence” o “excelencia”; sobresalir por la calidad de la actuación, la prudencia, el saber hacer como conocimiento práctico que consiste en saber que hay que hacer y hacerlo.

Tiene tres aspectos:
I- Optimizar el pasado: usar la experiencia, tanto propia como ajena, consultar, saber cómo hacerlo.
II- Diagnosticar el presente: primero exige entender la circunstancia, los hechos que ocurren, y cuáles serán los que pasarán, pudiendo llegar a conclusiones. III- Prevenir el futuro: arriesgarse a una solución, pudiendo ver con mayores probabilidades la realización de dicho futuro.
El Profesional prudente no es el que no se equivoca nunca; sino el que sabe rectificar los propios errores y sacar provecho de sus fracasos, por la experiencia que acumula, tomando como aprendizaje lo vivido y aplicándolo a nuevas decisiones para continuar ejerciendo su propios deberes y derechos profesionales.
“El que ejerce la prudencia profesional, lucha con los errores, la negligencia y la inconsistencia.
Además de los valores, el código identifica los objetivos de la profesión
Trabajar al más alto nivel de profesionalidad con el fin de obtener el mayor nivel posible de ejecución y en general para satisfacer los requisitos de orden público.
Los principios y valores éticos hacen rendir al máximo la inteligencia y la voluntad.
Para lograr objetivos del profesional es necesario las siguientes cualidades:
1. Credibilidad: implica ser aceptada como verdadera, que se obtiene por ser comunicado por otro.
2. Profesionalidad: serie de actividades especializadas que se realizan fuera del sistema de relaciones familiares y que son un elemento importante en la definición social de los individuos que las llevan a cabo: contador, economistas, actuario, administrador. Así los individuos son identificados con claridad, por sus clientes, empleadores y otras partes interesadas como profesionales en ciencias económicas
3. Confianza: fuerza creadora que hace que el otro, el profesional, sea digno de crédito, de fianza y por lo tanto es responsable.
4. Calidad de servicios: 1. Satisfacer plenamente las necesidades de los clientes. 2. Cumplir las expectativas del cliente. 3. Despertar nuevas necesidades del cliente. 4. Lograr servicios con cero defectos. 5. Hacer bien las cosas desde la primera vez. 6. Diseñar, producir y entregar un servicio de satisfacción total. 7.

Una solución y no un problema., 8. Producir el servicio de acuerdo a las normas técnicas y éticas establecidas. 5. Confidencialidad: los usuarios deben poder contar con que la provisión de esos servicios se haga en un marco de reserva o secreto. 6. Objetividad: ver, comprender y comunicar un acontecimiento tal cual es, prescindiendo de preferencias, intereses o posturas propias. 7. Integridad: cumplir exactamente y con rectitud los deberes de sus servicios profesionales. 8. Idoneidad Profesional: ejecutar los servicios con cuidado, competencia y diligencia, y con la debida formación profesional. 9. Solidaridad Profesional: implica respetar la iniciativa y creatividad y sentido de la responsabilidad de los demás sin observarlos ni privarlos de lo que ellos son capaces de hacer. 10.Responsabilidad: capacidad del ser humano de responder de los actos que realiza y de las consecuencias previsibles de esos actos en su contenido ético. 11.Dignidad Profesional: Involucra la identidad del ser humano cuyos elementos esenciales son la racionalidad y la libertad. No tratar a las personas como meros instrumentos de ganancias o de consumo, “cosificar a las personas”, negándole su identidad.
4. Responsabilidad social 2 Etimológicamente, responsabilidad significa […] capacidad de responder, asumir este mandato remite a dos capacidades que debe poseer el agente: poder dar respuesta aceptable a la pregunta acerca de ‘por qué’ se va a actuar o se actuó de determinada manera u otra, por un lado, y por otro, la capacidad de responder por las consecuencias de su acción haciéndose cargo (Heler, 2010:3).
En este marco, ser responsable implica tener la capacidad de poder responder por los propios actos y asumir sus consecuencias. Cabe destacar que dicha responsabilidad no es solamente individual. En el caso de las empresas y organizaciones, hay un equipo de trabajo que toma decisiones y luego ejecuta las
2 El presente punto es una adaptación del 3° capítulo de la Tesis de doctorado (inédita) Valdés, Mariana (2024). “Análisis de la Cultura Organizacional y su disposición a la Responsabilidad Social Empresaria en empresas del Sector de la Construcción de la Ciudad de Resistencia (Chaco)”. Facultad de Ciencias Económicas y Estadística. Universidad Nacional de Rosario.
 mismas; entonces, las empresas y organizaciones son responsables a través de sus dirigentes, que toman las decisiones en nombre de ellas comprometiendo a toda la institución y provocando efectos en el medio que las rodea. Cabe destacar que dicha responsabilidad, en su dimensión social, tiene un carácter ético y, por tanto, es voluntaria y no vinculante, tal lo expresado en las ISO 26000.
La responsabilidad social, por su parte, en lo relativo al término específico que propone, podría entenderse por la “[…] capacidad de una institución de responder a las necesidades o demandas sociales, mediante procedimientos y mecanismos que permitan anticipar y reaccionar ante dichas circunstancias en prácticas humanas y formas fructíferas” (IDEA, 2001: 9).
Asimismo, conviene recuperar otra dimensión del ethos que atiende a la clasificación de los ámbitos en que éste puede observarse. Siguiendo a Cortina (2015) en lo relativo a los efectos del obrar, entendemos que el ethos puede clasificarse según sus ámbitos de aplicación: micro ámbito (familiar, pareja, vecindad, empresa); meso ámbito (política nacional) y macro ámbito (destino de la humanidad).
La Responsabilidad Social Empresaria en la actualidad Actualmente la Responsabilidad social Empresaria (en adelante RSE) se construye a partir de un concepto amplio, abarcador y complejo, debido —especialmente— a que contiene aspectos y aristas diversas. Se consideran cuestiones económicas, sociales y medioambientales. Siguiendo a Hupperts (2008), es propicio que la RSE sea considerada como parte sustancial de la gestión y estrategia de la empresa.
Además, según Freeman (1984), una empresa socialmente responsable es aquella que tiene en cuenta en sus decisiones a los diferentes grupos de interés (a los que se denomina stakeholders). Hay múltiples definiciones de diferentes autores de dicho término inglés —Stanford (1963); Rhenman (1964); Freeman (1984); Freeman y Gilbert (1987); Evan y Freeman (1988); Carroll (1989); Hill y Jones (1992); Langtry (1994); Clarkson (1995) y Donaldson y Preston (1995)—. En forma global, considerando todos los conceptos, se puede decir que stakeholder se refiere a personas, grupos de personas u otras organizaciones que tengan interés o incumbencia en las actividades de una organización, que en cierta forma dependen y se ven impactados por las actividades que desarrolla dicha organización o puedan impactar en ésta.
Siguiendo a Volpentesta (2009), repensar la forma de gerenciar una organización, en el marco de los preceptos de la RSE, implica la generación de un vínculo de confianza con los diferentes grupos de interés, lo que desafía a las

Empresas, ya que por lo general siempre se privilegia un interés por sobre otro. Por ejemplo, por lo general se priorizan los intereses de los accionistas o, en otros casos, se consideran como más relevantes los intereses de su público interno, es decir, los empleados.
Una organización que implementa las prácticas de RSE o aspira a un modelo de gestión basado en ella, tendría en cuenta que “[…] los lineamientos de la RSE y en sintonía con el nuevo paradigma del desarrollo sostenible implica volcar en el análisis estratégico el debate sobre qué intereses son los que deberían prevalecer, o bien, no ser marginados” (Volpentesta, 2009: 59).
En el análisis de los diferentes grupos de interés una cuestión a tener en cuenta es que éstos pueden clasificarse, en primarios y secundarios.

Un aspecto relevante cuando se habla de la RSE y los grupos de interés implica la transparencia en las comunicaciones de las organizaciones. A partir del compromiso que se tenga con esto, la empresa será transparente y coherente entre sus acciones y sus valores. Si se la ve sólo como un negocio en busca de rentabilidad, o si se la considera
[…] como una comunidad de personas y, por ende, como grupo social, tendrá que asumir en su propia estrategia corporativa otros objetivos desde el momento en que tome conciencia de su implicación, para bien o para mal, en el proceso de configuración de la sociedad. Ya no se espera de la empresa una simple producción de bienes y servicios sino un aporte a la mejora global del entorno que la rodea (Debeljuh, 2009: 33).
A partir de lo anteriormente mencionado puede afirmarse, siguiendo a la autora citada, que “[…] una empresa responsable es aquella que lleva adelante un negocio rentable asumiendo también los efectos ambientales, sociales y económicos que genera en la sociedad” (Debeljuh, 2009: 34) considerando en sus decisiones a los diferentes grupos de interés e integrando todas estas cuestiones de manera voluntaria.
5. La relación de la Responsabilidad Social Empresaria con el comportamiento organizacional. Tal como mencionamos en el punto anterior, la RSE se refiere al compromiso que tienen las empresas de contribuir al desarrollo sostenible y al bienestar de la sociedad. Esto implica no solo cumplir con las obligaciones legales, sino también adoptar prácticas éticas y responsables en sus operaciones y relaciones con los diferentes grupos de interés. Estas prácticas, principios y valores pueden influir en el comportamiento organizacional, generando nuevos compromisos y prácticas al interior de la dinámica organizacional.
Al adoptar prácticas de RSE, las organizaciones pueden crear un entorno de trabajo más propicio y tener un impacto positivo en el comportamiento de los miembros de la organización. Por ejemplo, al participar en iniciativas de RSE, se puede aumentar la motivación y el compromiso de los empleados, así como fomentar la cohesión y la colaboración entre los miembros y equipos de trabajo. Estos beneficios se derivan de la alineación de las acciones de RSE con los objetivos de la organización.

En un estudio realizado por Hinojosa Paz y Lopez Ocharan (2019), se determinó que las acciones de RSE tienen un impacto mediano en el comportamiento organizacional, mejorando la disposición del trabajador hacia la organización, siempre y cuando estas acciones estén alineadas a los objetivos corporativos. Por otro lado, en un trabajo de Paredes Floril, Martínez Figueroa y Burgos Cabal (2022) titulado "La Responsabilidad Social Empresarial y el Clima Organizacional de las Empresas PYMES de Guayaquil", se concluyó que es recomendable realizar un estudio entre RSE y Cultura Organizacional para evaluar aspectos conductuales de la organización y permitir una planificación estratégica que considere prácticas de RSE y procesos de mejora continua basados en la retroalimentación de las actividades.
En línea con estas ideas, Ramos, Ávalos, Vinueza y Tejera (2018) plantean que las prácticas de RSE pueden ser generadas por una cultura organizacional y se expresan directamente en los trabajadores. Por lo tanto, se puede esperar que los trabajadores sean más propensos a identificar formas de comportamiento socialmente responsable asociadas a la RSE cuando forman parte de empresas que promueven estas prácticas.
Es importante destacar que la implementación de un modelo sustentado en la RSE requiere un liderazgo comprometido con su implementación, un estilo flexible, participativo y proactivo con el personal, y la promoción de un clima de trabajo propicio para el desarrollo positivo de todos los miembros. Además, se necesita una mirada a largo plazo y el compromiso de la dirección para que las características de la RSE permeen todas las actividades y se integren a la identidad y cultura organizacional de la empresa.
El comportamiento socialmente responsable de una empresa no solo tiene un impacto en su comportamiento organizacional, sino también en la creación de su identidad como empresa socialmente responsable. Esta relación entre el comportamiento responsable y la identidad organizacional ha sido abordada por Haski-Leventhal y colaboradores en un estudio publicado en 2015.En línea con este estudio, Ramos, Ávalos, Vinueza y Tejera (2018) también mencionan que las prácticas de Responsabilidad Social Empresarial pueden ser generadas por una cultura organizacional y se expresan directamente en los trabajadores. Esto implica que los trabajadores son más propensos a identificar formas de comportamiento socialmente responsable asociadas a la RSE cuando forman parte de empresas que promueven estas prácticas.

7. Indicadores para el estudio de la RSE3

El Instituto Argentino de Responsabilidad Social Empresaria (IARSE)4 define a la Responsabilidad Social Empresaria como un “modelo de gestión que contempla los impactos económicos, ambientales y sociales derivados de la actividad empresarial”
