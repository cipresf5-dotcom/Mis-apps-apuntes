DESARROLLO Y APRENDIZAJE ORGANIZACIONAL
Dr. Cristian Oscar Marenco
Objetivos:  Analizar los procesos de cambio y su implicancia para la evolución y el desarrollo organizacional.  Entender el aprendizaje y la gestión del conocimiento como filosofía de trabajo
1. Cambio. Gestión de las resistencias al cambio. Desarrollo organizacional. Concepto y su proceso.
Una organización es un sistema complejo y abierto. La primera característica se refiere a que es creada por el hombre para satisfacer necesidades de la población; la segunda, a que es influenciada por su entorno a través de procesos de interrelación, interdependencia e interacción1. Por lo tanto, no puede estar al margen de los cambios que se van produciendo en el contexto, tanto local como internacional. En este sentido, “en las últimas décadas se han producido importantes transformaciones en el escenario económico internacional: la globalización de los mercados, las nuevas tecnologías de la información y de la comunicación (TIC) y la emergencia de nuevos paradigmas tecno-organizacionales, la volatilidad de la demanda y la segmentación de los mercados, la posibilidad de combinar escala y gama, el acortamiento del ciclo de vida de los productos y las incertidumbres estratégicas asociadas al nuevo escenario mundial han aumentado la presión competitiva que han debido enfrentar las empresas y los agentes económicos” (Boscherini y Yaguel, 2000, capítulo V).
A partir de fines de los años 60 y comienzos de los 70, y frente a la caída de las ganancias por parte de las empresas, empiezan a emerger cambios en los paradigmas de producción: se pasa de un sistema fordista (producción en serie sin tener en cuenta las necesidades de los consumidores) a un sistema más flexible y especializado basado en datos obtenidos de los consumidores. En este sentido, se flexibilizan las condiciones de producción, consumo y circulación de bienes y servicios mediante el uso de las TICs y se plantea la necesidad de información para atender nuevos nichos de mercado. De esta manera aparece la economía Digital, pues contribuyen a impulsar la innovación, el crecimiento económico, generar fuentes de empleo, aumentar la productividad, potenciar la competitividad, entre otros beneficios, en base
1 Una organización es un sistema sociotécnico incluido en otro más amplio: la sociedad (o la realidad social), con la que interactúa (proceso de influencia y de comunicación), influyéndose mutuamente. El sistema tiene por finalidad especial la transformación de recursos que provienen de su entorno y que deben devolverlos en forma de bienes, de servicios y de rendimientos mediante el uso de distintas tecnologías (Alvarez, 2003, p.137).
 a lo denominado informacionalismo, que es la producción de conocimientos e información se convierte en el sector dominante. Otro concepto interesante es la aparición de la gobernabilidad algorítmica, donde el conocimiento y la información se automatizan.
Estos fenómenos han producido cambios en la manera de cómo debe relacionarse la organización con el medio. Frente a esta situación, el administrador se enfrenta al problema de cómo adaptar los objetivos para que esos cambios no la perjudiquen.
En el campo académico, distintas disciplinas, incluyendo a la Administración, estudian el problema y ofrecen respuestas de manera interdisciplinaria. Una de ellas es la implementación de sistemas de gestión del conocimiento. “Ello se puede explicar en parte por la diversidad de disciplinas que han favorecido la emergencia de este nuevo enfoque, que van desde las ciencias cognitivas y métodos educacionales hasta las ciencias económicas y de gestión, la inteligencia artificial y la gestión de la tecnología y la información” (Bernavides Velasco y Quintana García, 2003, p.92). El aporte más importante de las ciencias administrativas en el siglo XX, según Peter Drucker (1999, p.159), fue en primer lugar, aumentar en 50 veces la productividad del trabajador manual en el sector manufacturero y en segundo, desarrollar un ideario de trabajador del conocimiento.
Los cambios en el contexto expresados anteriormente condicionan el desenvolvimiento constante y normal de las organizaciones, las cuales deben adaptarse a los requerimientos del contexto. Según la literatura especializada, transitamos por un contexto económico basado especialmente en el conocimiento, que comienza su manifestación en la década de los sesenta, con la aparición de los primeros computadores, la expansión de las multinacionales y la formación de un mercado internacional de capitales. Con el pasar del tiempo, se manifiestan hechos como:
• “el cambio del modelo fordista a una organización más flexible, • los cambios internos en las empresas japonesas y sus resultados en la competitividad internacional, • la aparición de los distritos industriales en el norte italiano, • la consolidación del mercado internacional de capitales, • las innovaciones en materia de tecnologías sobre la gestión de la información y de las comunicaciones, • Por último la consolidación de viejos bloques económicos y la formación de nuevas áreas de integración económica” (Peluffo y Contreras, 2002, p.8).

Estos hechos han sido interpretados por las organizaciones, en las cuales “la visión de lo importante está cambiando lentamente. De esta manera, nos encontramos en una nueva era donde el principal recurso empresarial intangible y endógeno es el conocimiento (...) El nuevo peso de los recursos esenciales lo tiene el capital intelectual. Las empresas que perduran requieren más gestión del conocimiento –de su capital intelectual– que la gestión de los recursos físicos –capital financiero- dado que es en estos ámbitos inmateriales donde se generan ventajas competitivas en los diferentes productos y servicios” (Ariza Montes y otros, 2004, p.11). Estos hechos dan nacimiento a la “Nueva Economía” o “Economía del Conocimiento”, que según Argandeña, tiene una dimensión tecnológica y una económica:
“desde el punto de vista tecnológico, la nueva economía es un cambio en la adquisición, el procesamiento, transformación y distribución del conocimiento y de la información, que afecta el hardware que procesa y almacena la información, el sistema de comunicaciones que la recibe y transmite y al software que dirige todo el sistema. Desde la perspectiva económica, la nueva economía se caracteriza por la creación y aportación de nuevos productos y procesos para la producción y el consumo”.(en Benavides Velasco y Quintana García, 2003, p.2)
Si nos referimos al cambio en las organizaciones podríamos resumir las circunstancias mencionadas anteriormente en fuerzas internas y externas. Krieger (2011, pp. 508-509) menciona las siguientes:
Fuerzas externas: 1. Condiciones económicas 2. Acciones de los competidores 3. Desarrollo tecnológico 4. Acontecimientos políticos y legales 5. Movimientos sociales y demográficos
Fuerzas internas: 1. Decisiones administrativas 2. Preferencias y sugerencias del personal 3. Cambios en los dueños o accionistas o modificaciones organizacionales.
En resumen, esta nueva realidad obliga al empresario a desarrollar la innovación y a crear valor en su empresa en base al conocimiento, el cual se retroalimenta a través del aprendizaje continuo.
1.2. El cambio Como hemos mencionado en la introducción y en el apartado anterior, las organizaciones frente a los cambios que se producen tanto de manera exógena como endógena, conviven permanentemente con el cambio. Veamos algunos conceptos.

Para Robbins (2009,p.621) el cambio es una realidad organizacional (…) las relaciones internas y externas se encuentran en permanente cambio.
Para Chiavenato (2009,p.411) “es pasar de un estado a otro. Es la transición de una situación a otra. Implica transformación, alteración, interrupción y ruptura (...) Ocupa un lugar importante en el estudio de la viabilidad de una organización.”
Krieger (2010,p.500) sostiene que “el cambio produce variaciones tanto de conductas, valores y actitudes de los individuos y grupos. Implica desaprender para luego aprender”.
Para Newstrom (2011,p.355) “es toda alteración en el ambiente laboral y afecta la operación esperada de los empleados. Estas modificaciones pueden ser planeadas o no, catastróficas o evolutivas, positivas o negativas, fuertes o débiles, lentas o rápidas, y estimularse interna o externamente”.
Frente a estas definiciones podemos concluir que el cambio es una situación donde es primordial comprender el comportamiento de las personas que trabajan en la organización, que son ellas las que van a permitir superar las alteraciones, variaciones, transiciones manifestadas por los autores. Focalizar en el aspecto humano de la organización es el comienzo de todo proceso de gestión del cambio.
Para poder lograr esta gestión del cambio es necesario un agente de cambio. Gibson (2011,p.474) sostiene que el interventor o agente de cambio observa la realidad organizativa con una perspectiva diferente a la situación, desafiando el estado de las cosas, generando un diagnóstico que le permita ayudar generando propuestas concretas para afrontar las situaciones que ponen en tensión a la organización. De esta manera, “el éxito de cualquier programa de cambio reside sobre todo en la calidad y en la medida en que funcione la relación entre el agente y quienes toman las decisiones fundamentales”, es decir el nivel estratégico.
Krieger (2011,p.512) sostiene que el agente de cambio puede ser un miembro de la organización como los consultores externos. Asimismo, puede producirse una combinación de los mismos generando un agente de cambio mixto.
Que el agente de cambio sea un miembro de la organización (interno) tiene como ventaja poseer un conocimiento detallado de la misma y cómo desventaja la imposibilidad de tomar distancia respecto de los intereses, los valores y la cultura organizacional, además de ser reacios a iniciar los procesos de cambio. Respecto de los consultores externos, tienen dos ventajas: su visión más objetiva de lo que sucede en la organización y que son más proclives para iniciar el proceso de cambio; como desventajas poseen menos conocimientos de la organización y responden a los mandatos de quien los contrató.

Otra cuestión que es necesaria tener en cuenta es qué tipo de cambios podemos encontrar. De acuerdo a la misma, los agentes de cambio van a poder desarrollar las estrategias necesarias para afrontar la situación y lograr un cambio efectivo.

Gibson (2011,p.478) clasifica los cambios en estructurales, conductuales y tecnológicos.

Los primeros se refieren a los intentos administrativos para mejorar el desempeño de las personas y esto se logra modificando la estructura formal de las tareas y las relaciones de autoridad. Esta situación, muchas veces produce conflictos debido a que incluye a los miembros de la organización y estos pueden sentirse excluidos. El cambio estructural va a depender de qué objetivos y metas estén buscando desarrollar los cuadros estratégicos. Entre los mismos se encuentran la simplificación del trabajo, el enriquecimiento del trabajo (con nuevas modalidades de trabajo, la descripción de los puestos y la división en departamentos en busca de mayor eficiencia y eficacia. De esta manera, los resultados esperados son la satisfacción de las personas, el desarrollo de su moral y un mejor desempeño en la organización.

Los segundos se refieren a los esfuerzos por cambiar la dirección e incrementar la motivación, las habilidades y las bases de conocimiento de los empleados. Esto se logra a través de una capacitación permanente, buscando el desarrollo de habilidades y competencias ya sea individuales como grupales. Entre los cambios actitudinales podemos nombrar la comunicación, los estilos de liderazgo y la gestión de las relaciones organizacionales, la formación de equipos, el manejo de la diversidad y la interculturalidad. Con este tipo de cambio, los resultados esperados son una mejor comunicación, un desarrollo de actitudes proactivas y de la conciencia personal y proactividad en la solución de problemas.

Los terceros incluyen cualquier aplicación de nuevas formas de transformar recursos en productos o servicios. La palabra tecnología no solo incluye software y hardware sino también nuevas técnicas para la producción de bienes y servicios. Entre los cambios tecnológicos se encuentran la incorporación de la robótica, la automatización de los procesos y la conectividad inalámbrica, buscando como resultados la eficiencia, la eficacia y la calidad en la producción.



Comoultimo.es necesario definir un modelo para el cambio organizacional vamos a tomar el modelo de Gibson (2011,p.478) de siete etapas.

En la primera se manifiesta la fuerza qué va a generar el cambio. Puede ser ambiental (el comportamiento del mercado, la evolución de la tecnología y la disponibilidad de los recursos) o también de modificación en los procesos internos (cambios en las conductas de las personas o en el funcionamiento de los procesos).
Esta afecta a la segunda donde hay que analizar los resultados de desempeño organizacionales, grupales e individuales.
A partir de la misma, se ingresa a la tercera etapa donde se obtiene el diagnóstico del problema con información y participación de las personas (mediante información obtenida de distintos instrumentos de medición tanto cuanti o cualitativos). En este momento se designa un agente de cambio.
En la cuarta etapa se selecciona la intervención adecuada de acuerdo al tipo de cambio que se diagnostica; recordemos que los tipos de cambio pueden ser estructural de tecnología o conductual.
Cuando se analiza la intervención es necesario como quinta etapa analizar las condiciones limitantes, cómo ser el clima de liderazgo, la organización formal y la cultura.
Identificadas estas limitantes, la sexta etapa incluye la definición de cómo vamos a sincronizar la implementación de la solución, cómo vamos a sincronizar los cambios y a definir el alcance de la experimentación.
Para esto es necesario, como séptima y última etapa, un método de evaluación que nos permita la retroalimentación, el ajuste, la revisión y el refuerzo. Con los datos obtenidos se podrá realizar una retroalimentación para revisar nuevamente cómo se comportan las fuerzas de cambio de la primera etapa.
1.3. Gestión de las resistencias al cambio
El hombre es un animal de costumbre, una vez lo manifestó Charles Dickens. Frente a esta situación, en general es difícil enfrentar los cambios y por supuesto no los queremos. Sin embargo, como ya sabemos, los contextos externo e interno de la organización no nos preguntan si nos gustan. Frente al cambio, los individuos pueden responder de distintas maneras. La persona puede afrontar el cambio con gusto pero en general, se produce una resistencia al cambio y esto es una respuesta de las personas a factores lógicos, psicológicos y sociológicos. Esta resistencia va a estar influenciada por la percepción de la personas, por su sentimiento de miedo o de estar amenazado. Entonces, para la persona hablamos de certeza y no de verdad. Es la percepción real de un individuo.
Franklin y Krieger (2011,p.513) mencionan que en general es posible identificar 2 razones para la oposición al cambio: primero, lo desconocido provoca temor e induce resistencia la reestructuración, causa incertidumbre y la gente desea sentirse segura y ejercer cierto control sobre el cambio; y segundo, el desconocimiento de la razón del cambio es común en las personas afectada directamente o no lo tengan en claro o no se lo hayan comunicado correctamente.
Newstrom (2011,p.362) sostiene que los factores lógicos son aquellos desacuerdos con los hechos, el razonamiento, la lógica y la ciencia. La resistencia surge del tiempo y el esfuerzo requerido realmente para adaptarse al cambio, incluyendo las nuevas obligaciones laborales que deben aprenderse. Estos son costos verdaderos que los empleados asumen. Entre los mismos se encuentran el tiempo requerido para adaptarse, el esfuerzo adicional para aprender de nuevo, la posibilidad de condiciones menos deseables, el coste económico del cambio, la viabilidad técnica del cambio cuestionada.
El factor psicológico se basa en las emociones, los sentimientos y las actitudes. Esta resistencia es internamente lógica desde la perspectiva de las actitudes de quienes pueden tener temor a lo desconocido. Entre los mismos podemos mencionar la baja tolerancia al cambio, la aversión a la administración o al agente de cambio, la falta de confianza en los demás, la necesidad de seguridad y el deseo de estatus quo.
Los factores sociológicos son el resultado de un reto para intereses grupales normas y valores. Dado que los valores sociales son fuerzas poderosas en el ambiente deben considerarse con cautela. Entre los mismos podemos encontrar las coaliciones políticas, los valores grupales opuestos, los intereses personales y el deseo de conservar las amistades existentes.
Chiavenato (2014,p.329) sostiene que no todos los cambios afectan de por igual a las personas. Cada una tiene un umbral de sensibilidad al cambio. En este sentido, el siguiente cuadro muestra ese umbral de sensibilidad.

1.4. Desarrollo Organizacional y su proceso

Una forma de gestionar el cambio en las organizaciones es lo denominado desarrollo organizacional. La planificación del cambio es un requisito para lograr que el proyecto sea un éxito y pueda lograrse los resultados esperados.
Chiavenato (2009,p.435) citando a Porras y Robertson (1992) manifiesta que «el Desarrollo Organizacional engloba un conjunto de acciones de cambio planeado con base en valores humanísticos y democráticos, que pretende mejorar la eficacia de la organización y el bienestar de las personas (…) Utiliza una serie de tecnologías basadas en la psicología aplicada en la administración (…) es un enfoque de cambio planeado que se concentra en cambiar a las personas, así como la naturaleza y la calidad de sus relaciones de trabajo. El Desarrollo Organizacional hace hincapié en el cambio cultural como base para el cambio organizacional; es decir, modificar la mentalidad de las personas para que éstas puedan revitalizar a la organización.
Para Newstron (2011,p.341) es la aplicación sistemática del conocimiento de las ciencias de la conducta en diversos niveles (grupo, intergrupal y la organización total) para realizar el cambio planeado. Sus objetivos incluyen mayor calidad de vida laboral, productividad, adaptabilidad y eficacia. Intenta usar el conocimiento del comportamiento para cambiar creencias, actitudes, valores, estrategias, estructuras y prácticas de tal manera que la organización se adapte mejor a las acciones competitivas a los adelantos tecnológicos y al ritmo rápido de otros cambios que ocurren en el ambiente.
A partir de estas dos definiciones podemos concluir que el desarrollo organizacional se centra en la modificación de las conductas de las personas mediante técnicas psicológicas para mejorar su vida y la organización. Se busca un cambio cultural desde una perspectiva de sistema, es decir relacionando e interaccionando la estructura, la tecnología y el personal (específicamente su comportamiento).
De acuerdo a Newstron (2011,p.341), el desarrollo organizacional parte de los siguientes supuestos:
a) Individuales: las personas desean madurar y crecer. Los empleados tienen muchas cosas que ofrecer (como ser conocimiento) y es necesario aprovecharlas.
b) Grupales: los grupos y equipos son decisivos para el éxito organizacional por qué ejercen una influencia poderosa sobre el comportamiento individual. Los comportamientos grupales requieren el desarrollo de habilidades.
c) Organizacionales: los controles, las políticas y las reglas excesivas son perjudiciales, el conflicto debe ser gestionado y las metas individuales deben estar alineadas a las organizacionales.

El proceso del desarrollo organizacional es complejo. Su diseño e implementación puede tener una duración mayor a un año. Por tal motivo la gerencia debe estar comprometida con el proceso y debe comunicar correctamente a todos los empleados los alcances de la misma. El proceso requiere tiempo, tiene un gasto considerable, y es necesario seleccionar correctamente quienes lo van a llevar adelante porque puede generar daño a los empleados invadiendo su privacidad o generando un posible daño psicológico.



El proceso, si se lo implementa, tiene que realizarse por completo. No puede llevarse a cabo por partes. El proceso implica: 1) realizar un diagnóstico, 2) recolección de datos; 3) retroalimentación de datos; 4) planificación de la acción; 5) Intervención de desarrollo organizacional; 6) Evaluación y seguimiento.

2. Aprendizaje y conocimiento organizacional. Conceptos y diferencias. Gestión del conocimiento. Organización inteligente. Conocimiento tácito y explícito: conceptos y mecanismos para relacionarlos.
De acuerdo con lo manifestado en los apartados anteriores, es necesario que las organizaciones se orienten “a generar saberes a partir de las informaciones y convertir a éstos en ventajas competitivas sostenibles y éxitos comerciales” (North y Rivas, 2004,p.41).
Dentro de las organizaciones se produce permanentemente un gran bagaje de signos y datos, que al darles significado se transforman en información, la cual debe ser interpretada por las personas de manera consciente, interrelacionándola y contextualizándola de acuerdo con su puesto y experiencia individual en el ámbito laboral. De esta manera, los signos, los datos y la información se transforman en conocimiento.
Por lo tanto, podría afirmarse que el conocimiento no está en los documentos sino en las personas. Se trata de un acto humano en el cual la persona utiliza sus habilidades y experiencia para interpretar la información. De esta manera, Maryan Alavi y Dorotht Leidner definen al conocimiento como “una creencia personal justificada que aumenta la capacidad de un individuo para llevar a cabo una acción de manera eficiente” (en Barnes y otros, 2002,p.19). Según Chiavenato (2009,p.154) la organización no puede crear conocimiento por sí misma, sin la iniciativa de los individuos y sin la interacción entre los grupos y entre ellos. El conocimiento puede ampliarse o cristalizarse en grupos, por medio de discusiones y compartiendo experiencias y observaciones.
Información y conocimientos no son conceptos radicalmente opuestos, sino que la información se transforma en conocimiento una vez procesada en la mente del individuo (conocimiento tácito) y se transforma de nuevo en información (conocimiento explícito).
Antes de continuar, es necesario definir qué se entiende por conocimiento explícito y conocimiento tácito. El primero es aquel que puede ser expresado en palabras y números, es fácilmente transmitido y compartido en forma de procedimientos codificados, fórmulas científicas o principios universales. Se lo puede codificar e integrar en reglas, herramientas y procesos formales.
En cambio, el conocimiento tácito es un conocimiento interior, subyacente, muy personalizado y su formalización es compleja, por lo que es difícil de transmitir. Polanyi lo define como “aquel conocimiento que se encuentra en las personas, que es difícil de articular y codificar de alguna forma que pueda ser comprensible para otros, y que surge de los cambios que estas personas realizan a la forma de hacer las cosas, de su experiencia, cuya incidencia se evidencia en el desempeño y en la capacidad de dar respuestas eficientes ante nuevos problemas o desafíos” (En Peluffo y Contreras, 2002,p.16). La importancia de poder capturar este tipo de conocimiento reside en que es una fuente de recurso para el sistema de innovación. Por lo tanto, a mayor conocimiento tácito aprovechable, mayor valor o competitividad tendrá la organización.
Marta Alles manifiesta que “frecuentemente las empresas no tienen conciencia del conocimiento disponible en las mismas, lo que resta eficacia a los procesos operativos y, muchas veces, implica duplicidad de esfuerzos: en un sector se invierte tiempo y recursos en resolver una determinada situación, desconociéndose la solución dada anteriormente a un problema similar en otra área de la misma organización, que hubiera podido aplicarse ante la nueva situación de manera sencilla y sin mayores costos”(Alles, 2007,p.361).
En resumen, es necesario que la organización se preocupe por administrar eficientemente el conocimiento tácito y transformarlo en explícito. El reto actual de las organizaciones, y especialmente de los gerentes, es desarrollar estrategias que valoricen el conocimiento de todos sus actores involucrados, especialmente de sus recursos humanos. De acuerdo con lo que manifiesta Fernando Grosso, “hoy el instrumento esencial de diferenciación competitiva de las organizaciones es la innovación, y ésta, evidentemente, sólo puede ser generada por las personas (...) Cada compañía depende de la gente, cuando ésta decide hacer algo de manera mejor y diferente” (En Pérez, Lindo Augusto, 2005,p.150).
Si se aprovecha este conocimiento, se está generando aprendizaje en la organización. De acuerdo a Chiavenato (2009,p.162) el aprendizaje organizacional es la capacidad de generar nuevas ideas y diseminarlas por toda la organización. Permite a las empresas crear, mantener, mejorar y organizar el conocimiento y la rutina de sus actividades y cultura para utilizar las habilidades de su fuerza de trabajo de modo cada vez más eficiente.
En las organizaciones se dan dos tipos de aprendizaje: el aprendizaje individual y el aprendizaje organizacional. El aprendizaje individual se manifiesta cuando la persona “comienza a experimentar desde una actitud de neutralidad intelectual y objetividad, descubre y comprende cosas que sin esa actitud mental hubieran quedado ocultas. De esta manera, comienza a hacer descubrimientos que lo conducen a nuevas visiones de la realidad” (Del Prado, 1999,p.244). El aprendizaje se logra si la persona está comprometida con su realidad y busca continuamente su desarrollo y mejoramiento personal de manera permanente.
El aprendizaje permanente en una organización genera ventajas competitivas sustentables a largo plazo, y esto produce beneficios tanto para los individuos como para la organización. Por eso, una efectiva gestión del conocimiento se basa en una actitud de aprendizaje continuo por parte de todos los individuos que forman la organización. Sin embargo, el proceso debe ir más allá del aprendizaje personal; el conocimiento de una persona debe ser integrado al de los demás. De esta forma, se logra promover un aprendizaje de toda la organización que genera un conocimiento colectivo.
Para lograr el aprendizaje organizacional, es necesario que los individuos trabajen en equipos cohesionados, lo que les permite comunicarse, discutir y consensuar posibles soluciones y/o mejoramientos de los procesos y problemas que se desarrollan en la empresa y obtener un resultado mayor de su aprendizaje que el obtenido individualmente. Bolivar (2001) en su artículo “Los centros educativos como organizaciones que aprenden: una mirada crítica”, señala dos características del aprendizaje organizacional: en primer lugar, trasciende la suma de los aprendizajes individuales y aumenta las capacidades profesionales y personales de los miembros a través de nuevos métodos de trabajo o saberes específicos lo que permite lograr crecimiento y expectativas de supervivencia y desarrollo de la organización para mejorar resultados e imagen, además de la capacidad de adaptación al entorno cambiante; y en segundo lugar, al optimizar el potencial formativo de los procesos cualifica a los que trabajan en ella, además de responder a las demandas y cambios externos. Asimismo manifiesta que “institucionaliza la mejora (aprendizaje organizativo) como un proceso permanente, creciendo como organización” (Bolívar,2001,p.2).
Para un aprendizaje organizativo efectivo, se deben manifestar cuatro aspectos centrales: en primer lugar, la intencionalidad de producirlo especialmente por parte del nivel jerárquico; en segundo lugar, la operacionalización del proceso en todos los niveles organizativos; en tercer lugar, debe existir una auto transformación de la organización a través de sus procesos y la toma de decisiones y por último su incidencia debe afectar a todos los implicados en la organización, tanto internos como externos (en este último caso, por ejemplo, a través del mejoramiento de los servicios brindados a los clientes).
A manera de síntesis, en las empresas generadoras de conocimiento no hay un grupo determinado que tenga la exclusiva responsabilidad de crear conocimiento.

Todos los niveles de la organización participan del proceso. El valor de la aportación de un empleado no se determina por la posición en la estructura organizativa, sino por la importancia de la información que ofrece a la totalidad del sistema creador del conocimiento. En realidad, la creación de nuevo conocimiento es producto de una interacción dinámica entre las distintas funciones.
2.1. Gestión del conocimiento Existen diversas definiciones sobre qué se entiende por gestión del conocimiento. Perez Lindo (2005,p.19) sostiene que es una herramienta para: en primer lugar, captar, producir y transferir los distintos conocimientos necesarios para llevar adelante la organización; y en segundo lugar, “gestionar los recursos humanos y materiales de manera inteligente para lograr tales fines”.
Alles (2007,p.361) define a la gestión del conocimiento como “un proceso sistemático de búsqueda, selección, organización y difusión de información, con el propósito de aportar a los integrantes de una organización los conocimientos necesarios para desarrollar eficazmente su labor. Permite, además, obtener información y comprender mejor acerca de las propias experiencias para, posteriormente, aplicarlas en las tareas diarias (...). Se trata, en definitiva, de transformar la experiencia en conocimiento, y el conocimiento en experiencia”.
Nonaka (1999,p.24) manifiesta que “las empresas sólo alcanzarán el éxito cuando de un modo consistente se creen nuevos conocimientos, los difundan por toda la empresa y los incorporen rápidamente a las nuevas tecnologías y productos. Estas son las actividades que definen a la empresa “creadora de conocimiento”, donde todo el negocio gira sobre la innovación continuada”.
Grosso (en Pérez Lindo, 2005,p.145) interpreta que la gestión del conocimiento implica “un conjunto de procesos y decisiones tendientes a preservar y mejorar el desempeño del llamado “capital intelectual” de la organización, y obviamente éste se expresa a partir del comportamiento humano. Hablar de gestión del conocimiento, entonces, así como cualquier otra estructura de pensamiento organizativo que ponga énfasis en las personas antes que en los sistemas, no es otra cosa que una filosofía de trabajo asentada en tres pilares básicos: la conducción, la motivación y el aprendizaje”.
Por lo tanto, de las definiciones anteriores, se deduce que la gestión del conocimiento es un proceso e involucra la sistematización de actividades para la captura, la generación, la comunicación, la distribución y el aprovechamiento de los conocimientos y el desarrollo del capital intelectual. En este sentido, la dirección debe estar comprometida con todo el proceso.
La organización inteligente es aquella orientada al conocimiento (Chiavenato, 2009, pp.164 y ss). Es decir, una organización capaz de crear, adquirir y transmitir conocimiento y de modificar su comportamiento permanentemente para adaptarse al contexto.
Weyrauch, Richards y D´Agostino (2010) clasifican las herramientas, por un lado como internas y externas; y por otro lado, de desarrollo estratégico, técnicas de gestión, mecanismos de colaboración, intercambio de conocimientos y procesos de aprendizajes, captura y almacenamiento de conocimientos.
Las herramientas internas son aquellas que pueden ser implementadas en el interior de la organización y aprovechadas por los recursos humanos que trabajan en la misma sin discriminación de posición y de nivel dentro de la estructura organizativa. Permiten que exista mayor comunicación y cercanía entre el personal. Las externas permiten una mayor comunicación y relación con los clientes, ciudadanos, organismos y organizaciones con los cuales la organización se relaciona.
En cuanto a las herramientas que permiten el desarrollo de estrategias, generan competencias en la organización para mirar de una forma estratégica su conocimiento y aprendizaje. Las mismas pueden ser usadas para planear, monitorear y evaluar iniciativas de conocimiento y aprendizaje; respecto de las relacionadas a las técnicas de gestión, desarrolla el liderazgo para resolver qué cosas sería correcto hacer. Además generan un contexto favorable para la evaluación de las respuestas administrativas a los errores, de las fuerzas a favor y en contra de los cambios organizacionales indicados, datos útiles para los responsables que trabajan sobre la organización del aprendizaje. En cuanto a las herramientas que facilitan mecanismos de colaboración, permiten facilitar las prácticas colaboradoras efectivas, ayudando a generar equipos de trabajo y a fortalecer las relaciones y a desarrollar un pensamiento compartido. En cuanto al intercambio de conocimientos y el proceso de aprendizaje, permiten la comunicación de experiencias y de buenas prácticas en los distintos ámbitos de la organización, priorizando la innovación y el intercambio entre los distintos participantes. Las actividades de captura y almacenamiento del conocimiento aseguran que el conocimiento esencial sea retenido por una organización.

Un término que se puede encontrar en la bibliografía es del capital intelectual. Brooking (1997,p.25) sostiene que el capital intelectual no es algo nuevo, sino que ha estado presente desde el primer momento en que un vendedor estableció una nueva relación con el cliente (…) hace referencia a la combinación de activos inmateriales que permiten que la empresa funcione. En este sentido, la empresa (E) está conformada por activos materiales (AM) y capital intelectual (CI) E = AM + CI.
Asimismo sostiene que capital intelectual se divide en activos de mercado, activo de propiedad intelectual, activos centrados en el individuo y activos de infraestructura. El primero hace referencia a las marcas, clientela, capacidad de fidelizar y contratos como franquicias; son importantes porque dan a la empresa ventaja competitiva en el mercado denotando propiedad e identidad a los productos y servicios. El segundo, incluye el know how, los secretos de fabricación, el copyright, las patentes, los diseños; dan al propietario exclusividad y monopolio sobre invenciones y procedimientos. El tercero comprende la pericia colectiva, la capacidad creativa, la habilidad para resolver problemas, el liderazgo y la capacidad empresarial y de gestión; es importante conocer las posibilidades de cada persona en la organización y de esta manera, asignar de manera óptima de los puestos de trabajo. El cuarto son las tecnologías, las metodologías y los procesos que hacen posible el funcionamiento de la organización; aportan orden, seguridad, correcciones y calidad a la organización, además de un contexto para que las personas trabajen y se comuniquen entre sí.
Concluyendo, el conocimiento organizacional permite desarrollar el capital intelectual de una organización, sirviendo de insumos para el desarrollo de nuevas prácticas y procesos y el crecimiento tanto personal como organizacional de las personas involucradas.

4. Conclusión

Comprender el cambio en una organización es una actividad necesaria para todo administrador/a. Nada es estático y en cada momento se observan nuevos sucesos que influyen en la organización, tanto desde adentro de la misma como desde su contexto. Como vamos a ver más adelante, el cambio implica adaptar o dejar de realizar determinados comportamientos, procedimientos, actitudes para enfrentar los nuevos desafíos.

Una manera de realizarlo es gestionando el conocimiento, especialmente el interno. Si se lo hace correctamente, y todos los trabajadores están alineados en gestionarlo, se desarrolla el aprendizaje organizacional y de esta manera el/la administrador/a posee elementos endógenos para aprovecharlos como una ventaja competitiva para la toma de decisiones.



Otra manera, es planeando el cambio y a esto lo denominamos desarrollo organizacional. Como veremos en las próximas páginas, para el manejo del cambio es necesario estudiar el comportamiento de las personas que trabajan en ella para ayudarlos a superar los obstáculos como grupo y de sus relaciones interpersonales para lograr los objetivos de la organización.

EJE IV – NIVEL TRANSVERSAL UNIDAD VIII – PROCESOS ORGANIZACIONALES
PUNTO 4
Toma de decisiones organizacionales Concepto, proceso, factores humanos, percepción y racionalidad limitada
Nota de cátedra Sociología de las Organizaciones Facultad de Ciencias Económicas – UNNE
2026
Objetivos
Al finalizar la lectura de este punto, el/la estudiante será capaz de: • Comprender el concepto de decisión organizacional y su centralidad en el comportamiento de las organizaciones. • Distinguir los tipos de decisiones (programadas y no programadas) y reconocer sus implicancias para la gestión. • Describir el proceso general de toma de decisiones en las organizaciones, identificando cada etapa y sus condicionantes. • Comprender el concepto de racionalidad limitada de Herbert Simon y sus consecuencias para el análisis organizacional. • Identificar los factores humanos —especialmente la percepción— que condicionan el proceso de toma de decisiones. • Aplicar la variable "procesos organizacionales" de la Matriz de Análisis de la cátedra al caso de estudio de su organización.
Introducción
La toma de decisiones es el proceso más omnipresente de la vida organizacional. Toda acción de gestión — implementar un cambio, diseñar un programa de capacitación, definir una política de precios, responder a un conflicto grupal— presupone decisiones. Por eso, Herbert Simon la ubicó en el centro de su teoría del comportamiento organizacional: la organización no es solo un sistema de acciones sino, fundamentalmente, un complejo sistema de decisiones (Chiavenato, 2009, p. 227). En el programa de la asignatura, la toma de decisiones integra el Eje IV junto con el cambio organizacional y el aprendizaje y la gestión del conocimiento. Estos tres procesos no son temas separados: se articulan porque toda decisión de cambio organizacional requiere procesar información y conocimiento, y todo proceso de aprendizaje organizacional produce nuevo conocimiento que retroalimenta las decisiones futuras. Esta nota de cátedra desarrolla el punto 4 del programa —toma de decisiones organizacionales— y articula su estudio con la Matriz de Análisis de la cátedra (2026), que los estudiantes deben aplicar en el análisis de su organización.

1. Concepto de decisión organizacional
El éxito de las organizaciones es resultado de las decisiones que toman sus miembros, principalmente sus administradores, sobre el presente y el futuro. Buena parte de las decisiones cotidianas se toman en forma rutinaria y estandarizada; sin embargo, la mayoría de las determinaciones de mayor impacto se toma con riesgo e incertidumbre, sin garantía alguna de éxito, en situaciones vagas e imprecisas, en medio de constantes cambios y con base en información superficial y puntos de vista encontrados (Chiavenato, 2009, p. 227).
En términos formales, la toma de decisiones en las organizaciones es definida como el proceso de identificar y resolver problemas (Chiavenato, 2009, p. 227). Robbins (2009, p. 147) precisa que la toma de decisiones ocurre como reacción a un problema: una discrepancia entre el estado actual de las cosas y algún estado deseable que requiere considerar cursos de acción alternativos. Gibson, Ivancevich y Donnelly (2011, p. 453) agregan que las decisiones deben considerarse medios y no fines: son mecanismos organizacionales con los que se trata de lograr un estado deseado, y cada decisión es el resultado de un proceso dinámico influenciado por una multitud de fuerzas.
Un punto central en Simon es que no solo los administradores toman decisiones. Todas las personas de cada área y nivel jerárquico toman continuamente decisiones, aunque no todas estén relacionadas directamente con su trabajo. Desde este enfoque, la organización está permeada de decisiones que anteceden a sus acciones: cada persona participa racional y conscientemente, elige y toma decisiones con base en su personalidad, motivaciones, actitudes y percepciones. Los procesos de raciocinio y percepción de las situaciones son básicos para explicar el comportamiento humano en las organizaciones. Las personas son procesadoras de información y tomadoras de decisiones (Chiavenato, 2009, p. 227).
Chiavenato (2009, p. 228) precisa que toda decisión implica seis elementos constitutivos:
• El decisor: la persona que elige entre varias opciones de acción. • Los objetivos: los resultados que el decisor pretende alcanzar con sus acciones. • Las preferencias: los criterios que el decisor aplica para hacer su elección. • La estrategia: el curso de acción escogido. Depende de los recursos disponibles y de la percepción de la situación. • La situación: las condiciones que rodean al decisor, muchas fuera de su control, que afectan su elección. • El resultado: la consecuencia o resultante de la estrategia adoptada.
Esta estructura pone de manifiesto algo decisivo para el análisis organizacional: la percepción de la situación no es un factor marginal sino un elemento constitutivo de toda decisión. El decisor no opera sobre la realidad objetiva sino sobre su representación subjetiva de esa realidad.
2. Tipos de decisiones: programadas y no programadas
Una de la clasificación más utilizada en la literatura es la propuesta por Simon y adoptada por Gibson et al. (2011, p. 450) y Chiavenato (2009, p. 228), que distingue dos tipos fundamentales:
2.1. Decisiones programadas
Son aquellas que se repiten, son cotidianas, están bien definidas y siguen procedimientos establecidos para resolver el problema. Se trata de decisiones estructuradas porque los criterios de desempeño son claros, la información es adecuada y las opciones son fácilmente especificadas, además de que existe relativa certeza de que la opción escogida tendrá éxito (Chiavenato, 2009, p. 228). Se manejan mediante reglas, procedimientos operativos estándar y políticas de la organización (Gibson et al., 2011, p. 450).

Ejemplos: los criterios de selección de personal, la determinación de precios de productos y servicios, la definición de costos de producción, las partidas presupuestadas para servicios, el procesamiento de pedidos habituales.
2.2. Decisiones no programadas
Son esporádicas y no cuentan con procedimientos definidos para resolverlas. Se presentan cuando la organización enfrenta una situación nueva o compleja ante la que no sabe exactamente cómo reaccionar. No existen criterios claros, las opciones son imprecisas y no es seguro que la solución propuesta corrija el problema (Chiavenato, 2009, p. 228). Requieren creatividad, intuición, tolerancia a la ambigüedad y solución creativa de problemas (Gibson et al., 2011, p. 450).
Ejemplos: la planeación estratégica, la reducción de costos de las operaciones, la reacción ante nuevos competidores, la reorganización estructural, la gestión de una crisis reputacional.
Esta distinción es relevante para el diagnóstico organizacional: los administradores deben manejar eficientemente las decisiones programadas sin consumir recursos innecesarios, reservando capacidad analítica y creativa para las no programadas, que son las que más inciden en el desempeño estratégico de la organización.
3. El proceso de toma de decisiones
Gibson et al. (2011, pp. 453-456) describen el proceso de toma de decisiones como una secuencia dinámica — no un conjunto de pasos fijos— que permite examinar cada elemento en el curso normal que lleva a una decisión. Es más aplicable a las decisiones no programadas, que son las que demandan mayor análisis. El proceso incluye las siguientes etapas:

1. Establecimiento de metas y objetivos específicos y medición de resultados. Las organizaciones necesitan metas en cada área donde el desempeño influya en la eficacia. Las bien establecidas dictarán qué resultados deben lograrse y las medidas que indican si se han alcanzado. Crucialmente, la alta dirección debe comunicar que está dispuesta a tolerar la experimentación y el fracaso de los subordinados; de lo contrario, los administradores de nivel medio y bajo evitarán situaciones que impliquen riesgo y los resultados serán mediocres.
2. Identificación del problema. Una condición necesaria para que se deba tomar una decisión es que haya un problema: una brecha entre las metas y los objetivos y los niveles de desempeño real. Tres factores dificultan frecuentemente esta identificación: (a) los problemas de percepción —se puede percibir selectivamente la información negativa para distorsionar su verdadero significado—; (b) la tendencia a definir los problemas en términos de soluciones, saltando a conclusiones sin análisis causal; y (c) la identificación de síntomas como si fueran el problema de fondo, que lleva a intervenciones sobre efectos y no sobre causas.
3. Desarrollo de alternativas. Antes de decidir se deben desarrollar las alternativas factibles y considerar las posibles consecuencias de cada una. Es un proceso de búsqueda en los ambientes interno y externo de la organización, dentro de restricciones de tiempo y costos. Existe un vínculo positivo entre el número de alternativas consideradas y la velocidad con la que se puede llegar a las decisiones: no generar suficientes alternativas termina por costar más tiempo y recursos.
4. Evaluación de alternativas. Se evalúan y comparan bajo tres posibles condiciones: certidumbre (se conoce bien el resultado de cada alternativa), incertidumbre (no se conoce en absoluto el resultado) y riesgo (se conoce hasta cierto punto el resultado). Esta última es la condición más frecuente en las organizaciones.
5. Elección de una alternativa. El propósito es resolver el problema para lograr el objetivo previamente determinado. La decisión no es un fin en sí misma sino el medio para lograr ese fin. En la práctica administrativa es imposible encontrar soluciones óptimas: quien decide es un satisfactor más que un optimizador, seleccionando la alternativa que cumple con un estándar aceptable (Gibson et al., 2011, p. 455).

6. Implementación. Cualquier decisión que no se implementa es poco más que una abstracción. La puesta en práctica incluye a las personas: la prueba de la fortaleza de una decisión es la conducta de quienes se ven afectados por ella. El trabajo del administrador no solo consiste en elegir buenas soluciones, sino en transformarlas en conducta dentro de la organización mediante comunicación eficaz.
7. Control y evaluación. Una administración eficaz incluye la medición periódica de los resultados reales comparados con los planeados. Si se detectan desviaciones, se hacen los cambios pertinentes en la solución elegida, en su implementación o en el objetivo original. Una vez implementada una decisión, el administrador no puede dar por hecho que el resultado cumplirá el objetivo: es necesario un sistema de control y evaluación (Gibson et al., 2011, p. 457).
Robbins (2009, p. 148) formula además un modelo racional de seis pasos —definir el problema, identificar criterios de decisión, asignar ponderaciones, desarrollar alternativas, evaluarlas y seleccionar la mejor— que presupone información completa y evaluación no sesgada. Sin embargo, el propio autor advierte que en el mundo real la mayor parte de las decisiones no sigue este modelo: las personas se satisfacen con soluciones razonables y las elecciones tienden a estar limitadas a la vecindad del síntoma del problema.
4. Racionalidad limitada: el aporte central de Herbert Simon
El modelo racional de toma de decisiones describe cómo debería decidirse en condiciones ideales. Herbert Simon, Premio Nobel de Economía en 1978, demostró que esas condiciones no existen en la práctica organizacional y propuso en su lugar el concepto de racionalidad limitada (bounded rationality) para describir cómo deciden realmente las personas.
Para Simon, la racionalidad de los actores organizacionales está acotada por tres condiciones estructurales que no pueden eliminarse: la información disponible es siempre incompleta; la capacidad cognitiva de la mente humana para procesar información es finita; y el tiempo disponible para decidir es restringido. En consecuencia, los decisores no buscan la solución óptima —la que maximiza el resultado— sino la solución satisfactoria: aquella suficientemente buena dado el nivel de aspiraciones y los recursos disponibles. Gibson et al. (2011, p. 455) sintetizan esta idea señalando que quien decide es un satisfactor más que un optimizador.
Chiavenato (2009, p. 227) refuerza esta perspectiva desde el enfoque conductual: la organización es un sistema de decisiones en el cual cada persona escoge entre opciones más o menos lógicas con base en su personalidad, motivaciones, actitudes y percepciones. La racionalidad no es plena sino condicionada: lo que el decisor percibe y siente estructura el campo de alternativas que considera y el peso que les asigna.
Las implicancias de este concepto para el análisis organizacional son profundas:
• Las decisiones de gestión no siempre son las mejores técnicamente posibles, no porque los administradores sean incompetentes, sino porque operan con información incompleta y bajo presión de tiempo.
• Los procesos de cambio se resisten aunque sean objetivamente beneficiosos, porque los actores los evalúan con base en su percepción subjetiva y no en la realidad objetiva del cambio.
• El conocimiento disponible en la organización no siempre se utiliza en las decisiones que se toman, porque los decisores filtran la información según sus marcos cognitivos previos.
• Las intervenciones de mejora organizacional deben contemplar estos límites: diseñar procesos de decisión que compensen las limitaciones cognitivas mediante información más accesible, participación amplia y criterios explícitos.
5. Percepción y factores humanos en la toma de decisiones
5.1. La percepción como condicionante decisional
Chiavenato (2009, p. 228) señala con precisión que la existencia de un problema o la necesidad de una decisión dependen básicamente de la percepción de cada persona u organización. Un director de ventas puede sentirse horrorizado ante una caída de 5% en las ventas, mientras otro puede considerarla normal o incluso satisfactoria ante la coyuntura económica. El problema no está en los datos: está en cómo se los percibe.
Robbins (2009, p. 40) define la percepción como el proceso por el que los individuos organizan e interpretan las impresiones de sus sentidos con objeto de asignar significado a su entorno. Lo que importa en términos de comportamiento no es la realidad en sí, sino el mundo según es percibido. Tres conjuntos de factores influyen en esa percepción:
• Factores en el receptor: actitudes, motivos, intereses, experiencias del pasado y expectativas. Si el decisor espera encontrar cierto tipo de problema, lo percibirá de ese modo independientemente de las características reales de la situación.
• Factores en el objeto percibido: novedad, movimiento, tamaño, proximidad y similitud. Las características propias del problema influyen en cómo se lo percibe y qué aspectos se priorizan.
• Factores en la situación: el momento, la atmósfera laboral y social, y el contexto en que se observa el problema condicionan la atención y la interpretación.
Aplicado al proceso de decisión, Robbins (2009, pp. 147-148) señala que la toma de decisiones ocurre como reacción a un problema, pero la existencia misma de ese problema es un asunto de percepción. Además, cada decisión requiere interpretación y evaluación de información proveniente de fuentes múltiples: serán las percepciones del decisor las que determinen cuáles datos son relevantes y cuáles no. Las alternativas no vienen con etiquetas que identifiquen sus fortalezas y debilidades: es el proceso perceptual del decisor el que tiene mucho que ver en la elección final.
5.2. Factores conductuales adicionales
Gibson et al. (2011, p. 457) identifican otros factores conductuales que influyen en el proceso de toma de decisiones, más allá de la percepción:
• Ética y valores: la ética es un sistema o código que guía la conducta de los individuos y los ayuda a evaluar alternativas en términos de lo que está bien y lo que está mal. Los valores individuales influyen fuertemente en la alternativa elegida, especialmente cuando un objetivo organizacional entra en conflicto con otro u con objetivos sociales.
• Personalidad: las características de personalidad del decisor condicionan su estilo de procesamiento de la información y la tolerancia a la ambigüedad.
• Propensión al riesgo: la disposición del decisor frente a la incertidumbre afecta directamente qué alternativas considera aceptables y cuáles descarta.
• Potencial de disonancia cognitiva: cuando la información recibida es incompatible con creencias o decisiones previas, surge un conflicto interno que el decisor tiende a resolver modificando sus percepciones antes que los hechos.
• Escalamiento del compromiso: la tendencia a persistir en un curso de acción ya emprendido aunque la evidencia indique que no está produciendo los resultados esperados. Es uno de los sesgos más frecuentes en decisiones organizacionales de largo plazo.
Estos factores explican fenómenos recurrentes en las organizaciones: la persistencia en decisiones subóptimas, la resistencia a la evidencia contraria, la repetición de patrones de comportamiento ineficaces. Permiten también conectar la toma de decisiones con los otros procesos del eje transversal: la resistencia al cambio es, en gran medida, una resistencia perceptual; la disonancia cognitiva es un obstáculo para el aprendizaje organizacional; y el escalamiento del compromiso puede bloquear decisiones de desarrollo organizacional que sería racional tomar.

6. El eje transversal en la Matriz de Análisis de la cátedra
6.1. Los procesos organizacionales como variable de análisis La Matriz de Análisis de la cátedra (2026) organiza el estudio del comportamiento organizacional en tres niveles —macro, meso y micro— y un eje transversal. En ese eje, la variable central es Procesos organizacionales, que integra tres dimensiones:

DIMENSIONES

POSIBLES INDICADORES

Proceso de cambio

Existencia de comunicación formal del cambio, presencia de resistencias explícitas, rol del agente de cambio.

Proceso de organizacional aprendizaje

Mecanismos de reflexión sobre errores, espacios de transferencia de conocimiento

Grado de centralización Proceso de toma de decisiones decisional, participación en decisiones no programadas.
Fuente: Matriz de Análisis. Sociología de las Organizaciones, 2026.

6.2. Por qué estos tres procesos son transversales
La denominación "eje transversal" no es arbitraria. Estos tres procesos son transversales porque no pertenecen a un solo nivel de análisis: atraviesan simultáneamente el nivel macro (la organización como sistema), el nivel meso (los grupos y equipos) y el nivel micro (los individuos). Una decisión, por ejemplo, se toma a nivel individual pero tiene consecuencias grupales y organizacionales. Un proceso de cambio se diseña a nivel organizacional pero se implementa a través de grupos y se experimenta a nivel individual. Un proceso de aprendizaje requiere cambios individuales que se consolidan en rutinas grupales y finalmente en cultura organizacional.
Esta transversalidad implica que, al analizar una organización concreta, los tres procesos deben estudiarse en su interdependencia y no como fenómenos independientes. La decisión de implementar un cambio activa resistencias perceptuales (toma de decisiones y percepción). La gestión de esas resistencias requiere generar aprendizaje organizacional (conocimiento compartido). Y la efectividad del proceso de cambio depende, en última instancia, de la calidad de las decisiones que se tomen en cada etapa.
6.3. Las singularidades de cada proceso: qué observar en el caso de estudio
El paneo comparativo de los tres procesos permite identificar singularidades propias de cada organización que condicionan la viabilidad de cualquier intervención. La siguiente tabla sintetiza las preguntas diagnósticas clave para cada proceso:

PROCESO

POSIBLES PREGUNTAS DIAGNÓSTICAS PARA EL CASO DE ESTUDIO

¿Qué tipo de cambios ha experimentado la organización en los últimos años

Proceso de cambio (estructurales, conductuales, tecnológicos)? ¿Fueron espontáneos o (Lewin)
 planificados? ¿Se identifican indicios de resistencia al cambio? ¿De qué tipo (lógica, psicológica, sociológica)? ¿Existe o existió un agente de cambio identificable? ¿Hay compromiso de la alta dirección con los procesos de cambio?

Proceso de aprendizaje organizacional (Argyris)

¿La organización genera mecanismos de captura y transferencia de conocimiento? ¿Qué tipos de conocimiento (tácito/explícito) son relevantes en su actividad? ¿Existe aprendizaje organizacional efectivo o predomina el aprendizaje individual no sistematizado? ¿La estructura organizacional facilita o dificulta el intercambio de conocimiento? ¿Se observa una cultura que promueve o inhibe el aprendizaje?

Proceso de toma de decisiones (Simon)

¿Cómo se toman las decisiones estratégicas en la organización? ¿Son predominantemente programadas o no programadas? ¿Cómo se distribuye la autoridad decisional (centralización/descentralización)? ¿Se identifican sesgos perceptuales o de escalamiento del compromiso en decisiones recientes? ¿Cómo se gestiona la incertidumbre? ¿Se evalúan los resultados de las decisiones tomadas?

Fuente: elaboración propia en base a Matriz de Análisis – Notas de cátedra Sociología de las Organizaciones, 2026. Libro de cátedra. Sociología de las Organizaciones (2025)

6.4. La articulación de los tres procesos en el análisis del caso
Al aplicar estas preguntas diagnósticas, el objetivo no es responderlas en forma aislada sino identificar las interdependencias entre los tres procesos en la organización analizada. Las combinaciones más frecuentes que aparecen en el análisis de organizaciones concretas son:
• Organizaciones que enfrentan procesos de cambio frecuentes pero no generan aprendizaje organizacional a partir de ellos: cada cambio se gestiona como un evento aislado, sin que la experiencia acumulada mejore la capacidad de cambio futura. En estos casos, la gestión del conocimiento es el eslabón ausente.
• Organizaciones con alto conocimiento tácito acumulado pero con procesos de toma de decisiones que no lo incorporan: las decisiones se toman desde la jerarquía formal sin consultar el saber práctico de quienes están más cerca de los procesos. La racionalidad limitada se agrava porque los decisores trabajan con información más pobre de la que la organización posee.
• Organizaciones que presentan resistencia al cambio explicable por sesgos perceptuales y escalamiento del compromiso: los actores clave perciben el cambio como amenaza y persisten en cursos de acción que ya demuestran ser ineficaces. En estos casos, la intervención sobre las percepciones y la generación de información compartida son condiciones previas a cualquier proceso de DO.
Como señala el Libro de Cátedra (2025, p. 216): "Si se aprovecha correctamente el conocimiento interno y todos los trabajadores están alineados en gestionarlo, se desarrolla el aprendizaje organizacional y de esta manera el/la administrador/a posee elementos endógenos para aprovecharlos como una ventaja competitiva para la toma de decisiones." Esta afirmación sintetiza la lógica del eje transversal y orienta el análisis del caso: la organización que gestiona bien sus tres procesos organizacionales construye una capacidad endógena de adaptación que no depende solo de recursos externos.

Conclusión
Comprender cómo se toman las decisiones en una organización es condición necesaria para analizar su comportamiento, porque toda acción organizacional —desde la más rutinaria hasta la más estratégica— es resultado de elecciones previas. Comprender cómo se toman realmente esas decisiones —con información incompleta, bajo el peso de percepciones subjetivas y con una racionalidad inevitablemente limitada— es condición para analizar con rigor el comportamiento de cualquier organización.

El aporte de Simon sigue siendo irreemplazable en este análisis: no porque las organizaciones sean irracionales, sino porque son humanamente racionales. Sus decisores hacen lo mejor que pueden con lo que perciben, lo que saben y el tiempo del que disponen. La tarea del administrador —y del analista organizacional— es diseñar condiciones que amplíen esa racionalidad: mejor información, procesos participativos, criterios explícitos, evaluación sistemática de resultados.
Al aplicar la Matriz de Análisis al caso de su organización, los tres procesos del eje transversal deben leerse de manera articulada: el modo en que la organización cambia, aprende y decide no son fenómenos separados sino expresiones de una misma capacidad adaptativa. Identificar las fortalezas y los cuellos de botella en esa articulación es el objetivo del análisis organizacional que la cátedra propone.

let cur=store.get('cur',0),done=store.get('done',{});
function unitNo(k){const m=secs[k].title.match(/^Unidad ([IVX]+)/);return m?{I:1,II:2,III:3,IV:4,V:5,VI:6,VII:7,VIII:8}[m[1]]:0}
function setMode(m){mode=m;store.set("mode",m);show(cur)}
const toc=document.getElementById('toc'),art=document.getElementById('art');
function drawToc(filter){toc.innerHTML='';secs.forEach((s,k)=>{if(filter&&!s.md.toLowerCase().includes(filter))return;
 const a=document.createElement('a');a.href='#';a.className=k===cur?'on':'';a.innerHTML=`<span>${esc(s.title.replace(/ – .*/,''))}<br><span class="muted">${esc(s.title.split(' – ')[1]||'')}</span></span>${done[k]?'<span class="dot">✓</span>':''}`;
 a.onclick=e=>{e.preventDefault();show(k);document.getElementById('side').classList.remove('open')};toc.appendChild(a)});
 const n=Object.keys(done).length;document.getElementById('prog').textContent=`Estudiadas: ${n} de ${secs.length}`}
function show(k){cur=Math.max(0,Math.min(secs.length-1,k));store.set('cur',cur);const un=unitNo(cur);let html=(un&&FULL[un]&&mode==="full")?"<h2>"+esc(secs[cur].title)+"</h2>"+renderFull(FULL[un]):render(secs[cur].md);if(un&&FULL[un])html=`<div class="row" style="justify-content:flex-start;margin:0 0 16px"><button class="btn ${mode==="res"?"primary":""}" onclick="setMode('res')">Resumen</button><button class="btn ${mode==="full"?"primary":""}" onclick="setMode('full')">Texto completo de la cátedra</button></div>`+html;
 const f=document.getElementById('q').value.trim();if(f.length>2){const re=new RegExp('('+f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');html=html.replace(/>([^<]+)</g,(m,t)=>'>'+t.replace(re,'<mark>$1</mark>')+'<')}
 art.innerHTML=html;document.getElementById('mark').textContent=done[cur]?'✓ Estudiada':'Marcar como estudiada';drawToc(f.toLowerCase());scrollTo(0,0)}
document.getElementById('prev').onclick=()=>show(cur-1);document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('mark').onclick=()=>{done[cur]?delete done[cur]:done[cur]=1;store.set('done',done);show(cur)};
document.getElementById('q').oninput=e=>{const f=e.target.value.trim().toLowerCase();drawToc(f.length>2?f:'');if(f.length>2){const k=secs.findIndex(s=>(s.md+(FULL[unitNo(secs.indexOf(s))]||"")).toLowerCase().includes(f));if(k>=0)show(k)}else show(cur)};
document.getElementById('menuBtn').onclick=()=>document.getElementById('side').classList.toggle('open');
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===b.dataset.v))});
document.getElementById('themeBtn').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=d?'light':'dark';store.set('theme',r.dataset.theme)};
{const t=store.get('theme',null);if(t)document.documentElement.dataset.theme=t}

/* Tarjetas: del glosario */
const roman={I:1,II:2,III:3,IV:4,V:5,VI:6,VII:7,VIII:8};
const gl=(secs.find(s=>s.title.startsWith('Glosario'))||{md:''}).md.split('\n').filter(l=>l.startsWith('|')).slice(2).map(r=>{const c=cells(r);return{t:c[0],d:c[1],u:c[2]}});
const fU=document.getElementById('fUnit');fU.innerHTML='<option value="">Todas las unidades</option>'+Object.keys(roman).map(r=>`<option>${r}</option>`).join('');
let deck=[],fi=0;
function buildDeck(){const u=fU.value;deck=gl.filter(c=>!u||c.u.split(/,\s*/).includes(u));fi=0;drawCard()}
function drawCard(){const c=deck[fi];document.getElementById('fTerm').textContent=c?c.t:'Sin tarjetas';document.getElementById('fDef').textContent=c?c.d+'  (Unidad '+c.u+')':'';document.getElementById('fDef').hidden=true;
 document.getElementById('fCount').textContent=deck.length?`${fi+1} / ${deck.length}`:'';document.getElementById('fBar').style.width=deck.length?((fi+1)/deck.length*100)+'%':'0'}
document.getElementById('flash').onclick=()=>{const d=document.getElementById('fDef');d.hidden=!d.hidden};
document.getElementById('fNext').onclick=()=>{fi=(fi+1)%deck.length;drawCard()};document.getElementById('fPrev').onclick=()=>{fi=(fi-1+deck.length)%deck.length;drawCard()};
document.getElementById('fShuffle').onclick=()=>{deck.sort(()=>Math.random()-.5);fi=0;drawCard()};fU.onchange=buildDeck;buildDeck();
document.addEventListener('keydown',e=>{if(!document.getElementById('vFlash').classList.contains('on'))return;if(e.key==='ArrowRight')document.getElementById('fNext').click();if(e.key==='ArrowLeft')document.getElementById('fPrev').click();if(e.key===' '){e.preventDefault();document.getElementById('flash').click()}});

/* Quiz */
const Q=[
[1,'Según Krieger, toda intervención organizacional debe ser precedida por…',['Un diagnóstico organizacional','Un cambio de estructura','Una encuesta de clima','Un plan de RSE'],0],
[1,'¿Qué nivel del C.O. corresponde a la perspectiva macro?',['Individual','Grupal','Organizacional','Interpersonal'],2],
[1,'Proveedores, clientes y competidores forman parte del entorno…',['Externo general','De tarea','Interno','Cultural'],1],
[2,'Para Schein, la base invisible y más fuerte de la cultura son…',['Los artefactos','Los valores declarados','Las presunciones básicas','Los ritos'],2],
[2,'Una persona que acepta las normas obligatorias y rechaza las periféricas muestra…',['Rebelión abierta','Conformismo','Rebeldía oculta','Individualismo creativo'],3],

[4,'"Es imposible no comunicarse" es un axioma de…',['Robbins','Brandolini','Watzlawick','Entelman'],2],
[4,'El uso de jerga técnica que el receptor no entiende es una barrera…',['Física','Personal','Semántica','Estructural'],2],
[4,'La visión del conflicto que promueve un nivel mínimo para evitar la apatía es la…',['Tradicional','Interaccionista','Clasista','De relaciones humanas'],1],
[4,'En la mediación…',['El tercero impone la solución','Las partes deciden con ayuda de un tercero neutral','El mediador aconseja a una parte','No hay tercero'],1],
[4,'La negociación de suma cero es la…',['Integrativa','Distributiva','Colaborativa','Mediada'],1],
[5,'La etapa de grupo marcada por conflictos y disputa por el liderazgo es…',['Formación','Tormenta','Normalización','Desempeño'],1],
[5,'El poder basado en la admiración y el carisma es el…',['Legítimo','Coercitivo','Experto','Referente'],3],
[5,'Hersey y Blanchard pertenecen al enfoque de liderazgo…',['De rasgos','Conductual','Situacional','Resonante'],2],
[5,'La autoridad es…',['Poder personal','Poder legítimo por la posición','Influencia informal','Lo mismo que liderazgo'],1],
[6,'La fórmula de Lewin B = f(I, E) indica que la conducta depende de…',['Ingresos y empleo','Individuo y entorno','Interés y esfuerzo','Información y estructura'],1],
[6,'El acuerdo no escrito de expectativas mutuas se llama…',['Convenio colectivo','Contrato psicológico','Código de ética','Clima'],1],
[6,'El enfoque CyMAT fue desarrollado por…',['Neffa','Schein','Herzberg','Simon'],0],
[6,'La predisposición innata para aprender habilidades es la…',['Actitud','Competencia','Aptitud','Personalidad'],2],
[7,'Para Herzberg, el salario y las condiciones de trabajo son factores…',['Motivadores','Higiénicos','De crecimiento','De logro'],1],
[7,'La teoría que compara aportes y resultados propios con los de otros es la de…',['Vroom','Adams','Locke','Maslow'],1],
[7,'Regresión, agresión y resignación son síntomas de…',['Satisfacción','Compensación','Frustración','Equilibrio'],2],
[7,'Las teorías de Vroom y Locke son teorías de…',['Contenido','Proceso','Rasgos','Necesidades'],1],
[8,'"Desaprender para luego aprender" describe al cambio según…',['Krieger','Robbins','Gibson','Drucker'],0],
[8,'El conocimiento difícil de formalizar y transmitir es el…',['Explícito','Tácito','Codificado','Documental'],1],
[8,'Según Simon, por la racionalidad limitada el decisor busca una solución…',['Óptima','Satisfactoria','Aleatoria','Programada'],1],
[8,'Persistir en un curso de acción que no funciona se llama…',['Disonancia cognitiva','Escalamiento del compromiso','Percepción selectiva','Holgazanería social'],1],
[8,'La resistencia por temor a lo desconocido es de tipo…',['Lógico','Psicológico','Sociológico','Tecnológico'],1]];
const qz=document.getElementById('quiz');let qs=[],qi=0,score=0;
function startQuiz(u){qs=Q.filter(q=>!u||q[0]==u).sort(()=>Math.random()-.5).slice(0,10);qi=0;score=0;drawQ()}
function drawQ(){if(qi>=qs.length){const best=store.get('best',0);if(score>best)store.set('best',score);
 qz.innerHTML=`<h2>Resultado: ${score} / ${qs.length}</h2><p class="muted">Mejor puntaje: ${Math.max(best,score)}</p><div class="row"><button class="btn primary" id="again">Otra ronda</button></div>`;document.getElementById('again').onclick=()=>qStart();return}
 const q=qs[qi];qz.innerHTML=`<div class="row" style="justify-content:space-between;margin:0"><span class="muted">Unidad ${Object.keys(roman)[q[0]-1]} · Pregunta ${qi+1} de ${qs.length}</span><span class="muted">Aciertos: ${score}</span></div><div class="progress"><div style="width:${qi/qs.length*100}%"></div></div><h3 style="margin:8px 0 12px">${esc(q[1])}</h3>`+q[2].map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')+'<div class="row"><button class="btn primary" id="nx" hidden>Siguiente →</button></div>';
 qz.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(qz.dataset.lock==='1')return;qz.dataset.lock='1';const k=+b.dataset.k;if(k===q[3])score++;else b.classList.add('bad');qz.querySelectorAll('.opt')[q[3]].classList.add('ok');document.getElementById('nx').hidden=false});
 qz.dataset.lock='0';document.getElementById('nx').onclick=()=>{qi++;drawQ()}}
function qStart(){qz.innerHTML=`<h2>Quiz de repaso</h2><p class="muted">10 preguntas al azar. Elegí una unidad o practicá con todas.</p><div class="row"><select id="qU"><option value="">Todas las unidades</option>${Object.keys(roman).map((r,k)=>`<option value="${k+1}">Unidad ${r}</option>`).join('')}</select><button class="btn primary" id="go">Empezar</button></div>`;document.getElementById('go').onclick=()=>startQuiz(document.getElementById('qU').value)}
qStart();
show(cur);
</script>
