Los Indicadores de RSE IARSE/ETHOS5 son una herramienta de aprendizaje y evaluación de la gestión de las empresas que refieren a la incorporación de prácticas de responsabilidad social, al planeamiento estratégico, al monitoreo y desempeño general corporativo. Son un instrumento de autoevaluación y aprendizaje de uso esencialmente interno a la empresa (IARSE/ETHOS, 2010: 7).
A continuación, presentamos una síntesis de los aspectos que tienen en cuenta estos indicadores que “[…] contemplan los aspectos comunes a la gestión de RSE en el contexto latinoamericano” (IARSE/ETHOS, 2010: 7).
1. Valores, transparencia y gobierno corporativo
Este indicador a su vez contempla seis (6) indicadores o sub-indicadores que se agrupan en dos conjuntos: por un lado, el conjunto de autorregulación de la conducta, que contempla el indicador 1 (compromisos éticos), el indicador 2 (arraigo en la cultura organizativa) y el indicador 3 (gobierno corporativo). A su vez, el conjunto de indicadores nucleados bajo el tópico relaciones transparentes con la sociedad contiene al indicador 4 (relaciones con la competencia), al indicador 5 (diálogo e involucramiento de los grupos de interés ―stakeholders―) y al indicador 6 (balance social/ memoria de RSE/ reporte de sostenibilidad)[2].
Estos indicadores están orientados, según surge del manual, a observar la toma de decisiones en las empresas en lo relativo a aquellos principios que pongan de manifiesto la cultura de la organización y orienten el cumplimiento de su misión. Además, contemplan la conducción del desempeño sustentada en valores ayuda también a la empresa a relacionarse de forma ética con sus públicos.
5 Instituto Argentino de Responsabilidad Social Empresaria (IARSE) y ETHOS (2010). Indicadores de Responsabilidad Social Empresaria. Versión 2.0. Córdoba, Argentina.

Informar acerca de sus acciones y rendir cuentas a la sociedad de sus actividades, refuerza los compromisos éticos de la empresa. En este sentido, la transparencia es uno de los pilares de organizaciones que quieren establecer patrones éticos de relacionamiento y promueve la cultura de reporte.
2. Público interno
Este indicador contempla a su vez doce (12) indicadores o sub-indicadores que se agrupan en tres conjuntos. El primer conjunto, denominado diálogo y participación, está constituido por el indicador 7 (relaciones con sindicados u otras asociaciones de empleados) y por el indicador 8 (gestión participativa). El segundo conjunto, denominado respeto al individuo, está constituido por el indicador 9 (compromiso con el futuro de los niños), por el indicador 10 (compromiso con el desarrollo infantil), por el indicador 11 (valoración de la diversidad), por el indicador 12 (compromiso con la no discriminación y promoción de la equidad racial), por el indicador 13 (compromiso con la promoción de la equidad de género) y por el indicador 14 (relaciones con trabajadores tercerizados/ subcontratados). Por último, el tercer conjunto, relativo al trabajo decente, contempla el indicador 15 (política de remuneración, prestaciones y carrera), el indicador 16 (cuidados de salud, seguridad y condiciones de trabajo), el indicador 17 (compromiso con el desarrollo profesional y empleabilidad), el indicador 18 (conducta frente a despidos) y el indicador 19 (preparación para jubilación).
El grupo de indicadores nucleados en torno al tópico de público interno tiene en cuenta, entre otras cosas, cómo la empresa dialoga con los sindicatos o, por ejemplo, si proporciona información sobre las condiciones de trabajo, objetivos que afecten al personal, si hay libertad para el ejercicio de la representación sindical, entre otras cuestiones, etcétera.
Otro aspecto relevante que releva es de qué manera la empresa se relaciona con sus trabajadores y de qué modo se compromete con el futuro de sus hijos, si promueve su inclusión, movilidad social y laboral y valora la diversidad.
En cuanto a las remuneraciones, beneficios y carrera, el indicador testea si la empresa refuerza el compromiso con sus colaboradores y planifica junto con ellos las políticas de remuneración y de mejoras de formación que le permitan alentar el ascenso laboral y social, así como el desarrollo en acciones de voluntariado que repercutan en el autoestima y sensación de utilidad y realización de los miembros.

3. Medio ambiente
En esta sección el instrumento coordina dos sub-indicadores denominados responsabilidad frente a las generaciones futuras (el primero) y gerenciamiento del impacto ambiental (el segundo). El primero contiene a su vez a los indicadores específicos de compromiso con la mejora de calidad ambiental (indicador 20) y educación y concientización ambiental (indicador 21). El segundo, por su parte, contiene al indicador 22 (gerenciamiento de los impactos sobre el medio ambiente y del ciclo de vida de productos y servicios), al indicador 23 (sustentabilidad de la economía forestal) y al indicador 24 (minimización de entradas y salidas de insumos). Resumidamente, este indicador se interesa por evaluar si la empresa tiene un verdadero compromiso con el medio ambiente y, básicamente, identificar cuál es la actualidad de aspectos como los de:
—  Educación y creación de conciencia ambiental, hacia el público interno y externo. —  Gerencia del impacto sobre medio ambiente y del ciclo de vida de productos y servicios. —  La manera como la empresa planifica la utilización de recursos y controla la generación y destino de residuos.
4. Proveedores
En lo relativo a este indicador, el instrumento contempla un solo tópico o eje interesado especialmente por la selección, evaluación y alianza con proveedores. Así, articula el indicador 25 (criterios de selección y evaluación de proveedores), el indicador 26 (trabajo infantil en la cadena productiva), el indicador 27 (trabajo forzado en la cadena productiva) y el indicador 28 (apoyo al desarrollo de proveedores).
Como es fácil inferir, este indicador se ocupa de la relación que la empresa establece con sus proveedores para, a partir de dicho relevamiento, identificar si en dicha relación puede reflejarse el compromiso que tienen los empresarios con los principios de responsabilidad social. Los aspectos destacados podrían ser los siguientes:
—  Rechazo de trabajo infantil en la cadena productiva. —  Inadmisibiliidad de existencia de trabajo forzado o análogo al esclavo en la cadena productiva. —  Apoyo al desarrollo de los proveedores, con especial énfasis en aquellos que poseen carácter local.

5. Consumidores y clientes
Este apartado se ocupa del eje o tópico relacionado a la dimensión social del consumo. Contempla sub-indicadores como el de política de comunicación comercial (indicador 29), el de excelencia de la atención (indicador 30), o bien el de conocimiento y gerenciamiento de los daños potenciales de los productos y servicios (indicador 31).
Se contempla en el campo de observación de este indicador el hecho de que el marketing y la comunicación de la empresa suele quedar vinculada, si existe tal, a la preocupación por la responsabilidad social. La búsqueda de coherencia en lo que respecta a acciones en este sentido sería señal que la empresa desea crear valores para la sociedad y comunicarlos, afirmando una imagen de credibilidad y confianza.
En este sentido, se analiza si la política formal de comunicación está o no alineada con ciertos valores y principios; si se estimula o no la comunicación con clientes y consumidores y se pretende esclarecer los aspectos innovadores de sus productos y servicios ―así como los cuidados necesarios para su uso―, o si se fomenta la cultura de responsabilidad social y la transparencia en la comunicación con consumidores y clientes. También se observa la prevalencia, en el caso de que existan, de estos mismos valores en la publicidad, en la información y en las advertencias que son exigidas legalmente.
6. Comunidad
Este indicador está constituido por dos grupos de indicadores: el de relaciones con la comunidad local y el de acción social. El primero, a su vez, contempla dos indicadores, uno sobre gerenciamiento del impacto de la empresa en la comunidad de entorno (indicador 32) y otro sobre relaciones con organizaciones locales (indicador 33). Por su parte, el segundo grupo contempla los indicadores sobre financiamiento de la acción social (indicador 34) e involucramiento con la acción social (indicador 35).
En efecto, este indicador está orientado a identificar si la empresa relevada socializa el impacto producido por sus actividades, es decir, si la empresa tiene conocimiento de los impactos que genera y, en consecuencia, si intenta minimizarlos o posee, incluso, un proceso estructurado para registrar quejas y reclamos.
Asimismo, el instrumento intenta identificar si la empresa tiene definida una postura acerca de la promoción de reuniones sistemáticas para informar a los liderazgos locales acerca de las providencias que ha tomado, o bien para informar acerca del financiamiento para acción social, el trabajo social voluntario de los empleados, cuáles son las acciones tomadas para minimizar los impactos negativos o, en alguna medida, compensarlos.
7. Gobierno y sociedad
Este indicador está constituido por dos sub-indicadores que se ocupan de observar la transparencia política, por un lado, y el liderazgo social, por otro. El primero contempla las contribuciones para campañas políticas (indicador 36), la construcción de la ciudadanía por las empresas (indicador 37) y las prácticas anticorrupción y anticoima (indicador 38). A su vez, el segundo sub-indicador contempla el liderazgo social (indicador 39) y la participación en proyectos sociales gubernamentales (indicador 40). En suma, a través de este apartado específico se observa si la empresa analizada tiene en cuenta ciertos principios coincidentes con los principios de la Responsabilidad Social Empresaria, entre los cuales podemos destacar
—  Prácticas anticorrupción y soborno. —  Liderazgo e influencia social. —  Participación en proyectos sociales gubernamentales y no gubernamentales.
8. Conclusión Una de las advertencias que surgen luego de realizar un recorrido por la bibliografía referida a la Responsabilidad Social Empresaria es el gran desarrollo teórico que existe sobre dicho constructo, lo que motiva discusiones de base ética que se ocupan de discutir lo moral instituido (legal o pragmáticamente)
Hay diferentes organismos (normalmente estatales, aunque también privados) que regulan y proponen distintas variables y dimensiones para determinar cuándo una Empresa es responsable socialmente y cuándo no lo es. A su vez, existen conceptos, indicadores y valores instalados y consensuados por los diferentes organismos que estudian la Responsabilidad Social Empresaria. Sin embargo, los mismos se ofrecen como parámetros de referencia para realizar tal o cual interpretación, no como parámetros excluyentes o prescriptivos.

La Responsabilidad Social Empresaria es una propuesta que invita, no que obliga, a los directivos a dar un paso más en su rol social. Esta diferencia es importante.
La Responsabilidad Social Empresaria, finalmente, deja ver una creciente participación en las organizaciones. Podemos entender que esto es ciertamente saludable para la comunidad, sobre todo por las consecuencias inmediatas que genera. En esta relación organización-sociedad, la responsabilidad no es, claramente, una cuestión dada. La relación organización-sociedad implica la búsqueda de nuevas posibilidades, dinámicas diferentes, que busquen mayor libertad e igualdad, independientemente de cuáles puedan ser los resultados. La Responsabilidad Social Empresaria es una alternativa para re-pensar estrategias y dinámicas institucionalizadas, sobre todo para quienes tengan la voluntad de hacerlo. En resumen, la ética pública y la privada no difieren en su esencia, ya que ambas se basan en principios y valores que guían el comportamiento humano. Sin embargo, su aplicación varía según el contexto. La ética empresarial se enfoca en la aplicación de principios éticos en el ámbito de los intercambios económicos, buscando la felicidad y el bienestar como fin último. En el ámbito público, la ética se centra en la correcta gestión de los recursos y bienes aportados por los ciudadanos, asegurando su uso adecuado para el cumplimiento de los bienes sociales. Las decisiones, tanto en el ámbito privado como en el público, están guiadas por valores como la justicia, la equidad, la honestidad, la responsabilidad y el respeto. Estos valores deben reflejarse en la conducta de los líderes y en las prácticas organizacionales. En el caso de la ética empresarial, los valores éticos se trasladan desde los individuos a la empresa y luego a la sociedad. Los conflictos éticos pueden surgir cuando las convicciones personales de los empleados chocan con las decisiones empresariales, poniendo a prueba la solidez moral de la organización. La ética no solo es importante en la resolución de dilemas éticos, sino también en la prevención de comportamientos viciosos y en la evaluación de las consecuencias de las decisiones. En el ámbito estatal, la ética se regula mediante normativas específicas que establecen las conductas esperadas de los funcionarios y empleados públicos, justificadas por la necesidad de resguardar el uso y manejo de los fondos públicos.

SOCIOLOGÍA DE LAS ORGANIZACIONES
UNIDAD VI
COMUNICACIÓN, CONFLICTO Y NEGOCIACIÓN EN LAS ORGANIZACIONES
Lic. Valdés, Mariana y Lic. Adriana Chávez
1- Comunicación: Concepto. Tipos de comunicación: Organizacional e institucional. Influencia de la percepción en el proceso de comunicación. Axiomas de la comunicación humana. 2- Diagnóstico e intervención para la mejora de la comunicación en las organizaciones. 3- Conflicto. Concepto. Conflicto organizacional. Análisis del conflicto. Técnicas de resolución del conflicto. 4- Negociación. Concepto. Etapas de la negociación. Estrategias de negociación.
INTRODUCCIÓN
La comunicación se encuentra en la naturaleza del hombre. Las personas, como seres sociales, van desarrollando a lo largo de su vida la capacidad de expresar hechos, intenciones, sentimientos, emociones a través del lenguaje verbal y no verbal. Para Chiavenato (2017) las personas necesitan relacionarse continuamente con otras o con sus entornos por medio de la comunicación, ya que no son entes autosuficientes ni pueden sobrevivir aislados.
Ninguna organización puede existir sin comunicación; todo acto de comunicación influye de alguna manera en ella. La comunicación ayuda a alcanzar todas las funciones básicas de la administración: planeación, organización, dirección y control, de modo que las organizaciones logren sus metas y superen sus desafíos

Considerando que los individuos, al incorporarse a una organización, llevan consigo todo el bagaje de conocimientos, habilidades y actitudes que influyen en alguna medida en el desarrollo de sus actividades, es decir, en las relaciones formales e informales que establezca con otras personas en el entorno laboral. Se entiende que cualquier organización para funcionar requiere de personas que puedan desarrollar la capacidad de comunicarse eficazmente.
CONCEPTO Y SU EVOLUCIÓN:
Desde el punto de vista etimológico, comunicación proviene del latín communicatio, hacer común. La Real Academia Española (2020) hace referencia a “transmisión de señales mediante un código común al emisor y al receptor”. Pero el concepto va más allá de la simple transmisión, ya que entre sólo enviar y hacer común o compartir significado existe una diferencia que determina la comunicación eficaz, distinguiéndola del mero intercambio de datos.
Chiavenato (2017:192) la entiende como “proceso mediante el cual dos o más personas intercambian, comprenden y comparten información, por lo general con el objetivo de influir en el comportamiento de otras personas”.
Para Newstrom (2011:48) “la comunicación es la transferencia de información y el entendimiento de una persona con otra”. Cuando es eficaz, es un puente de significado entre los hombres que les permite compartir lo que sienten y conocen. La comunicación es lo que el receptor entiende, no lo que el emisor dice.
Entonces, los términos claves de la comunicación serían transferencia y comprensión del significado. (Robbins (2017), Chiavenato (2017) y Davis (1996) y Gibson, Ivancevich y Donnelly (2011))
La comunicación es una competencia clave de los hombres, independientemente de la tarea que desempeñe. Hellriegle, Jackson y Scolum (2002:7) entienden al manejo de la comunicación como “la habilidad global de usar todos los modos de transmisión, entendimiento y recepción de ideas, pensamientos y sentimientos, la comunicación verbal, no verbal, escrita, electrónica, y así sucesivamente, para transferir e intercambiar correctamente información y emociones”
La transmisión de significado puede realizarse a través de dos métodos, la comunicación verbal y no verbal. Entendemos a la comunicación verbal como aquella que se transmite por medios orales y escritos.
Según Pearce (1994) El medio oral es la forma de comunicación primaria de nuestra especie, la comunicación cara a cara sigue siendo hasta nuestros días la mejor forma de comunicarnos de forma rápida y con la ventaja de obtener retroalimentación instantánea.
Los medios escritos se desarrollaron posteriormente con la invención del alfabeto, la escritura y la imprenta, creaciones que lograron registrar el habla y gracias a los cuales se originó un medio de registro tangible y verificable de conservación de la información, que aún sigue evolucionando con los desarrollos tecnológicos. Robbins (2017) señala que las personas son más cuidadosas con la palabra escrita que con la hablada, ya que es habitual planificar lo que se quiere expresar en un mensaje escrito antes que en los mensajes orales.
En lo que respecta a los medios no verbales, las personas no pueden abstenerse de comportarse en forma no verbal, Robbins (2017) señala que los movimientos corporales tienen significado, ninguno es accidental, “nos apoyamos fundamentalmente sobre medios no verbales como la postura, el gesto, la expresión facial, la entonación vocal y el contexto para la comunicación” (Bateson, 1998:145).
La comunicación no verbal es el sistema más antiguo de comunicación humana, conocido también como acción o paralenguaje. No ha caído en desuso aún con el desarrollo de los nuevos medios. En cambio, se ha tornado rico y complejo, y ha florecido paralelamente a la evolución del lenguaje real.
De manera integradora podríamos decir, entonces, que la comunicación se presenta como un fenómeno social complejo que constituye al ser humano y es parte de su vida cotidiana; es de carácter procesual, dado que constantemente interactúan dos o más personas en un determinado contexto (que influye o en el cual se influye), a través de signos cuyo significado ambos comparten ya sea total o parcialmente y a través de algún canal o medio específico, que puede ser expreso o tácito, cuando se configura a través de las acciones.
MODELOS DEL PROCESO DE COMUNICACIÓN
Existen diferentes modelos que buscan explicar el proceso de comunicación. Los tradicionales representa a la comunicación como un proceso lineal simple, donde la fuente de información es el comienzo del proceso, y ésta selecciona qué mensaje (contenido) será transmitido. El transmisor codifica el mensaje en una señal a ser enviada a través de un canal, medio por el que circula el mensaje al receptor. El receptor recibe la señal y la decodifica, vuelve a convertirla en el mensaje con un destino determinado.
Posteriormente, se ha incorporado la idea de retroalimentación, haciendo referencia al proceso que permite verifica si el mensaje ha sido recibido correctamente (reconociendo que el receptor reacciona ante la recepción del mensaje) y del contexto donde se produce la transmisión.
Si bien, la teoría matemática de la comunicación ha sido empleada en diversos ámbitos de la ciencia, algunos autores consideran que el modelo resultaría inapropiado para explicar la comunicación humana. Por ello, en la década de los 80, una nueva corriente ha elaborado un modelo de comunicación propio para las Ciencias Humanas donde “comunicar” significa construir un sentido en la interacción. Se pasó de modelos simples dualísticos a modelos de sistemas relativistas.
Mata (1990) señala que la construcción de sentido entre emisor y receptor, no se puede reflejar con un modelo determinista. Sino que se deben consideran a las prácticas comunicativas como espacios de interacción entre sujetos en los que se verifican procesos de producción de sentido. El código no es un instrumento neutro, en muchas ocasiones emisores y receptores no comparten el significado de los códigos utilizados, sino que construyen sentido en la interacción.

Por tanto, asumiendo que un discurso es toda configuración temporo- espacial de sentido, una de las proposiciones claves de la teoría del discurso es, sin duda, el carácter no lineal de la circulación de sentido. Esto quiere decir que un discurso producido por un emisor determinado, no produce jamás un efecto y uno solo.
Salinas (2004), siguiendo los postulados de esta corriente, comenta que la comunicación se trata de un proceso social constante y circular, donde la noción de transmisión de información se ve superada por la de participación. Esta corriente incorpora la noción de proceso social permanente que integra múltiples modos de comportamiento.
La conducta de una persona afecta la de otras y es, a su vez, afectada por éstas. Entonces, la comunicación de la persona A tiene efectos sobre la persona B, y todo lo que hace B influye sobre la siguiente acción de A, de la misma forma ambos sufren la influencia del contexto en que dicha interacción tiene lugar y, a su vez, influyen sobre él. Watzlawick (1985:32) llamará a este intercambio constante de los sistemas interpersonales como “circuitos de retroalimentación”.
Por otra parte Salinas (2004:60) con una mirada interdisciplinaria argumenta “toda interacción cara a cara entre dos o más personas en una misma unidad espacio-temporal donde todo comportamiento es considerado a la vez como causa-efecto en una suerte de interdependencia de la que no pueden escapar los interactuantes.”
La cuestión relevante aquí es comprender que la comunicación humana es compleja debido a que cada persona tiene su “propia pauta personal de referencia para interpretar las cosas” (Chiavenato, 2017:198).
En el enfoque de la asignatura, concebimos a la comunicación en las organizaciones como una producción de sentido desde un enfoque sistémico, ya que, dada la complejidad de la comunicación ésta debe ser entendida como un sistema abierto, para liberarla de la constricción a la que estaba sometida, y complejo, donde hay que mirar la totalidad del proceso comunicacional para explicar la interacción. Tratar de comprender los sistemas comunicacionales y su entorno.
A continuación, se presenta un cuadro resumen de los principales modelos de comunicación.

Modelo

Idea central

Modelo conductista

Hace un perfil de las relaciones y mediaciones que se dan en la comunicación colectiva. Enfoque lineal, visión positivista. El modelo adquiere la siguiente forma: Estímulo – Respuesta, donde el medio es lo relevante.

Modelo matemático informacional

Sistema cerrado. Enfoque lineal e informacional. Comunicación: proceso de transmisión de significados que se realiza desde un emisor a un receptor utilizando un canal.

Modelo funcionalista

Aporta una dimensión comunicativa al modelo matemático al incorporar el contexto en que se produce la transmisión, diferenciar las funciones que puede cumplir el lenguaje y la influencia de grupos de pertenencia.

Comunicación como producción de sentido

Prácticas comunicativas como espacios de interacción entre sujetos en los que se verifican procesos de producción de sentido.

El código no es considerado un instrumento neutro.

El sentido no circula linealmente entre emisor y receptor sino que determina un campo de efectos posibles

Modelo sistémico

La comunicación puede ser entendida como un sistema abierto, para liberarla de la constricción a la que estaba sometida.

Sistema complejo de comunicación, hay que mirar la totalidad del proceso comunicacional para explicar la interacción.

Se enfoca en las interrelaciones dentro del sistema y entre subsistemas como entre el sistema comunicacional y su entorno.

Teoría de la comunicación humana (Watzlawick, 1985)

Fuente: Adaptado de Mata (1990)

AXIOMAS DE LA COMUNICACIÓN HUMANA.
La Teoría de la Comunicación humana, como alternativa al modelo lineal de la teoría matemática, es un modelo sistémico construido por los miembros de la Escuela de Palo Alto donde “comunicar” significa construir un sentido en la interacción.
Esta corriente incorpora la noción de proceso social permanente que integra múltiples modos de comportamiento. Estudiando la comunicación humana desde tres perspectivas: sintáctica, semántica y pragmática. A los fines de esta propuesta, se entiende a la sintáctica como el estudio de los canales, ruido, capacidad, redundancia y otras propiedades del lenguaje sin considerar el significado de lo que se transmite. El campo de significados le corresponde a la semántica, mientras que la influencia de la comunicación en la conducta es ámbito de estudio de la pragmática. Los tres campos se presentan en la realidad en forma conjunta y tienen la característica de ser interdependientes.
En particular se desarrolla el área de la pragmática, donde los efectos de la comunicación sobre la conducta tienen lugar, específicamente se ocupa de la relación emisor-receptor que se establece a través del proceso de comunicación.

Buscando explicar la comunicación humana, Watzlawick (1985:49-70) presenta cinco axiomas exploratorios a considerar en el estudio de las comunicaciones humanas.
1. No es posible no comunicarse.
Watzlawick define al mensaje como “cualquier unidad comunicacional singular” (1985:49) y especifica que una serie de mensajes intercambiados entre personas se denomina interacción. Asimismo aclara que, una vez que se acepta que toda conducta es comunicación, ya no se maneja una unidad-mensaje monofónica sino que es un conjunto fluido y multifacético de muchos modos de conducta, entre ellos verbal, tonal, postural, contextual, etc.
“Si se acepta que toda conducta en una situación de interacción tiene un valor de mensaje, se deduce que por mucho que uno lo intente, no puede dejar de comunicar. Actividad o inactividad, palabra o silencio, tienen siempre valor de mensaje: influyen sobre los demás, quienes a su vez, no pueden dejar de responder a tales comunicaciones y, por ende, también comunican”. (pp.50)
2. Toda comunicación tiene un aspecto de contenido y un aspecto relacional.
Una comunicación no sólo transmite información, sino que al mismo tiempo impone conductas. Bateson (1951) los llama aspectos “referenciales” y “conativos”. El aspecto referencial de un mensaje transmite información, y en comunicación humana se lo conoce como contenido del mensaje. Este puede referirse a cualquier cosa comunicable, independientemente de que sea verdadera o falsa, válida, no válida o indeterminable. Por otra parte el aspecto conativo se refiere a cómo debe entenderse el mensaje, lo que determina a la vez la relación entre los comunicantes.
3. La naturaleza de una relación depende de la puntuación de las secuencias de comunicación entre los comunicantes.
La interacción, como intercambio de mensajes entre comunicantes, es la característica básica que se examina en este axioma. En una secuencia de intercambios se pueden clasificar las conductas como secuencia “estímulo-respuesta-refuerzo”. Bateson y Jackson denominan “puntuación de la secuencia de hechos”, al modo como los participantes organizan la secuencia, es decir, establecen entre ellos patrones de intercambio, los que constituyen reglas de contingencia con respecto al intercambio de refuerzos.
4. Los seres humanos se comunican tanto digital como analógicamente.
El hombre es el único organismo que utiliza ambos modos de comunicación, expresa el lenguaje digital a través de las palabras y representa el lenguaje analógico a través de la comunicación no verbal, entendido en su término amplio donde se incluyen postura, gestos, expresión facial, inflexión de la voz, secuencia, ritmo, cadencia de las palabras y cualquier otra manifestación no verbal de que el organismo sea capaz, así como los indicadores en el contexto.
5. Todos los intercambios comunicacionales son simétricos o complementarios.
Las relaciones entre los individuos presentan patrones de relaciones que, de tanto en tanto manifiestan tendencias al cambio progresivo. La interacción puede ser simétrica o complementaria según esté basada en la igualdad o en la diferencia. En el caso de interacción simétrica, los participantes tienden a igualar especialmente su conducta recíproca, llevando al mínimo las diferencias. Sean debilidad o fuerza, bondad o maldad, la igualdad se mantiene. Por otro lado, en la interacción complementaria la conducta de uno de los participantes complementa la del otro, se tratan de posiciones distintas, una superior o primaria y otra inferior o secundaria con carácter de mutuo encaje, donde ambas conductas, disímiles pero interrelacionadas, tienden cada una a favorecer a la otra. No se trata de una relación impuesta, sino que cada uno se comporta de la manera que presupone será la conducta del otro.
INFLUENCIA DE LA PERCEPCIÓN EN EL PROCESO DE COMUNICACIÓN.
Como señala Krieger “La percepción también es capaz de generar acciones y conductas positivas o negativas, según la interpretación subjetiva que se haga de lo percibido” (2010:234)

Se trata de un filtro conformado por su sistema cognitivo, percepciones, personalidad, valores y motivos personales que actúan como condicionante de cualquier información recibida o emitida.
Chiavenato (2017) señala que existe una relación fuerte entre cognición, percepción y motivación. Lo que dos personas se comunican está determinado por su percepción de sí mismas y del otro. La idea de comunicación está relacionada con las percepciones y motivaciones del emisor y del receptor, dentro del contexto de cada situación.
Cuando hablamos de la influencia de la percepción en el proceso de comunicación, hacemos referencia a cómo el proceso psicológico de la persona actúa como un filtro que condiciona el procesamiento de la información. Pueden presentarse múltiples interferencias que limitan la comprensión.
Por ejemplo, cuando la persona se siente amenazada ante la posibilidad de perder una discusión tiende a abandonar la lógica y la racionalidad y seguir una conducta de razonamiento defensivo. O cuando la gente recibe información incompatible con sus sistemas de valores, decisiones previas u otra información que tenga puede manifestar un conflicto interno conocido como disonancia cognitiva. Asimismo, cuando se bloquea información que no es deseada o considerada relevante se habla de percepción selectiva.
Al entenderse la comunicación como interacción, todas las personas están en condiciones de emitir mensajes (no es posible no comunicarse) y de decodificarlos. Los problemas pueden presentarse al codificar o decodificar, o ser ajenos a los interlocutores y manifestarse en el ambiente donde se produce la interacción. De acuerdo con esta posibilidad, Donelly (1996) clasifica las barreras en: creadas por el emisor, creadas por el receptor, o creadas por ambos.
Otros autores como Chiavenato (2017), Robbins (2017) o Newstrom (2011) clasifican las interferencias como personales, físicas o semánticas.
Personales: surgen de las emociones humanas, valores y malos hábitos de escucha. Nuestras emociones actúan como filtros perceptivos en todas nuestras comunicaciones. Vemos y escuchamos lo que estamos emocionalmente sintonizados para ver y escuchar, así que la comunicación está guiada por nuestras expectativas. (Newstrom, 2011: 54). Pueden manifestarse como muletillas, acciones físicas, distancia psicológica, etc.
Físicas: interferencias en el ambiente donde acontece la comunicación. Por ejemplo: ruidos, distancias (proxémica), paredes, etc.
Semánticas: surgen de limitaciones en la interpretación de los símbolos con los que nos comunicamos (palabras, imágenes, acciones - comunicación no verbal, lenguaje corporal), en general hacemos inferencias en base a nuestros supuestos. Por ejemplo: idioma, lenguaje, jerga, gestos no verbales, etc.
LA COMUNICACIÓN COMO ELEMENTO DE RESOLUCIÓN DE CONFLICTO.
La comunicación es un proceso de interacción social donde nos afectamos e influimos mutuamente. Es una acción que busca influir en las visiones, opiniones, fundamentos y comportamientos de los otros apelando al lenguaje como canal de interrelación. (Franklin & Krieger, 2010:230). Es una herramienta básica y necesaria para entender a los otros. Sin embargo, cuando es ineficaz constituye una de las principales causas de conflicto.
En este sentido la comunicación constituye en muchos casos la fuente y la resolución de los conflictos. Ya que, aunque el proceso psicológico de la persona actúe como un filtro que condiciona el procesamiento de la información es posible trabajar para mejorar la forma de comunicarnos. La comunicación eficaz es el resultado del entendimiento común entre el comunicador y el receptor.

El enfoque de la asignatura es considerar a la comunicación institucional, como la encargada de los distintos aspectos comunicacionales con los diferentes públicos (externos) con los que se relaciona la institución. Y la comunicación organizacional (o interna) como aquella que comprende todos los actos comunicativos que se dan dentro de la organización. En este sentido, Krieger (2012:237) desde la definición de organización reconoce lo vital de la comunicación, cuando dice es una “colectividad social, que se produce, reproduce y transforma por medio, entre otras, de las prácticas de comunicación habituales, interdependientes y deliberadas de sus miembros, pues las organizaciones solo existen en la medida en que sus miembros las crean por medio del discurso”. Y Chiavenato (2009) considera puntualmente a la comunicación organizacional como “ el proceso mediante el cual las personas intercambian información en una organización. Algunas comunicaciones fluyen por la estructura formal y la informal; otras bajan o suben a lo largo de niveles jerárquicos, mientras algunas se mueven en dirección lateral u horizontal” (p. 321). Según Chiavenato (2017: 193) la comunicación es un elemento clave para la administración, ya que los gestores no trabajan con cosas sino con información acerca de ellas. Todas las funciones administrativas sólo pueden funcionar mediante la comunicación, es básica en el funcionamiento de la organización.
En el mismo sentido, Brandolini (2008: 21) señala que la comunicación es lo que mantiene viva a la organización y en constante creación. En una empresa todo comunica. De esta manera, la comunicación interna asume uno de los roles más importantes dentro de la gestión empresarial y es el de generar confianza entre todos los empleados hacia el proyecto de trabajo que se realiza dentro de la organización y reproducir su cultura.

Según Brandolini (2008: 9) “La clave es que la comunicación interna contempla, en primera instancia, al público interno (líneas operativas, mandos medios, gerentes y directores) como primer público destinatario para luego extenderse fuera del entorno de la compañía. De esta manera, el desarrollo de la comunicación interna unifica significados, proporciona claridad y sentido al trabajo, genera pertenencia y prepara a cada empleado como “vocero” de la organización a la que pertenece.”

La comunicación organizacional, así como la interpersonal, no es perfecta sino que se transforma a lo largo del proceso, lo que conlleva a que el destinatario reciba un mensaje diferente al enviado originalmente. Por ello una buena comunicación interna es un punto estratégico en la vida de las organizaciones. Y hacerlo eficazmente se traduce en mayor productividad y armonía dentro del ámbito laboral (Brandolini, 2008)
Funciones de la comunicación
Scott y Mitchell (1976, en Robbins, 2004: 284) definen cuatro funciones principales de la comunicación en un grupo de personas u organización: control, motivación, expresión emocional e información.
La comunicación sirve para controlar la conducta de los miembros. Asimismo, fomenta la motivación al explicar a los empleados lo que hay que hacer, qué tan bien lo están haciendo y qué puede hacerse para mejorar el desempeño. La comunicación que tiene lugar dentro del grupo proporciona un puente para la expresión emocional de sentimientos y de satisfacción de necesidades sociales. También al transmitir información, facilita la toma de decisiones de individuos o grupos.
Dirección de la comunicación formal
Según Chiavenato (2017:204) y Robbins (2004: 285),la comunicación formal fluye dentro de la cadena de mando o responsabilidad definida por la organización a través de los canales que la misma determine. Según Brandolini (2008: 36) “es planificada, sistemática y delineada por la organización. Por lo general, utiliza la escritura como medio de expresión y canales oficialmente instituidos. Suele ser más lenta que la informal ya que requiere del cumplimiento de las normas y tiempos institucionales”. Pueden ser descendentes, ascendentes u horizontales.
Comunicación descendente: mensajes enviados de la directiva a los subordinados, la información fluye hacia abajo en la estructura jerárquica de la organización con el objetivo de crear empatía y un clima de trabajo unificado, generalmente tratan sobre asuntos como definición de objetivos y estrategias, instrucciones para el trabajo, prácticas y procedimientos, retroalimentación sobre el desempeño, adoctrinamiento, entre otros. Los canales a través de los que se transmite pueden ser cara a cara, en reuniones, memorándums, llamadas telefónicas, videos, manuales, intranets corporativas, whatsapp, etc. El contenido de esta comunicación es toda aquella información que ayude a las personas a comprender mejor su función y la de los demás, que incremente el sentido de solidaridad con la empresa, y que refuerce la motivación y autoestima de los trabajadores.
Comunicación ascendente: mensajes desde los niveles más bajos a los más altos, discurre hacia arriba en la estructura jerárquica organizacional, sobre asuntos como problemas y excepciones, opiniones, sugerencias para mejorar, informes de desempeño, información contable y financiera, entre otros. Sería la retroalimentación de la comunicación descendente. La comunicación ascendente suele ser menos común que la descendente, y se descuida más. El alcance y la eficacia de este tipo de comunicación dependen en gran medida de la cultura de la organización.
Comunicación horizontal: intercambio lateral o diagonal de mensajes entre colegas o compañeros con el objetivo de informar o solicitar actividades de apoyo o colaboración. Es la comunicación entre grupos de trabajo o personas que están en el mismo nivel jerárquico; es menos formal, y se difunde con amplitud y rapidez en tiempos de crisis.
Según Gibson et al. (2011: 456) las personas se comunican con mayor sinceridad y libertad con sus iguales que con sus superiores, en consecuencia la comunicación horizontal es más intensa que la vertical. Además, es esencial para la coordinación y la integración de las numerosas funciones organizacionales.
Canales informales de comunicación
Según Chiavenato (2017, 200) los canales informales de comunicación surgen de forma espontánea entre las personas, independientemente de los canales formales y las jerarquías. La comunicación informal puede conectar a cualquier persona dentro de la organización y coexiste con la comunicación formal. Según Brandolini (2008) este tipo de comunicación utiliza canales no oficiales (conversaciones entre compañeros de trabajo, encuentros en los pasillos, baño, cafetería, ascensor, entre otros) y tiene la ventaja de divulgarse de manera más veloz que la formal. Aunque puede generar malentendidos y resultar una usina de rumores.
La creación de canales informales de comunicación organizacional como por ejemplo encuentros de café, puede crear las condiciones para intercambiar mensajes con más cercanía, pero aún ser canales oficiales que la organización utiliza para transmitir la información.

Brandolini (2008: 39) presenta un proceso cíclico para un buen desarrollo de las comunicaciones internas, identificando cinco instancias: el pre-diagnóstico, el diagnóstico, la planificación, la ejecución del plan y su seguimiento. Nos centraremos en las dos primeras etapas.
La instancia de pre-diagnóstico sería como un primer acercamiento a la empresa, a través del referente o contacto, para relevar la siguiente información relativa a:
- Origen de la empresa y sector industrial. - Misión, Visión y Valores - Servicio o producto que comercializa. - Clientes y potenciales clientes. - Competencia. Posicionamiento de mercado. - Estructura organizacional - Cantidad de empleados y distribución geográfica (plantas, fábricas, oficinas, etc.). - Características demográficas del personal y sus perfiles profesionales. - Responsable/s de comunicación interna - Sistema de comunicación interna ¿Cuán desarrollado está? ¿Cómo funciona? - Qué canales están activos y a qué públicos apuntan. ¿Quiénes tienen acceso a ellos? - Qué acciones de comunicación han implementado y qué resultados obtuvieron. - Dónde detectan necesidades de apoyo en comunicaciones. - ¿Han recibido capacitación en comunicaciones? - ¿Es una competencia importante para la empresa la comunicación? - Qué acciones de comunicación han implementado y qué resultados obtuvieron. - Si desarrollan habitualmente una encuesta de clima. - Si la empresa ha sido adquirida, se ha fusionado o reestructurado personal recientemente. - ¿Qué tipo de actividades recreativas se realizan desde la organización?
(Competencias deportivas, concursos de fotografía, etc.). - Si tienen conflictos sindicales regularmente, ¿cuántos convenios sindicales tiene firmados, qué porcentaje del personal está sindicalizado?

En la etapa de Diagnóstico se identifican las necesidades insatisfechas del público interno, así como las fortalezas y debilidades de la organización en su gestión de la comunicación. Para Brandolini (2008: 45) El diagnóstico ofrece una mirada general de la situación de comunicación en un momento dado. Es una especie de recorte temporal en el que se mide y evalúa a través de diferentes herramientas, que pueden ser cualitativas o cuantitativas (o ambas) en qué punto está parada la compañía en relación a su comunicación interna. El autor señala que según la profundidad del diagnóstico que se desea realizar existen diferentes herramientas, como se presenta en la siguiente Tabla.

3- Conflicto. Concepto. Conflicto organizacional. Análisis del conflicto. Técnicas de resolución del conflicto. Concepto de conflicto

Para Entelman (2002) el conflicto es una relación social (de desacuerdo). Esta relación será de conflicto cuando sus objetivos sean incompatibles o también cuando algunos de los miembros lo perciban como tal.
Es importante destacar, y siguiendo al autor Entelman (2002), que el conflicto y la confrontación que esta relación de desacuerdo genera, se da en un ámbito que las acciones sean permitidas, es decir, tengan libertad para accionar de determinada manera ya que no son cuestiones prohibidas ( ej. Por ley). De otro modo, si serían zonas no permitidas, estarían sancionadas por algún ordenamiento (justicia, o por el orden policial)
A continuación se expone una tabla con los diferentes conceptos:

AUTOR

CONCEPTO

Chiavenato (2009)

Se presenta cuando una de las partes (sea un individuo o un grupo) trata de alcanzar sus objetivos, que están ligados con los de la otra parte, e interfiere con los esfuerzos de ésta. El conflicto es mucho más que un simple desacuerdo o desavenencia: constituye una interferencia deliberada, activa o pasiva, para bloquear los intentos de la otra parte por alcanzar sus objetivos.

Entelman (2002)

En general, es una especie o clase de relación social en que hay objetivos de distintos miembros de la relación que son incompatibles entre sí.

Robbins (2009)

Es un proceso que se inicia cuando una de las partes percibe que la otra afecta o puede afectar algo que la primera considere importante.

Fuente: Elaboración propia
Si analizamos los diferentes conceptos, podemos decir que los conflictos pueden tener diferentes causas (deficiencias en la comunicación, choque de intereses, valores, acciones o direcciones, amenazas al estatus de un sector, cambio en las organizaciones, diferencias en metas y en las percepciones) y ser de diferentes tipos, esto es, los actores pueden ser individuales o grupales. Cabe destacar que una cuestión relevante es que el conflicto no es simplemente un desacuerdo, debe haber conciencia, percepción de los actores involucrados en la situación conflictiva. De los diferentes conceptos, también se puede evidenciar que el conflicto es un proceso complejo, ya que el mismo tiene diferentes etapas, su dinámica va cambiando con el tiempo y existen diferentes maneras de abordarlo (tal como veremos más adelante en el desarrollo del tema) y también es dinámico ya que es un proceso sujeto a la permanente alteración de todos sus elementos.
En este sentido, cuando hablamos del conflicto, hay diferentes dimensiones Entelman (2002) que son importantes las tengamos en cuenta:
La dinámica del conflicto: en este punto hay que considerar que las percepciones y actitudes de los actores van cambiando y se van alterando.
La escalada/ desescalada del conflicto: implica las modificaciones de la intensidad de la conducta conflictiva
Los cambios en el nivel de intensidad: la intensidad del conflicto no es una cuestión estática o estable en el tiempo

Variables de la conducta conflictiva: Se refiere a las variables de interacción social que permiten explicar los fenómenos de cooperación como también los de conflicto entre los actores.
En este punto analizamos las conductas y las actitudes de los actores: nivel de acuerdo/ desacuerdo (plano intelectual) que tienen los actores, las acciones positivas/ negativas (plano volitivo) y el nivel de hostilidad/ amistosidad (plano afectivo) que presentan.
Conflicto organizacional.
Cuando hablamos del conflicto organizacional, nos estamos refiriendo a los diferentes conflictos que se dan dentro de las organizaciones, es decir, no sólo los conflictos interpersonales que se dan entre las personas que trabajan en la organización sino también aquellos que surgen por aspectos organizacionales y de la propia organización. (Franklin Fincowsky & Krieger (2010: 483)
En este sentido, Chiavenato (2009: 491) menciona que el conflicto organizacional se manifiesta cuando existen sentimientos, ideas o actitudes que son antagónicos o que pueden chocar en una organización. Es un choque de intereses.
Por su parte, Camisón (2006:48) expresa que “se refieren a los inconvenientes entre los objetivos organizacionales y los objetivos individuales”; es decir, que las metas organizacionales y las metas individuales no siempre son las mismas, originándose posturas diferentes entre los miembros de las instituciones”.
Con respecto a estos conflictos, cabe destacar, que hay diferentes concepciones o puntos de vistas en cuanto a la concepción del conflicto en el ámbito de las organizaciones.
Robbins (2009: 461) menciona tres corrientes del pensamiento y marca una evolución:
POSICIÓN TRADICIONAL: esta posición considera que los conflictos deben evitarse, ya que perjudica el rendimiento y si se manifiestan hay que enfocarse en las causas del conflicto y corregirlo cuanto antes, ya que el mal funcionamiento puede afectar el rendimiento del grupo y la organización.

POSICIÓN DE LAS RELACIONES HUMANAS: en esta corriente de pensamientos, está la idea de que los conflictos son naturales en cualquier interacción por lo que son inevitables y hay que aceptarlo, es decir, se racionaliza el conflicto.
POSICIÓN INTERACTIVA: en esta posición está la idea de que el desacuerdo que causa el conflicto es positivo y necesario para el grupo, por tal motivo, en esta concepción, se promueve a los líderes a que mantengan un grado mínimo de conflictos en el grupo de trabajo, con la creencia que de este modo el dinamismo será más innovador, auto- crítico y creativo.
Por su parte Krieger (2001) en su libro Sociología de las Organizaciones mencionaba diferentes puntos de vistas en la concepción del conflicto, estos son:
PUNTO DE VISTA TRADICIONAL: que tiene una concepción de que el conflicto es algo negativo y debe evitarse.
PUNTO DE VISTA CLASISTA: según esta concepción en las que la distribución del poder es desigual (dominantes y dominados) y por ende los intereses de los grupos (en el sentido de las clases) son contrapuestos, la alternativa del conflicto es la última.
Este punto de vista considera a la organización como un sistema en el que existe lucha de poder, no es sólo un sistema social colectivo en que sólo hay un sistema compartido.
PUNTO DE VISTA FUNCIONALISTA: tal como menciona Robbins (2009) con la concepción de las relaciones humanas, este punto de vista entiende que el conflicto es algo natural en todo sistema social. Sin embargo para esta perspectiva el conflicto no es inevitable, en el sentido que aunque se tengan las bases de la generación del conflicto (sistema social) no significa que siempre va a haber conflicto. En este sentido, promueve que los líderes deben tratar de tener formas constructivas de resolver el conflicto y a su vez operar con el mínimo grado de conflictividad.
PUNTO DE VISTA INTERACCIONISTA: en esta concepción se estimula el conflicto con la creencia de que los grupos, con este modo, no se convertirán en apáticos y estáticos, por lo que los líderes promueven un nivel continuo (aunque mínimo) de conflictividad entre sus equipos de trabajos. Desde este punto de vista el conflicto no es totalmente bueno o malo. (p. 396-398)

Proceso del Conflicto (Robbins)

Etapa 1: se analizan las distintas fuentes de conflictos, ej: mala comunicación, estructura y características de grupos y personas
Etapa 2: se define “de que va” el conflicto, podemos tener un conflicto percibido (están dadas las condiciones para propiciarlo) y sentido (es cuando se torna personal)

Niveles Gravedad (Chiavenato p.390)

Etapa 4: es donde el conflicto se hace visible, ya que se afirman actos y reacciones de las partes del conflicto

Etapa 5: donde se evidencian los resultados, las consecuencias del conflicto y el impacto en el grupo (si fue funcional, constructivo o por el contrario disfuncional)

Percibido

También llamado conflicto latente debido a que existen posibilidades de que se pueda manifestar el conflicto

Experimentado

Aquí el conflicto no se manifiesta abiertamente, también llamado conflicto velado

Manifiesto

Aquí la situación conflictiva es expresada abiertamente por parte de los actores. ( conflicto abierto)

Fuente: Elaboración propia

Técnicas de resolución del conflicto.
Tal como mencionan los autores Davis, K y Newstrom, J (2003), existen diferentes maneras de abordar una situación conflictiva:

FORMAS DE CONFLICTO

ABORDAR

EL COMPORTAMIENTO DE LAS PARTES

ACCIÓN DE EVITAR- “ perder-perder”

Las partes involucradas toman distancia, tanto física como mentalmente, mostrando poco interés para su verdadera resolución

AVENIMIENTO “perder-ganar”

Esto sucede cuando una de las partes acepta los requerimientos de la otra, dejando de lado sus propios intereses.

FUERZA “ ganar-perder”

Una de las partes hace uso de su dominio y poder para conseguir los objetivos e intereses propios, por sobre la otra parte.

ACUERDO MUTUO “ganar- ganar”

Hay una predisposición de ambas partes para ceder algo para ganar algo a cambio, con la finalidad de llegar a un acuerdo válido para ambas partes.

CONFRONTACIÓN “ganar-ganar”

Las partes se enfrentan de manera directa con la finalidad de buscar una solución que satisfaga a ambas partes.

Fuente: Elaborado a partir Krieger, M (2001, p.484)

Por su parte, Robbins, S. (2009, p.490) menciona diferentes intenciones para manejar los conflictos. Ambas partes pueden colaborar, competir, evitar, acomodarse o comprometerse en la resolución de una situación conflictiva.

Sin embargo, en este punto, nos vamos a detener un poco más en la mediación, considerándola una de las más importantes y en el siguiente punto nos centraremos en la negociación, siendo estás dos técnicas de resolución de conflictos, las más relevantes.
MEDIACIÓN:
Siguiendo a Folberg & Taylor (1997) podemos decir que la mediación “Es el proceso mediante el cual los participantes, junto con la asistencia de una persona o personas neutrales, aíslan sistemáticamente los problemas en disputa con el objeto de encontrar opciones, considerar alternativas, y llegar a un acuerdo mutuo que se ajusta a sus necesidades”
Es un proceso que trasciende el conflicto (trasciende su contenido). Su meta principal no es la resolución de la desavenencia entre las partes sino la del manejo del conflicto.
En la mediación se gestiona el conflicto a través de una persona neutral para los participantes de la situación conflictiva. Este mediador, recurre a la posibilidad de encontrar diferentes alternativas y de aislar los problemas, en busca de encontrar un acuerdo MUTUO que se ajuste a las necesidades de los actores.
Cabe destacar que en la mediación una de sus características es manejar plazos cortos de tiempos de manera que se pueda disminuir la ansiedad de los participantes, también la de generar un plan que abarque las formas en que los actores pueden resolver el conflicto y de esta manera acepten las consecuencias de sus propias decisiones.
Folger & Taylor (1997) mencionan que una de las características de la mediación es que los participantes toman las decisiones, haciendo hincapié en su propia responsabilidad y teniendo en cuenta la influencia de las mismas en sus vidas.
Entonces, para concluir, podemos decir que la mediación es una negociación entre dos personas asistidas por un tercero neutral que tiene como objetivo facilitar la comunicación entre las partes, al fin de que éstas puedan lograr acuerdos consensuados atendiendo a los intereses y necesidades de ambas partes con criterios objetivos. El mediador no da consejos (a diferencia de un conciliador por ej,) sino que indaga en sus necesidades de manera de lograr un acuerdo a partir de la comunicación (sentarse a hablar)
4- Negociación. Concepto. Etapas de la negociación. Estrategias de negociación.
Concepto:
La negociación es una manera de abordar la situación conflictiva (de las más reconocidas) en busca de la resolución del conflicto a través de la comunicación entre las partes involucradas.
A continuación mostramos algunas definiciones aportadas por distintos autores:

AUTOR

CONCEPTO (Richard Daft)
 “Es el proceso de intercambio que generalmente ocurre en una confrontación entre dos partes y permite que éstas lleguen a una resolución”
 (Chiavenato 2009, p. 399)

Es el proceso mediante el cual dos o más partes intercambian activos y acuerdan una tasa de intercambio. La negociación se concentra en el acuerdo y los intercambios entre las parte involucradas”
 (Neale, M. y Bazerman, M.)

Es un proceso de toma de decisiones entre partes interdependientes que no comparten preferencias idénticas. Por medio de la negociación, las partes deciden lo que cada una debe dar y recibir en sus relaciones

Fuente: Elaboración propia

Teniendo en cuenta los diferentes conceptos aportados por los autores, podemos decir que en la negociación una condición indispensable es la comunicación y también la opción de elegir lo que se desea. Hay plena conciencia y conocimiento de la libertad que tienen las partes involucradas de conseguir lo que quieren.
En este proceso las partes involucradas exponen sus intereses y demandas y lo proponen a la otra parte quien las analiza y luego, realizan una contrapropuesta.

Etapas de la negociación: El autor Chiavenato (2009, p. 403) propone diferentes etapas para que haya integración de intereses entre las partes involucradas: Preparación y planeación: en esta etapa se busca definir quiénes son las partes involucradas, cuál es la naturaleza de la negociación, cuál sería la mejor estrategia para abordar la negociación, y definir las metas y resultados que se buscan alcanzar. Definición de reglas básicas: en esta etapa se define las reglas que regirán en el proceso de negociación.

Aclaraciones y justificaciones: en este momento es la oportunidad de las partes de ampliar y explicar sus puntos de vista, de manera de explicar mejor su justificación. Si es necesario se pueden mostrar datos e información.
Intercambio y solución de problemas: en esta etapa se dan las concesiones por ambas partes para llegar a un consenso.
Conclusiones y aplicación: en esta etapa se plasman de la forma en que acuerden las partes, los acuerdos a los que llegaron en las instancias anteriores. La formalización puede hacerse a través de un documento, o simplemente con “contrato” de palabra.
Por su parte, Alcover de la Hera, C. et al (2004) menciona las siguientes FASES en la negociación:
FASE I: definición y límites
En esta fase se realiza un encuadre de la negociación que viene a ser un modelo mental, que implica una anticipación, una representación cognitiva de la negociación que se espera.
En esta parte se ordena el conflicto en términos de negociación, aquí es relevante la diferenciación entre el proceso general del conflicto y el proceso más restringido de la negociación. En este momento del proceso hay una formulación específica de lo que se va a negociar, es decir, se restringe el conflicto a una parte negociable. (p.441)
FASE II: dinámica negociadora
En esta segunda fase se produce el intercambio, el “regateo” entre las partes negociadoras. En esta fase tienen lugar los movimientos concretos, los comportamientos y las acciones específicas.
Dentro de esta fase pueden reconocerse tres sub-fases:
Establecimiento de la posición inicial: marca la primera referencia explícita que se hace a la otra parte

La maduración: es el largo proceso de intercambio, de mensajes cruzados, de forzar las posiciones propias y ajenas hasta donde se pueda.
La búsqueda cooperativa: en esta instancia ambas partes saben cuáles son los límites del acuerdo, por lo que es el momento de ver si es posible. (p.442)
FASE III: resolución (acuerdo)
Esta fase es breve e intensa, las partes se han tomado su tiempo para llegar hasta acá, han realizado el esfuerzo de atenuar sus posiciones y acercarlas, por lo que es el momento de concretar el acuerdo.
Estrategias de la negociación
Chiavenato, I. (2009) menciona diferentes enfoques para la negociación, y los relaciona a las diferentes estrategias de negociación.
La negociación distributiva, está relacionada al enfoque tradicional, es decir al “ganarperder”. En las negociaciones distributivas una de las partes logra satisfacer sus intereses y objetivos por sobre la otra.
La negociación integradora, se busca satisfacer los deseos de ambas partes, es decir que ambas partes logren sus aspiraciones, es decir se busca “ ganar-ganar” ; o ambas partes encuentren satisfacción similar en sus planteamientos (resultado “todos ganan” o “todos pierden”)
Teniendo en cuenta a todos los autores citados, si relacionamos las diferentes maneras e intenciones de abordar una situación conflictiva, resultaría de la siguiente manera:

ESTRATEGIAS DE NEGOCIACIÓN

INTEGRATIVA

DISTRIBUTIVA

FORMAS DE ABORDAR EL CONFLICTO

ACUERDO “ganar- ganar”

MUTUO AVENIMIENTO “perderganar”

CONFRONTACIÓN “ganar-ganar”

FUERZA “ ganar-perder”

ACCIÓN DE EVITAR- “ perder-perder”

INTENCIONES

Colaboración - conciliación Competencia

Evasión

Acomodación - Cesión

LIDERAZGO Y EQUIPOS DE TRABAJO
Lic. Adriana Chávez Lic. Adriana Moglia
Objetivos:  Comprender la vinculación entre liderazgo, poder y autoridad en un contexto organizacional.  Evaluar los diferentes componentes del liderazgo.
1. Equipos interdisciplinarios en la gestión organizacional. Etapas de desarrollo. Estructura de los equipos de trabajo.
El comportamiento de un grupo de personas no se puede comprender solamente a través de la sumatoria de los comportamientos individuales de sus miembros; las acciones en un grupo son diferentes a las esperables de cada uno individualmente .Se puede entender al grupo como dos o más personas interdependientes que se unen e interactúan para lograr determinados objetivos. El comportamiento de un grupo es más que la suma de las conductas de los individuos que lo forman, el comportamiento y/o rendimiento de un miembro es influido por el comportamiento y/o el rendimiento de otros miembros (Chiavenato, 2017; Robbins, 2009; Gibson, 2011).
Según Chiavenato (2017,p.157) el estudio de los grupos es importante para el comportamiento organizacional por las siguientes razones:
● Tanto la organización formal (aquella que está claramente definida en el diseño organización), como la informal (la que se desarrolla espontáneamente a partir de las relaciones informales entre personas), se basa en grupos.
● Los administradores dirigen grupos de subordinados. ● La participación en el grupo influye en el comportamiento de sus miembros. ● La influencia del grupo en cada persona es diferente. El grupo puede influir mucho en algunas personas y tal vez muy poco o nada en otras.

● Los grupos pueden ayudar a que la organización alcance los objetivos o pueden impedirlo.
● Los grupos pueden perseguir objetivos discrepantes y tener conflictos entre sí ó con la organización.
Otra función relevante que identifica Krieger (2012) es la de brindar un entorno afectivo a los miembros de la organización, esencial para su integración, interiorización y transmisión de valores y cultura organizacional.
Uno de los pioneros en este tema es el autor Kurt Lewin, quien ya en la década del ´30 clasificaba los grupos en formales o informales. Los grupos formales son conjuntos de trabajo que crea la organización mediante la asignación de tareas específicas. En estos grupos se estimula el comportamiento que favorece el trabajo conjunto para alcanzar los objetivos de la organización y pueden ser:
- Grupos de mando: son los tradicionalmente determinados por las relaciones de autoridad y están definidos en el organigrama.
- Grupos de tarea: son definidos por la organización y formados por personas que ejecutan determinadas tareas o funciones.
- Grupos temporales con plazos definidos: se forman para ejecutar ciertas tareas de la organización y tienen duración definida, como comisiones.
Mientras que los grupos informales son aquellos que surgen en forma espontánea como resultado de las relaciones entre personas. Son de naturaleza social, en respuesta a las necesidades del contrato social, se forman en base a amistades o intereses comunes y pueden ser:
- Primarios o pequeños: se caracteriza por la camaradería y la lealtad y porque sus miembros tienen valores en común.
- De interés: los que se unen para enfrentar problemas similares o alcanzar un objetivo común que satisfaga sus intereses individuales.
- De amistad: son los que van más allá del entorno laboral y que tienen relaciones sociales.
- Coaliciones: son formación de alianzas estratégicas en las organizaciones. Son entidades separadas, poderosas y eficaces dentro de las organizaciones.

Etapas de desarrollo
Los grupos se desarrollan de manera dinámica, y deben atravesar ciertas etapas para consolidarse como equipos, no existe límite de tiempo para atravesar cada una de estas etapas, tampoco dichos límites están tan claros, pudiendo realizarse varias etapas simultáneamente. Chiavenato (2009) identifica cinco etapas
1. Etapa de Formación: es cuando se construye el grupo, sea por razones formales, por una asignación de algún trabajo o informales, luego que se reunieron es necesario determinar el propósito, la estructura y su liderazgo.
2. Etapa de la Tormenta: aquí comienzan los conflictos, tratando de que su individualidad no sea sobrepasada en su decisión por la del grupo, de quién será el líder, pasada esta etapa el liderazgo se logra a través de un consenso.
3. Etapa de Normalización: aquí el grupo comienza a trabajar más cohesionado, tienen expectativas en común definiendo su comportamiento.
4. Etapa de Desempeño: esta es la etapa de maduración del grupo, donde la energía se enfoca en la tarea que realizarán. Les interesa el cumplimiento de las metas como grupo.
5. Etapa de Interrupción: cuando se trata de grupos temporales, los miembros se preparan para volver a sus propias actividades, porque ya han cumplido con sus metas. Las reacciones de los miembros son variadas, desde la necesidad de seguir mejorando a deprimirse, por pérdida de lo que han logrado mientras duró el grupo.
Según Chiavenato (2009, p. 284) “equipo” y “grupo” se han utilizado como sinónimos pero hay diferencias entre estos dos conceptos, sobre todo en cuanto a resultados. Los equipos son grupos con metas claras y roles diferenciados a partir de criterios de productividad y eficiencia en el logro de objetivos.
Mientras que el desempeño de un grupo de trabajo depende de lo que hace cada uno de sus miembros, en un equipo el desempeño combina los resultados individuales y el producto del trabajo colectivo, es decir, aquello que dos o más miembros producen juntos como aportación real (Krieger, 2012, p. 204)
Las organizaciones deben aprender a desarrollar y administrar equipos y saber cómo motivar la mejora continua. Esto es cuestión de cultura y estructura.

Estructura de los equipos de trabajo
Esta estructura modela el comportamiento de sus miembros y permite explicar y prever en buena medida el comportamiento de los individuos así como el desempeño grupal.
Las principales variables estructurales de grupo señaladas por Chiavenato (2009) son:
Función o Rol: todos los miembros del grupo son actores y cada uno desarrolla una serie de patrones de conducta esperada - según el contrato psicológico - que se atribuye a alguien que ocupa un lugar en el grupo para que el mismo pueda funcionar.
Desempeño del Rol: el cumplimiento de la función que le fue atribuida a cada persona se encuentra atravesada por diversas situaciones:
- Identidad de la función: las personas asumen ciertos comportamientos y actitudes que entienden son consistentes con la función asumida. Las personas pueden cambiar rápidamente de papel cuando perciben que una situación y sus requisitos necesitan cambios, por ejemplo al cambiar de puesto o sector.
- Percepción de la función: visión que la persona tiene sobre el comportamiento que corresponde al papel que le ha sido asignado.
- Expectativa de la función: es la manera en que otros piensan que la persona debe reaccionar y comportarse en determinada situación, de acuerdo con la función que le ha sido asignada.
- Conflicto de rol: Cuando una persona se enfrenta a múltiples y diferentes expectativas asociadas a las funciones que desempeña, surge un conflicto. La persona percibe que su compromiso con un papel puede dificultar o impedir el desempeño de otro. En realidad, todas las personas enfrentan conflictos de funciones, los cuales producen tensión interna y frustración, y las reacciones pueden ser variadas.
Liderazgo: casi todos los grupos tienen un líder, quien acepta realizar actividades orientadas a los fines del grupo, cumple una función integradora al asegurarse que todos persigan el mismo objetivo, y busca potenciar el desarrollo de los vínculos entre sus miembros.
Normas: son las pautas de comportamiento que aceptan y comparten todos los miembros. Especifican aquello que los miembros deben hacer o evitar en ciertas circunstancias y son medios para influir en el comportamiento de las personas con un mínimo de control externo.

Estatus: posición social que las personas atribuyen a un grupo o a los miembros de éste y se relacionan con ciertas normas, prácticas o símbolos. Por ejemplo, algunas fuentes de estatus pueden ser la edad, la antigüedad, las responsabilidades asumidas o el conocimiento.
Tamaño: la cantidad de personas que participa de un grupo influye en su comportamiento. La evidencia sugiere que los grupos más pequeños realizan mejor sus tareas, en cambio los grupos grandes obtienen mejores resultados cuando se trata de resolver problemas. Un comportamiento particular es la de “holganza social”, que es la tendencia de una persona a esforzarse menos cuando trabaja en grupo. Suele provocarse cuando se percibe que los demás miembros no están cumpliendo con su papel. La holganza social es una sinergia negativa, se contrapone a la idea de que la productividad de un grupo es igual o mayor la suma de la productividad de los elementos que lo componen.
Composición: Combinación de conocimientos y competencias que los miembros aportan al grupo. La diversidad incrementa el potencial de un grupo, permitiendo alcanzar más rápido sus objetivos, también promueve el conflicto que si es bien administrado promueve la creatividad e innovación.
Cohesión: atracción que sienten los miembros entre sí y a su motivación para permanecer en el grupo. Es relevante en el análisis de los grupos porque, dependiendo del tamaño, la interacción, el contexto y los objetivos se encuentra asociada a la productividad.
Equipos interdisciplinarios en la gestión organizacional
Como mencionamos, en el origen de cualquier equipo hay un grupo de trabajo. Pero las razones por las que los administradores forman equipos de trabajo son variadas Gibson (2011) señala la mejora en la productividad, la necesidad de flexibilidad en organizaciones planas para tomar decisiones más rápido, la diversidad de la fuerza de trabajo, la mejora en la calidad y la mayor satisfacción de los clientes.
Hoy las organizaciones enfrentan entornos caracterizados por la transformación tecnológica, la globalización y los cambios culturales. Ante esta complejidad, los equipos interdisciplinarios se presentan como una estrategia organizacional que permite integrar diversas competencias y perspectivas en la resolución de problemas y en la toma de decisiones (Chiavenato, 2017).

La principal ventaja de los equipos interdisciplinarios es su capacidad para enriquecer el proceso de toma de decisiones a través de la diversidad de conocimientos, habilidades y enfoques que sus miembros aportan. Según Robbins (2017), la diversidad cognitiva dentro de los equipos mejora la creatividad, la innovación y la habilidad para enfrentar problemas complejos, permitiendo generar mejores soluciones. Además, Franklin y Krieger (2012) destacan que los equipos interdisciplinarios favorecen el aprendizaje organizacional, ya que al interactuar profesionales de distintas áreas, se facilita el intercambio de saberes y la adquisición de nuevas competencias. Desde una mirada sociológica, esta dinámica fomenta la ruptura de rutinas organizativas tradicionales y promueve culturas más abiertas y adaptativas. Newstrom (2011) subraya que estos equipos también fortalecen la motivación intrínseca de los miembros, al brindarles oportunidades para asumir roles más activos, creativos y autónomos dentro de la organización. Sin embargo, trabajar en equipos interdisciplinarios también implica enfrentar importantes desafíos. Gibson (2011) advierte que las diferencias en marcos de referencia, lenguaje técnico y prioridades entre las disciplinas pueden dificultar la comunicación efectiva y generar conflictos internos. Estas tensiones no solo retrasan los procesos de trabajo, sino que pueden minar la cohesión del equipo si no se gestionan adecuadamente. Chiavenato (2017) señala que la coordinación en estos equipos exige mayores habilidades de liderazgo y gestión de conflictos, ya que la heterogeneidad de perspectivas puede provocar rivalidades o luchas de poder. Además, Robbins (2017) indica que, en contextos de alta presión, la diversidad puede dar lugar a "desacuerdos improductivos" que afectan el desempeño global del equipo si no se canalizan hacia debates constructivos. Desde una visión organizacional más amplia, Franklin y Krieger (2012) alertan que, en organizaciones con culturas rígidas o jerárquicas, los equipos interdisciplinarios pueden ver limitadas sus posibilidades de innovación, ya que las estructuras de poder tienden a reforzar las visiones dominantes y a silenciar la diversidad de voces.

2. Diferentes roles y el líder en los equipos de trabajo. Liderazgo. Concepto. Estilos de liderazgo.
Para que las organizaciones funcionen se requiere de varias personas que trabajen juntas y realicen diferentes actividades en distintos niveles. Algunas ocupan altos cargos en la jerarquía (presidentes, directores y gerentes), desde los cuales vigilan el trabajo de otras personas y asumen responsabilidad por la actividad conjunta de varios individuos, lo cual necesariamente implica liderazgo, que es un factor clave en toda organización.
Como se señaló anteriormente, los miembros dentro de los equipos de trabajo se encuentran organizados en diferentes roles. Cada uno tiene una función particular en el desempeño del equipo para alcanzar los objetivos organizacionales, entre ellos el líder es quien se encarga de motivar o potenciar las competencias del grupo.
Desde la bibliografía el liderazgo es definido como “un poder personal que permite a alguien influir en otros por medio de las relaciones existentes.” (Chiavenato, 2009, p. 336), una “aptitud de un individuo de influir en un grupo para el logro una visión o conjunto de metas” (Robbins, 2009, p. 385), “un intento de utilizar la influencia para motivar a los individuos a que alcancen una meta.” (Gibson, 2011, p. 308) o “el proceso de influir y apoyar a otros para que trabajen con entusiasmo en el logro de ciertos objetivos” (Newstrom, 2011, p. 169).
Las definiciones mencionadas comparten elementos como influencia, apoyo, motivación, logro de metas u objetivos, así como las relaciones interpersonales.
Chiavenato (2017) señala que administración y liderazgo son conceptos que frecuentemente se confunden, mientras el primero se refiere al proceso sistemático de elaboración de planes, organización, desempeño organizacional y seguimiento; el segundo desarrolla una visión de futuro, define el rumbo a seguir, comunica estas ideas a los demás, logra que se comprometan y los inspira a superar obstáculos.
El liderazgo es una parte importante de la administración, pero es más abarcativo que este concepto (Newstrom, 2011). En la práctica, se espera que todo administrador o gerente sea un líder, pero no todo líder es un administrador o gerente. El administrador basa su poder en la jerarquía, mientras que el líder lo hace en sus competencias personales.
Ambos se deben combinar para alcanzar el éxito organizacional, líderes y administradores deben contar con competencias relacionadas, que contemplen equilibrio entre el conocimiento de los procesos administrativos y el contacto e interés sincero con las personas (Chiavenato, 2017).

Estilos de liderazgo
Se entiende al estilo de liderazgo como “el patrón de acciones explícitas e implícitas de los líderes según lo consideran los empleados” (Newstrom, 2007, p. 174). El autoconocimiento del líder y la percepción de los seguidores son aspectos relevantes en su definición.
El estudio sobre liderazgo es diverso e incluye diversas teorías y perspectivas que buscan entender la complejidad del fenómeno. A continuación se presentan las principales corrientes teóricas que se dedicaron a estudiar desde una perspectiva científica al liderazgo.

3. Poder. Concepto. Su diferencia con el liderazgo. Las relaciones de poder en las organizaciones y en los equipos de trabajo.
El poder y el comportamiento político son procesos naturales en cualquier grupo u organización, son una realidad de la vida organizacional, y no hay modo de que desaparezcan, aunque su mal uso pueda tener efectos negativos. El estudio del poder y sus efectos es importante para comprender cómo operan las organizaciones. Cada interacción y cada relación social en una organización implica un ejercicio de poder. Los roles establecidos en las organizaciones son fuentes de simbolismos factibles de generar poder. Aprender cómo funciona el poder en las organizaciones ayuda a utilizarlo de manera eficaz.
En cuanto a su definición, según Robbins (2009) el poder se refiere a la capacidad que tiene A para influir en el comportamiento de B de modo que éste actúe de acuerdo con los deseos de A. Para Krieger (2012) es la probabilidad que tiene una persona de imponer su propia voluntad dentro de una relación, a pesar de la resistencia e independientemente del fundamento sobre el que se base esta probabilidad. Mientras que para Chiavenato (2009: 336) es el potencial de una persona para influir en otras. Los autores coinciden en considerarlo como la capacidad potencial o probabilidad de influir de una persona en otra.
El poder puede existir sin que se use. Alguien puede tener poder pero no imponerlo. Su ejercicio depende del “momento, presiones del entorno, lugar y personas involucradas”. Señala Robbins (2009) que es probable que el aspecto más importante del poder sea que es una función de dependencia. Entre mayor sea la dependencia de B con respecto de A, mayor es el poder de A en la relación. A su vez, la dependencia se basa en las alternativas que percibe B y la importancia que éste coloca en aquella que A controla.
El poder se desarrolla de diversas formas, los autores diferencian el poder personal del formal o estructural y señalan que existen cinco bases que la persona puede controlar y que le permite influir en la conducta de otros.
