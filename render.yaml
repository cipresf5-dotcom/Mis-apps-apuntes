# Blueprint de Render para el monorepo "mis-apps".
# Cada app vive en su propia carpeta y tiene aquí su propio bloque de servicio.
# Para agregar una app nueva más adelante: crear su carpeta y sumar otro
# bloque "type: web / runtime: static" con su rootDir correspondiente.
services:
  - type: web
    name: mis-apuntes-portal
    runtime: static
    rootDir: portal
    buildCommand: ""
    staticPublishPath: .

  - type: web
    name: finanzas-publicas-estudio
    runtime: static
    rootDir: finanzas-publicas
    buildCommand: ""
    staticPublishPath: .

  - type: web
    name: inferencia-estadistica-estudio
    runtime: static
    rootDir: inferencia-estadistica
    buildCommand: ""
    staticPublishPath: .

  - type: web
    name: historia-pensamiento-economico-estudio
    runtime: static
    rootDir: historia-pensamiento-economico
    buildCommand: ""
    staticPublishPath: .

  - type: web
    name: sociologia-economica-estudio
    runtime: static
    rootDir: sociologia-economica
    buildCommand: ""
    staticPublishPath: .

  - type: web
    name: historia-economica-estudio
    runtime: static
    rootDir: historia-economica
    buildCommand: ""
    staticPublishPath: .
