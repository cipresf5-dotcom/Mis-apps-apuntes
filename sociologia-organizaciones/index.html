A partir de estas bases se analiza la función de dependencia, relevante en el estudio del poder. Cuanto más dependa B respecto de A, mayor poder tiene A sobre B. Cuando una persona posee algo que otros requieren pero solo ella controla, los hace dependientes, y, por tanto, tiene poder sobre ellos. Entonces, la dependencia es inversamente proporcional a las fuentes alternativas de suministro y se incrementa cuando el recurso controlado es importante, escaso e insustituible.

Según Krieger (2012) las razones por las cuales algunos grupos o individuos adquieren mayor poder que otros en determinados ámbitos o decisiones se debe a tres cuestiones: las fuentes o recursos de los que dispone, el uso de los mismos y las habilidades para usarlos.

El éxito o fracaso en el uso del poder de una persona depende en gran medida de que lo comprenda y sepa cómo y cuándo utilizarlo, así como de que sea capaz de anticipar sus efectos probables.
En el contexto organizacional el poder formal se distribuye realizando una diferenciación jerárquica de los roles en función de los objetivos a alcanzar, la estratificación puede ser vertical (jerárquica) u horizontal (funcional) y se define a través de estatutos, normas, reglas internas. En este contexto se identifica a la autoridad como el poder legítimo, o sea, a las facultades que tiene una persona gracias a la posición que ocupa en una estructura organizacional. Es el poder legal y socialmente aceptado (Chiavenato, 2017)
Para que exista autoridad, debe haber un reconocimiento de las fuentes que la legitimen.
Existen tres fuentes de legitimación: tradición, carisma y marco jurídico. La autoridad tiene un carácter instituyente (es decir que establece un orden), pero no necesariamente es modificadora de las conductas.
Poder, liderazgo y autoridad son tres conceptos que aunque están interrelacionados, poseen diferencias. A menudo son utilizados como sinónimos, pero es necesario identificar cada uno. En este sentido, Chiavenato (2017, p.216) señala que:
- El poder es la capacidad de influir independientemente de la posición formal, “es el potencial de una persona para influir en otras. En una organización, es la capacidad de controlar las decisiones y las acciones de otras personas, aun cuando éstas se resistan”.
- La autoridad se refiere al poder legítimo, o sea, a las facultades que tiene una persona gracias a la posición que ocupa en una estructura organizacional. Autoridad es el poder legal, socialmente aceptado y formalmente establecido.
- El liderazgo es, como se mencionó anteriormente, un poder personal que permite a alguien influir en otros por medio de las relaciones existentes. Los líderes usan el poder como un medio de alcanzar las metas grupales.
A partir de un ejemplo podemos representar la diferencia entre los tres conceptos, en una organización el Gerente es un puesto con autoridad y por ello poder legítimo, si bien se espera que sea un líder, en la práctica no siempre sucede.

Las relaciones de poder en las organizaciones y en los equipos de trabajo.
Según Krieger (2012, pp.271-273) los actores entablan entre sí relaciones de poder cuyo propósito es controlar zonas adecuadas de incertidumbre, definidas por las exigencias de la organización. Eso implica que son capaces de utilizar los recursos y las oportunidades que les ofrece una situación determinada para lograr objetivos de poder personales y organizacionales.
El poder es una relación de intercambio y negociación entre dos o más actores interdependientes que tienen necesidades recíprocas en función de realizar los objetivos personales y organizacionales. Se trata de una relación de fuerza y negociación,de la que uno puede sacar más provecho que el otro.
Entonces, el autor denomina constelaciones de poder en las organizaciones a las relaciones de poder o influencia sobre ella, que provengan del contexto o del interior de las mismas.
Así va a considerar que determinadas instituciones u organizaciones del entorno, como los asociados de otras organizaciones, los proveedores, los clientes, el sindicato, los competidores, los organismos públicos nacionales, provinciales, municipales, instituciones de orden público o privado; pueden afectar e influir en las actividades y decisiones que involucren el desarrollo de la organización.
De igual manera, los accionistas, socios de la organización, el presidente, CEO, gerencia general, y/o de línea, jefes de línea, profesionales, técnicos y demás agentes que se relacionen con la organización, “podrán utilizar recursos y oportunidades para lograr objetivos personales y organizacionales”. Lo ideal sería que de esta relación de fuerzas y colaboración ninguna parte pueda sacar ventaja sobre la otra.
4. Diagnóstico e intervención
Equipos de trabajo
El diagnóstico y la intervención en equipos de trabajo requieren una mirada integral que articule dimensiones estructurales y subjetivas. Diagnosticar un equipo de trabajo implica observar no sólo sus resultados, sino también sus estructuras internas y los procesos psicosociales que lo atraviesan.
En este sentido, Franklin y Krieger (2012, pp. 217 - 223) subrayan la importancia de las percepciones subjetivas, los vínculos afectivos y las narrativas compartidas entre los miembros del equipo. El diagnóstico debe atender no sólo a los indicadores formales, sino a la manera en que las personas viven su experiencia de grupo: los sentimientos de pertenencia, las tensiones, los liderazgos legítimos o resistidos.
Como formas de abordaje, los autores proponen diferentes herramientas: Autoevaluación de la escala de desarrollo del equipo, dimensiones a considerar en su evaluación, propuestas de intervención, técnicas para el desarrollo.
Gibson et al. (2011) y Newstrom (2011) proponen un análisis detallado de variables clave como el tamaño del equipo, las normas grupales, los tipos de liderazgo, los niveles de cohesión o las recompensas percibidas.
Robbins (2009, p.327) agrupa en cuatro categorías generales las variables para analizar la eficacia de los equipos de trabajo. La primera son los recursos y otras influencias del contexto. La segunda se relaciona con la composición del equipo. La tercera categoría es el diseño del trabajo. Por último, las variables del proceso reflejan aquello que está contenido en el equipo y que influye en su eficacia.
Para diagnosticar la situación de los equipos de trabajo, desde la cátedra se sugiere observar variables como: Definición y cumplimiento de roles dentro del grupo, Nivel de cohesión entre los miembros, Existencia y aplicación de normas grupales, Jerarquización y estatus dentro del grupo, Predominio de un ambiente de cooperación o competencia.
Liderazgo
En su mayor parte, las investigaciones sobre liderazgo hacen énfasis en el estilo. En el estudio de los estilos de liderazgo Franklin y Krieger (2012) identifican los siguientes componentes donde centrar la atención:
- Persona líder: quien motiva a su equipo apelando a todos sus recursos, delega, motiva, organiza en sintonía con sus seguidores.
- Seguidores o subordinados: Es el grupo de personas que acompañan, quienes hacen propia la visión del líder.
- La situación: el momento en que se desarrolla el liderazgo en cierto entorno organizacional, su cultura, clima, estructura, la forma en que se desarrollan sus tareas y las relaciones de poder-autoridad, entre otros.
En un análisis más detallado, Gibson (2011) sugiere como marco de referencia analizar determinadas variables dentro de cada componente, como se presenta en la figura 1.

Objetivo de aprendizaje: Comprender la relevancia de la microperspectiva del comportamiento organizacional mediante el análisis integrado de las características individuales del sujeto laboral y de su entorno de trabajo, identificando factores que inciden en su desempeño y bienestar organizacional.
Introducción
El comportamiento organizacional puede analizarse desde distintos niveles. En la secuencia propuesta por la cátedra, luego de abordar el nivel macro —centrado en la organización y su entorno— y el nivel meso — vinculado a las dinámicas grupales y relacionales—, esta unidad se orienta al nivel micro, focalizado en el sujeto laboral y en los factores que inciden en su experiencia de trabajo. A lo largo de la unidad, los términos sujeto laboral y trabajador se utilizan como equivalentes: ambos designan a la persona en tanto actor de la relación laboral, sin distinción conceptual adicional en este nivel de análisis. En este plano de análisis, resulta relevante comprender cómo las características personales del trabajador —personalidad, actitudes, aptitudes y competencias— influyen en su comportamiento organizacional. Al mismo tiempo, estas dimensiones no pueden analizarse de manera aislada, sino en relación con las condiciones concretas del contexto laboral, entre ellas el contrato psicológico, las condiciones y organización del trabajo, las Condiciones y Medio Ambiente de Trabajo (CyMAT), los riesgos psicosociales y las nuevas modalidades laborales híbridas. En este sentido, Chiavenato (2009) señala que "el comportamiento de las personas en las organizaciones no depende sólo de las características individuales, sino también de las organizacionales" (p. 186). Finalmente, la unidad propone un abordaje diagnóstico de las características individuales y del entorno laboral, con el propósito de realizar un análisis integrado del sujeto laboral y sus condiciones de trabajo, identificando factores que inciden en su desempeño y bienestar organizacional.
1. El sujeto laboral. Características personales del trabajador: personalidad, actitudes, aptitudes y competencias. Influencia en el comportamiento organizacional
Personalidad
Definición de personalidad Una de las definiciones más difundidas de personalidad fue propuesta por Gordon Allport, quien la definió como "la organización dinámica, dentro del individuo, de aquellos sistemas psicofísicos que determinan sus ajustes únicos al entorno" (Robbins, 2009, p. 105). En términos generales, la personalidad puede entenderse como la suma de las formas en que un individuo reacciona ante los demás e interactúa con su entorno. Esta perspectiva pone el acento en características relativamente estables que se expresan en la conducta y que permiten reconocer diferencias entre las personas. Por su parte, Chiavenato (2009) sostiene que la personalidad es un constructo hipotético y complejo que puede definirse de muchas formas y que, básicamente, consiste en una tendencia a comportarse de
Sociología de las Organizaciones · Unidad VI · FCE-UNNE · 2026 | 1 determinada manera en diferentes situaciones (p. 195). Desde esta mirada, la personalidad remite a lo que la persona es, y una característica central del concepto es su peculiaridad. En este sentido, rasgos como la sociabilidad, la agresividad, la impulsividad o la reserva permiten describir, en parte, modos relativamente consistentes de actuar. Este abordaje presenta una ventaja importante: facilita la identificación de diferencias individuales y su posible incidencia en distintas situaciones de trabajo. Así, un rasgo de personalidad puede entenderse como una tendencia relativamente duradera a comportarse de una manera determinada en una variedad de situaciones, constituyéndose en un aspecto relevante para comprender el comportamiento organizacional. Desde la perspectiva de esta asignatura, el estudio de la personalidad resulta significativo porque permite analizar cómo ciertas disposiciones individuales inciden en la forma en que las personas se vinculan con otros, responden a las demandas del trabajo, enfrentan situaciones de cambio y desarrollan determinados estilos de comportamiento dentro de las organizaciones.
Determinantes de la personalidad Siguiendo a Robbins (2009, p. 110), los primeros debates en torno a la personalidad giraban alrededor de si esta era el resultado de la herencia o del ambiente. La cuestión central consistía en determinar si la personalidad estaba predeterminada desde el nacimiento o si, por el contrario, se desarrollaba a lo largo de la vida a partir de la interacción con el entorno. Aunque no existe una respuesta única y definitiva, actualmente se reconoce que la personalidad es el resultado de la interacción entre factores hereditarios y ambientales. La herencia se refiere a aquellos factores biológicos que se transmiten desde el momento de la concepción. Entre las características que, en general, suelen vincularse con esta dimensión, se encuentran la estatura, los rasgos faciales, el sexo, el temperamento, la complexión física, los reflejos musculares, el nivel de energía y los ritmos biológicos. Desde esta perspectiva, se sostiene que ciertos rasgos individuales poseen una base biológica que influye en la configuración de la personalidad. Por su parte, el ambiente comprende el conjunto de influencias sociales, culturales y situacionales que intervienen en el desarrollo de la persona a lo largo de su vida. Las experiencias familiares, educativas, laborales y relacionales contribuyen a modelar la manera en que cada individuo percibe, interpreta y responde a su entorno. En este sentido, la personalidad no puede comprenderse como una realidad fija o aislada, sino como una configuración compleja en la que interactúan disposiciones personales y contextos de socialización. En el plano del comportamiento organizacional, esta interacción entre herencia y ambiente resulta relevante porque permite comprender que las características individuales no se expresan de manera abstracta, sino en contextos concretos de trabajo, donde inciden en el desempeño, en los vínculos interpersonales y en las formas de adaptación del sujeto laboral.
Principales enfoques para el estudio de la personalidad A lo largo del tiempo, diferentes autores han intentado identificar los rasgos centrales de la personalidad que influyen en el comportamiento humano. Sin embargo, muchos de esos esfuerzos dieron lugar a clasificaciones extensas y poco operativas para su aplicación en el ámbito organizacional. En este marco, dos enfoques han adquirido especial relevancia por su difusión y utilidad analítica: el Indicador de Tipos de Myers-Briggs y el Modelo de los Cinco Grandes (Robbins, 2009, p. 109). El Indicador de Tipos de Myers-Briggs constituye un instrumento ampliamente difundido para describir preferencias personales en la forma de percibir, procesar información, decidir y vincularse con el entorno. Su valor radica en que permite identificar distintos estilos de comportamiento, favoreciendo la comprensión de diferencias individuales que pueden incidir en la comunicación, el trabajo en equipo, la toma de decisiones y la adaptación a determinadas tareas.

Por su parte, el Modelo de los Cinco Grandes ha sido respaldado por numerosos estudios que sostienen la existencia de cinco grandes dimensiones que agrupan una parte importante de la variabilidad de la personalidad humana (Robbins, 2009, p. 109). Estas dimensiones son las siguientes:

Tabla 1. Dimensiones del Modelo de los Cinco Grandes

Factor

Definición

Extroversión

Esta dimensión refleja el nivel de comodidad que una persona tiene en las relaciones sociales. Los individuos extrovertidos suelen ser sociables, asertivos y amigables, mientras que los introvertidos tienden a mostrarse más reservados, tímidos y callados.

Adaptabilidad

Se refiere a la disposición de un individuo para aceptar las perspectivas de los demás. Las personas con alta adaptabilidad suelen ser cooperativas, cálidas y confiables; en cambio, quienes presentan baja puntuación en esta dimensión pueden mostrarse fríos, disconformes o antagonistas.

Meticulosidad

Esta dimensión mide el grado de responsabilidad y confiabilidad de una persona. Los individuos con alta meticulosidad suelen ser organizados, persistentes, responsables y confiables. Por el contrario, quienes presentan niveles bajos tienden a ser más desorganizados, distraídos o poco constantes.

Estabilidad emocional

Esta dimensión refiere a la capacidad de una persona para manejar adecuadamente la tensión y las demandas emocionales. Quienes presentan

Sociología de las Organizaciones · Unidad VI · FCE-UNNE · 2026 | 3 baja estabilidad emocional suelen manifestarse más nerviosos, ansiosos, inseguros o propensos a la preocupación.

Apertura a experiencias las Esta dimensión expresa la disposición hacia lo novedoso. Las personas con alta apertura suelen ser creativas, curiosas y receptivas a nuevas ideas, mientras que aquellas con baja apertura tienden a preferir lo convencional, lo conocido y las rutinas más estables.

Fuente: Elaboración propia en base a Robbins (2009, pp. 109-110).

Estas dimensiones resultan especialmente útiles para el análisis del comportamiento organizacional, ya que permiten comprender diferencias individuales que inciden en la forma en que las personas se relacionan con otros, enfrentan exigencias laborales, responden a cambios organizacionales y desarrollan estilos de trabajo particulares. En este sentido, la personalidad no determina por sí sola el comportamiento, pero constituye una variable relevante para interpretar modos de actuación dentro del contexto de trabajo.
Aunque el Modelo de los Cinco Grandes constituye una referencia central, no agota todas las características que suelen utilizarse para describir la personalidad de un individuo. Existen otros atributos específicos que también resultan significativos para comprender el comportamiento en las organizaciones. Entre ellos pueden mencionarse la autoestima, entendida como el grado en que una persona se percibe valiosa, capaz y eficaz; el maquiavelismo, que alude a una orientación pragmática centrada en la manipulación y en la idea de que el fin justifica los medios; el narcisismo, caracterizado por una autoimagen sobredimensionada, necesidad de admiración y sentimientos de superioridad; y el automonitoreo, que refiere a la capacidad de ajustar el comportamiento a las demandas de la situación (Robbins, 2009, pp. 111-114).
Asimismo, Robbins (2009) menciona las denominadas personalidades tipo A, caracterizadas por una fuerte orientación al logro, impaciencia, competitividad y urgencia permanente por hacer más en menos tiempo. Este tipo de rasgos puede influir en la forma en que las personas se desempeñan, gestionan la presión y establecen vínculos en el ámbito laboral.
Desde la perspectiva de esta asignatura, el estudio de la personalidad tiene por finalidad aportar elementos para comprender cómo ciertas disposiciones individuales pueden incidir en el comportamiento organizacional y constituirse en insumos relevantes para el diagnóstico del nivel micro.

Actitud

Definición
Las actitudes son evaluaciones que pueden ser favorables o desfavorables hacia objetos, personas o eventos. Reflejan cómo se siente una persona respecto a algo. Por ejemplo, al afirmar "me gusta mi trabajo", se está expresando una actitud hacia el trabajo. Las actitudes son complejas, ya que, aunque las respuestas sobre actitudes hacia determinados temas, personas o incluso hacia la organización en la que se trabaja pueden parecer sencillas, las razones que las sostienen suelen ser mucho más complejas. Por ello, para comprenderlas de manera más acabada, es necesario analizar sus características fundamentales (Robbins, 2009, p. 75).
Por su parte, Gibson et al. (2011) sostienen que una actitud es "un sentimiento positivo o negativo, o bien, un estado mental de disposición, que se aprende y organiza a través de la experiencia y que, además, ejerce una influencia específica en la respuesta de una persona ante la gente, objetos y situaciones" (p. 99).
En el marco del comportamiento organizacional, el estudio de las actitudes resulta especialmente relevante porque permite comprender cómo los sujetos valoran distintos aspectos de su experiencia laboral y cómo esas valoraciones pueden influir en su comportamiento dentro de la organización. Desde esta perspectiva, las actitudes constituyen una dimensión significativa para el análisis del sujeto laboral en el nivel micro, ya que inciden en la manera en que las personas interpretan su trabajo, se vinculan con otros y responden a distintas situaciones del entorno laboral.

Componentes de las actitudes Las actitudes se componen de tres elementos fundamentales: cognición, afecto y comportamiento.

Componente cognitivo: es la parte “intelectual” o de “conocimiento” de la actitud. Representa la creencia, opiniones o convicciones de una persona dentro de una actitud. Componente afectivo: se refiere a la parte emocional o sentimental asociada con una actitud. Componente comportamental: implica la intención de comportarse de determinada manera hacia una persona o situación específica.

Disonancia cognitiva Los individuos se esfuerzan por mantener consistencia entre los componentes de sus actitudes; sin embargo, con frecuencia se producen contradicciones e inconsistencias que generan un estado de desequilibrio, cuya tensión solo se reduce cuando se alcanza alguna forma de consistencia. En este marco, fue Leon Festinger quien acuñó el concepto de disonancia cognitiva para describir la tensión que surge de la inconsistencia entre cognición y comportamiento (Robbins, 2009, p. 75; Gibson et al., 2011, p. 101). Cualquier forma de inconsistencia resulta incómoda para el individuo, por lo que este tiende a reducir la disonancia y a recuperar un cierto estado de equilibrio. Desde esta perspectiva, la disonancia cognitiva permite comprender que las actitudes no siempre se expresan de manera coherente o estable, ya que pueden verse atravesadas por tensiones entre lo que el sujeto piensa, siente y hace. En el ámbito organizacional, este aporte resulta relevante para interpretar situaciones en las que los trabajadores experimentan contradicciones entre sus creencias, sus valoraciones y sus comportamientos frente al trabajo, la organización o las condiciones en que desarrollan su tarea. Aptitud Chiavenato (2009) define la aptitud como la predisposición innata y natural para determinadas actividades o tareas, es decir, el potencial que posee cada persona para aprender determinadas habilidades o comportamientos. En este sentido, la aptitud constituye una habilidad en estado latente o potencial, que puede desarrollarse mediante el ejercicio o la práctica (p. 190). Desde esta perspectiva, la aptitud permite comprender que los sujetos no solo difieren en sus rasgos de personalidad o en sus actitudes, sino también en las capacidades potenciales con las que cuentan para desempeñarse, aprender y responder a distintas exigencias del trabajo. En el plano del comportamiento
Sociología de las Organizaciones · Unidad VI · FCE-UNNE · 2026 | 5 organizacional, esta dimensión resulta relevante porque ayuda a interpretar diferencias individuales que inciden en el desempeño, la adaptación al puesto y las posibilidades de desarrollo dentro de la organización.
Chiavenato (2009) clasifica las aptitudes en dos grandes grupos: aptitudes cognitivas y aptitudes físicas.

Ahora bien, cuando la aptitud se analiza en relación con el trabajo concreto y con las exigencias del puesto, resulta pertinente avanzar hacia una noción más específica. En este sentido, la aptitud, referida a una persona, alude a la capacidad, disposición, suficiencia o idoneidad para desempeñarse en una determinada actividad o ejercer un empleo. En el ámbito laboral, y particularmente desde la perspectiva de la prevención, esta noción requiere además considerar que dicho desempeño se realice en condiciones de seguridad y salud para el propio trabajador y para terceros. Por ello, resulta más preciso hablar de aptitud laboral psicofísica, entendida como "la capacidad psicofísica que posee un trabajador para cumplir con las exigencias psicofísicas de las tareas fundamentales de su puesto de trabajo o grupo profesional, sin que ello suponga riesgo para su propia seguridad y salud o la de terceros" (Grupo de Trabajo de Aptitud Laboral del Hospital Universitario de Ceuta, 2022, p. 11).
Asimismo, la aptitud laboral puede entenderse como una valoración de la relación entre las capacidades psicofísicas del trabajador y las demandas que impone su puesto de trabajo, considerando las características de las tareas, del entorno y de la organización. En este marco, la valoración de aptitud no busca identificar al "mejor", sino establecer si el sujeto reúne los requisitos psicofísicos mínimos para desarrollar una actividad concreta en condiciones adecuadas (Figueroa Miranda & Pérez Ricardo, 2020, pp. 9-10).
Desde la perspectiva de esta unidad, el análisis de la aptitud resulta relevante porque permite comprender que el desempeño del sujeto laboral no depende únicamente de sus actitudes o de sus rasgos personales, sino también de ciertas capacidades potenciales y efectivas que lo habilitan para responder a las exigencias concretas del trabajo. En este sentido, la aptitud constituye una dimensión significativa del nivel micro, especialmente cuando se la interpreta en relación con las condiciones y demandas del entorno laboral.

Competencias laborales
Luego del análisis de la personalidad, las actitudes y las aptitudes, resulta necesario considerar las competencias, en tanto constituyen una dimensión central para comprender el desempeño del sujeto laboral en el nivel micro del comportamiento organizacional.
El concepto de competencia remite a una realidad compleja que no puede reducirse únicamente al conocimiento teórico ni al dominio técnico. En este sentido, Morales Rodríguez (2014), al reseñar la obra Enseñar y aprender competencias, señala que el análisis del concepto incluye tres factores básicos: saber, saber hacer y saber ser, los cuales permiten comprender las competencias desde una perspectiva integral. Esta mirada resulta relevante porque muestra que ser competente no implica solo disponer de información o conocimientos, sino también saber aplicarlos en la práctica y poner en juego disposiciones personales y actitudinales en contextos concretos (Morales Rodríguez, 2014, p. 162).
Desde esta perspectiva, el saber refiere a los conocimientos que una persona posee; el saber hacer, a la capacidad de aplicar esos conocimientos en la acción; y el saber ser, a las disposiciones personales, valores y actitudes que orientan el desempeño. En conjunto, estas dimensiones permiten comprender la competencia como una articulación entre conocimiento, acción y disposición subjetiva, superando visiones fragmentadas del desempeño humano (Morales Rodríguez, 2014, p. 162).

Sociología de las Organizaciones · Unidad VI · FCE-UNNE · 2026 | 6

Ahora bien, cuando esta noción se traslada al ámbito del trabajo, resulta pertinente hablar de competencias laborales, entendidas como el conjunto de capacidades, conocimientos, habilidades y actitudes que el sujeto moviliza en contextos concretos para responder a las exigencias del puesto y desempeñarse de manera eficaz dentro de la organización. Su estudio permite comprender de qué manera el trabajador articula recursos personales y contextuales para actuar en situaciones reales de trabajo.
La noción de competencia laboral ha sido abordada por numerosos autores a lo largo de las últimas décadas. Quintero Teller (2010) ofrece una síntesis del estado del arte en la que se identifican diferentes énfasis: algunos autores —entre ellos McClelland, Bunk, Mertens y Gonczi, referenciados en Quintero Teller (2010)— subrayan la importancia de las características personales, la combinación de conocimientos y destrezas, y la capacidad de resolución de problemas en contextos inciertos. Otros destacan el carácter social del aprendizaje y la necesidad de poner las competencias a prueba en situaciones reales de trabajo. En todos los casos, se reconoce que las competencias laborales no se reducen a conocimientos o habilidades técnicas, sino que involucran una combinación de atributos personales, experiencia práctica y capacidad de adaptación a entornos dinámicos (Quintero Teller, 2010, pp. 274-278).
En esa misma línea, Alles (2005) describe las competencias laborales como un conjunto de características de las personas que están relacionadas con una actuación exitosa en su puesto de trabajo (p. 20). Por su parte, Quintero Teller (2010) define la competencia laboral como la capacidad integral de una persona para desempeñarse eficazmente en situaciones específicas de trabajo, resaltando la importancia de los conocimientos, destrezas y aptitudes para resolver problemas de manera autónoma y flexible (p. 277).

Desde la perspectiva del comportamiento organizacional, las competencias laborales resultan especialmente relevantes porque permiten comprender que el desempeño del sujeto laboral no depende solo de sus rasgos personales, sino también de su capacidad para movilizar recursos, resolver problemas, adaptarse a situaciones cambiantes e interactuar eficazmente con otros en contextos concretos de trabajo. En este sentido, constituyen una dimensión central del nivel micro, ya que aportan elementos para interpretar cómo el sujeto responde a las exigencias del entorno laboral y desarrolla su desempeño dentro de la organización.
En conjunto, la personalidad, las actitudes, las aptitudes y las competencias constituyen dimensiones para comprender al sujeto laboral en el nivel micro del comportamiento organizacional. Su análisis permite reconocer que el desempeño no depende únicamente de factores técnicos o estructurales, sino también de características individuales que influyen en la forma en que cada sujeto interpreta su trabajo, responde a las exigencias del entorno y se vincula con otros dentro de la organización.

2. Factores del contexto laboral. Contrato psicológico, condiciones y organización del trabajo. CyMAT y riesgos psicosociales. Consideración de las nuevas modalidades laborales híbridas
El análisis del sujeto laboral no puede reducirse exclusivamente a sus características personales. En el nivel micro del comportamiento organizacional, también resulta necesario considerar el contexto inmediato en el que desarrolla su actividad, ya que el desempeño, el bienestar y las formas de vinculación con el trabajo se configuran en interacción con determinadas condiciones organizacionales y laborales. En este sentido, el contrato psicológico, las condiciones y organización del trabajo, las CyMAT y los riesgos psicosociales constituyen dimensiones relevantes para comprender cómo el entorno incide en la experiencia laboral del sujeto.
Desde esta perspectiva, el trabajo no solo implica la realización de tareas, sino también la inserción en un marco de expectativas, exigencias, relaciones, normas y condiciones concretas que influyen en la percepción que el trabajador construye sobre su lugar en la organización. Por ello, el estudio de estos factores permite ampliar la comprensión del comportamiento individual, articulando las características del sujeto con el ambiente laboral en el que actúa.
Contrato psicológico
Un elemento central dentro de este contexto es el contrato psicológico, entendido como un acuerdo no escrito entre el trabajador y la organización, basado en expectativas mutuas. Robbins (2009) lo presenta como un entendimiento implícito acerca de lo que cada parte espera de la otra en la relación laboral, mientras que Gibson, Ivancevich y Donnelly (2011) lo definen como una comprensión implícita de las contribuciones mutuas entre una persona y su organización (Gibson et al., 2011, pp. 117-118; Robbins, 2009, p. 121).
Este contrato establece, por un lado, lo que la administración espera de los empleados, como compromiso, lealtad, cumplimiento de normas, responsabilidad y disposición al trabajo; y, por otro, lo que los trabajadores esperan a cambio, como trato justo, condiciones laborales adecuadas, comunicación clara, reconocimiento y retroalimentación sobre su desempeño (Robbins, 2009, p. 121).
En la misma línea, Franklin y Krieger señalan que el contrato psicológico constituye un convenio implícito que determina las expectativas mutuas entre individuo y organización, y que suele renegociarse de manera periódica a medida que cambian tanto la trayectoria vital de las personas como las formas de gestión organizacional (Franklin & Krieger, 2010, pp. 54-55).

Sociología de las Organizaciones · Unidad VI · FCE-UNNE · 2026 | 8

Cuando estas expectativas no se cumplen, pueden producirse consecuencias negativas sobre la relación laboral. Gibson et al. (2011) advierten que la violación del contrato psicológico puede deteriorar la confianza, debilitar el vínculo entre empleado y organización y dar lugar a respuestas como silencio, retiro, disminución del desempeño, ausentismo e incluso renuncia (Gibson et al., 2011, pp. 118-119).
Desde esta perspectiva, el contrato psicológico resulta especialmente relevante para el análisis del comportamiento organizacional porque permite comprender que la relación laboral no se limita a lo formalmente establecido, sino que también involucra percepciones de justicia, reciprocidad, reconocimiento y pertenencia, que inciden directamente en la motivación, el compromiso y el desempeño del sujeto laboral.
Condiciones y organización del trabajo
Las condiciones de trabajo remiten al conjunto de circunstancias materiales, técnicas y ambientales en las que se desarrolla la actividad laboral, mientras que la organización del trabajo refiere al modo en que se distribuyen las tareas, los tiempos, los ritmos, las responsabilidades, las formas de control y las modalidades de coordinación dentro de la organización. Ambas dimensiones se encuentran estrechamente vinculadas, ya que no solo configuran el entorno objetivo en el que trabaja el sujeto, sino también la manera en que este percibe, vive y responde a su experiencia laboral.
En este plano, resulta relevante considerar no solo aspectos visibles del puesto de trabajo, sino también la forma en que se estructuran las exigencias, se regula los tiempos, se distribuye la carga de trabajo, se organiza la supervisión y se establecen las posibilidades de autonomía o participación. De este modo, las condiciones y la organización del trabajo influyen en el desempeño, en la adaptación del trabajador y en su bienestar general.
Condiciones y Medio Ambiente de Trabajo (CyMAT)
En el análisis del contexto laboral, una categoría central es la de Condiciones y Medio Ambiente de Trabajo (CyMAT). Neffa propone una perspectiva integral que incorpora tanto dimensiones objetivas como subjetivas del trabajo, superando una visión restringida centrada únicamente en los factores físicos del ambiente laboral (Neffa, 1989; Neffa, 2015).
En este sentido, es relevante considerar el enfoque de Neffa (2015) sobre las CyMAT y los Riesgos Psicosociales en el Trabajo, que propone una mirada amplia del entorno laboral al incluir distintas dimensiones interrelacionadas. Entre ellas se destacan:
• Factores del medio ambiente de trabajo, tales como infraestructura, iluminación, ventilación, ruido, temperatura, seguridad e higiene, uso de equipos adecuados y exposición a agentes físicos, químicos y biológicos.
• Factores organizacionales y de gestión, como el diseño del trabajo, la carga laboral, la autonomía y el control, las modalidades de contratación y estabilidad, el liderazgo, la calidad de supervisión y las oportunidades de formación y participación.
• Factores psicosociales, vinculados al ritmo e intensidad del trabajo, las demandas emocionales y cognitivas, los conflictos de rol, la ambigüedad de tareas, el desbalance esfuerzo-recompensa y la conciliación entre vida laboral y personal.
• La percepción del trabajador, expresada en la satisfacción laboral, el clima organizacional y el impacto del trabajo sobre la salud física y mental (Neffa, 2015).
Esta perspectiva resulta especialmente valiosa porque permite comprender que el entorno laboral no se limita al espacio físico donde se trabaja, sino que incluye también dimensiones organizativas, sociales y subjetivas que condicionan la experiencia del sujeto laboral. Por ello, el análisis de las CyMAT constituye una herramienta central para vincular el contexto de trabajo con el desempeño, la salud y el bienestar organizacional.
Riesgos Psicosociales en el Trabajo (RPST)
Desde esta perspectiva, los Riesgos Psicosociales en el Trabajo (RPST) adquieren especial relevancia. La evolución de los procesos laborales ha mostrado que, además de los riesgos físicos, químicos o biológicos,
Sociología de las Organizaciones · Unidad VI · FCE-UNNE · 2026 | 9 existen factores organizacionales y emocionales que impactan de manera significativa en la salud, en el bienestar y en el desempeño de los trabajadores (Neffa, 2015).
Los RPST remiten a aquellos aspectos del trabajo, de su organización y de las condiciones en que se realiza, que pueden generar tensión, malestar, desgaste o sufrimiento cuando las exigencias superan las posibilidades de respuesta del trabajador. En este sentido, no dependen únicamente de características individuales, sino de la forma en que el trabajo está estructurado, gestionado y vivido por los sujetos.
Entre los factores más relevantes pueden señalarse el ritmo e intensidad del trabajo, la sobrecarga, las exigencias emocionales, la falta de autonomía, la ambigüedad de rol, los conflictos interpersonales, el desequilibrio entre esfuerzo y recompensa, la inseguridad laboral y las dificultades para conciliar vida laboral y vida personal (Neffa, 2015).
Su análisis resulta especialmente importante en esta unidad porque permite comprender que determinadas formas de organización del trabajo pueden convertirse en fuentes de malestar que afectan no solo la salud física y mental del trabajador, sino también su motivación, su desempeño, sus relaciones laborales y su percepción de la organización.
Consideración de las nuevas modalidades laborales híbridas
En el contexto contemporáneo, el análisis de los factores del contexto laboral requiere incorporar las transformaciones derivadas de las nuevas modalidades laborales híbridas. Estas suponen una combinación entre trabajo presencial y trabajo a distancia, posibilitando que la actividad se desarrolle tanto en las instalaciones de la organización como fuera de ellas, con apoyo de las tecnologías de la información y la comunicación (Tosca-Vidal, 2022, párrs. 33-34, 65-66).
Diversos estudios destacan que esta modalidad puede favorecer la flexibilidad laboral, la satisfacción de los trabajadores, el equilibrio entre vida personal y profesional y, en determinados contextos, mejoras en la productividad. Asimismo, se ha señalado que la reducción de tiempos de traslado y la posibilidad de organizar con mayor autonomía la jornada constituyen algunos de los beneficios más valorados por quienes trabajan bajo esta modalidad (Tosca-Vidal, 2022, párrs. 65-66, 82-84; Gil Hernández et al., 2025, pp. 27-29, 31).
Sin embargo, el trabajo híbrido también presenta desafíos relevantes para las organizaciones. Entre ellos se destacan las dificultades vinculadas a la comunicación interna, la cohesión de los equipos, el sostenimiento del sentido de pertenencia, la necesidad de políticas claras de funcionamiento y la adecuada integración tecnológica. En este marco, la modalidad híbrida no constituye solo un cambio operativo, sino una transformación del entorno laboral que incide sobre las condiciones de trabajo, la experiencia subjetiva del trabajador y las formas de articulación entre sujeto y organización (Gil Hernández et al., 2025, pp. 27-31).
A su vez, la literatura reciente muestra que el interés académico por los modelos de trabajo híbrido ha crecido de manera sostenida en los últimos años, especialmente por su vínculo con la productividad del talento humano y con la transformación de las dinámicas laborales en la etapa pospandémica (Espinoza Heredia et al., 2025, pp. 3728-3749).
Desde la perspectiva de esta unidad, la consideración de las modalidades laborales híbridas resulta pertinente porque permite actualizar el análisis del contexto laboral en el nivel micro, incorporando cambios recientes que afectan tanto la organización del trabajo como las condiciones en que este se desarrolla. De este modo, amplía la comprensión de los factores que inciden en el desempeño y en el bienestar organizacional del sujeto laboral.
En conjunto, el contrato psicológico, las condiciones y organización del trabajo, las CyMAT, los riesgos psicosociales y las nuevas modalidades laborales híbridas permiten comprender que el comportamiento del sujeto laboral se configura en relación con un entorno concreto de trabajo. Por ello, el análisis de estos factores no solo aporta a la comprensión del nivel micro del comportamiento organizacional, sino que también constituye una base relevante para el diagnóstico integrado del sujeto laboral y sus condiciones de trabajo.
3. Diagnóstico de las características individuales y del entorno laboral. Análisis integrado del sujeto laboral y sus condiciones de trabajo para identificar factores que inciden en su desempeño y bienestar organizacional
Sociología de las Organizaciones · Unidad VI · FCE-UNNE · 2026 | 10

En esta unidad, el diagnóstico del sujeto laboral y sus condiciones de trabajo no se limita a describir rasgos, opiniones o situaciones aisladas. Supone avanzar desde la descripción hacia el análisis y, posteriormente, hacia una interpretación diagnóstica que permita reconocer factores significativos en el desempeño y el bienestar organizacional. En este sentido, describir implica registrar información relevante; analizar supone organizarla e interpretarla mediante categorías teóricas; diagnosticar, en cambio, requiere relacionar variables, identificar aspectos problemáticos o facilitadores y construir una comprensión más fundada de la situación estudiada.
Desde la perspectiva del comportamiento organizacional, Gibson et al. (2011) señalan que asumir que las diferencias individuales no tienen relación con el ambiente constituye un error, ya que ambas se encuentran intrínsecamente entrelazadas. En este marco, retoman la formulación de Kurt Lewin para plantear que el comportamiento es función de variables individuales y ambientales: B = f (I, E) (Gibson et al., 2011, pp. 8889; cf. Lewin, 1936). Esta ecuación expresa que el comportamiento (B) no puede comprenderse solo a partir de las características de la persona, sino en relación con el entorno (E) en el que actúa.
En coherencia con la Matriz de Análisis 2026, el diagnóstico del nivel micro se focaliza en variables específicas de este plano: personalidad y estilos de trabajo, competencias laborales, motivación y percepción. Esta última incluye especialmente la percepción de los principales valores organizacionales y la percepción del contrato psicológico, por su relevancia para comprender cómo el sujeto interpreta su vínculo con la organización y las condiciones en que desarrolla su tarea.
Ahora bien, esta focalización no implica aislar el nivel micro del resto de los niveles del comportamiento organizacional. Por el contrario, su interpretación se enriquece cuando se realiza en articulación con lo ya trabajado en los niveles macro y meso. En efecto, ciertas cuestiones vinculadas al bienestar, la motivación, la frustración laboral o la percepción del sujeto pueden comprenderse mejor cuando se consideran, por ejemplo, rasgos de la cultura o del clima organizacional, características del equipo de trabajo, formas de liderazgo o dinámicas de comunicación. Del mismo modo, algunos fenómenos observados en esos niveles adquieren mayor profundidad interpretativa cuando se analizan desde la experiencia individual del sujeto laboral.
Por ello, el diagnóstico del nivel micro debe evitar dos errores frecuentes: por un lado, quedarse en una mera descripción sin análisis; por otro, mezclar niveles sin criterio metodológico. Lo que se busca es construir una lectura integrada, pero ordenada, que permita reconocer qué factores corresponden específicamente al plano individual y cómo se articulan, en la interpretación general del caso, con dimensiones ya abordadas en los niveles macro y meso.
En este marco, Gibson et al. (2011) sostienen que, para comprender las diferencias individuales, es necesario observar y reconocer esas diferencias, estudiar las variables que influyen en el comportamiento individual y descubrir las relaciones entre ellas (Gibson et al., 2011, p. 89). Desde esta perspectiva, diagnosticar al sujeto laboral y sus condiciones de trabajo implica identificar factores que inciden en su desempeño y bienestar organizacional, reconociendo tanto sus características individuales como la forma en que vive, percibe e interpreta su entorno inmediato de trabajo.

UNIDAD V: LA MOTIVACIÓN EN LAS ORGANIZACIONES 5.1-MOTIVACIÓN: CONCEPTO. CICLO O PROCESO MOTIVACIONAL.
Cuando hablamos de motivación, tenemos que tener presente que nos estamos refiriendo a un concepto complejo, por ser un proceso dinámico en el que intervienen diferentes variables para que la persona esté motivada. Un sujeto para estar motivado debería tener un objetivo, decidirse a alcanzarlo y mantenerse en el esfuerzo para lograrlo. Uno de los generadores de la motivación, entonces, es la visualización de un estado deseado (diferente al estado actual).

A continuación, mencionaremos los diferentes conceptos que aportan distintos autores en su afán por explicar lo que es la motivación:

CONCEPTO

Robbins, 2009, p. 175 “La motivación es la presión interna surgida de una necesidad, también interna, que excita (vía electroquímica) las estructuras nerviosas, origina un estado de energía que impulsa al organismo a la actividad, e inicia, guía y mantiene la conducta hasta alcanzar una meta (objetivo o incentivo) o bloquear una respuesta.”

Soto, 2002, en Chiavenato, 2009, p. 237 “La motivación es un proceso que comienza con una deficiencia fisiológica o psicológica, o con una necesidad que activa un

Franklin Fincowsky E. B. & Krieger M. (2010) Krieger, M., 2011, p.100 “Motivación es el concepto que utilizamos al describir las fuerzas que actúan sobre el individuo o que parten de él para iniciar y orientar su conducta.”

Gibson, Ivancevich, y Donnelly, 2001, p.145

Fuente: Elaboración propia De todos los conceptos se puede inferir que la motivación está influida por múltiples variables (recompensas positivas y negativas, necesidades, deseos, emociones y/o por ideas), es situacional, porque en algunos contextos una persona está motivada y en otros no, cambiar de lugar muchas veces genera motivación. Es temporal porque hay veces que a la mañana lo estás y a la noche, no; es específica porque una persona se motiva para determinados objetivos y no para otros. Es un resultado de lo que hacemos con nuestra vida, de los incentivos, de nuestros deseos, de los sitios donde trabajamos y de las personas con las que nos relacionamos.

La explicación de cómo “operan” cada una de estas variables, la dan las diferentes perspectivas de la motivación. En relación a estas diferentes perspectivas y conceptos, se clasifica a la motivación como:
⮚ Intrínseca: Para Deci y Ryan (2002) la motivación intrínseca “es la inclinación innata de comprender los intereses propios y ejercitar las capacidades personales para, de esa forma, buscar y dominar los desafíos máximos.” Díaz, J., Díaz, M., & Morales, S. (2014, p, 22).
⮚ Extrínseca: el autor Reeve (2003) menciona que la motivación extrínseca “hace referencia al hecho de que las causas fundamentales de la conducta se encuentran afuera y no dentro de la persona.” Díaz, J., Díaz, M., & Morales, S. (2014, p.22).

Las tres perspectivas dan una mirada integral y se complementan para entender el fenómeno de la motivación en el ser humano, su dinamismo y la influencia de diferentes variables.

Ciclo motivacional:

El ciclo motivacional nos permite comprender en profundidad el proceso y conocer los distintos componentes que interactúan en él. La motivación es un concepto explicativo y complejo, por lo que entender cómo se relacionan los diferentes componentes que intervienen en la motivación nos proporciona una mejor comprensión de este proceso cíclico y dinámico.

Prof. Mariana Valdés Sociología de las Organizaciones 2024 Facultad de Ciencias Económicas- UNNE
De acuerdo con Franklin Fincowsky E. B. & Krieger M. (2011), Newstrom (2011) y Robbins (2009), el ciclo motivacional se refiere al conjunto de etapas que constituyen el proceso de motivación de los individuos. Según Franklin Fincowsky E. B. & Krieger M. (2011), “el ciclo comienza cuando surge una necesidad, que es una fuerza dinámica y persistente que origina el comportamiento. Cada vez que aparece una necesidad, esta rompe el equilibrio existente y produce un estado de tensión, insatisfacción, inconformismo y desequilibrio que lleva al individuo a desarrollar un comportamiento o acción que permita descargar la tensión, liberándolo de la inconformidad y el desequilibrio”. ( p.101)
Además, siguiendo a Robbins (2009), una conducta motivada tiene una dirección, enfoque y presenta un nivel de esfuerzo y persistencia. Es importante destacar, tal como lo mencionan Franklin Fincowsky E. B. & Krieger M. (2011), que a pesar de que los patrones de comportamiento varían, el proceso que los origina es básicamente el mismo.
Como resultado de este ciclo motivacional, pueden darse tres situaciones: satisfacción, compensación y frustración. La frustración ocurre cuando, a pesar del esfuerzo realizado, la persona no logra satisfacer su necesidad. En este caso, la persona experimenta una tensión emocional que se produce cuando algo impide que, a pesar del esfuerzo realizado, no logre alcanzar la satisfacción, y como consecuencia presenta un conjunto de síntomas (Valdés, M. 2018).
Estos síntomas (regresión, agresión, resignación, ausentismo) se presentan cuando la persona tampoco puede cubrir sus necesidades con un incentivo sustituto, es decir, una compensación en la satisfacción de sus necesidades. En algunos casos, aunque la necesidad quede insatisfecha, no existe frustración, ya que puede transferirse o compensarse. Esto se verifica cuando la satisfacción de otra necesidad logra reducir o calmar la intensidad de una necesidad no satisfecha. Por ejemplo, cuando en vez de un ascenso se obtiene un buen aumento de salario. La satisfacción de algunas necesidades es transitoria y pasajera; de hecho, la motivación humana en general es cíclica.
Desde este punto de vista, el comportamiento representa un proceso de solución de problemas y satisfacción de necesidades (Franklin Fincowsky E. B. & Krieger M., 2011, p.102). Como administradores, es crucial estar atentos a los diferentes síntomas y recurrir a la escucha,

Prof. Mariana Valdés Sociología de las Organizaciones 2024 Facultad de Ciencias Económicas- UNNE la empatía y mantener un punto de vista constructivo con la persona que se encuentra en ese estado de frustración.
3.2- PRINCIPALES ENFOQUES EN EL ESTUDIO DE LA MOTIVACIÓN LABORAL En este punto no se pretende hacer un desarrollo explicativo de cada teoría, en toda la bibliografía básica se puede encontrar en detalle cada una. Lo que sí pretendo, es clasificación que aparece en la literatura de ellas y explicar la diferencia entre las teorías motivacionales de contenido y de proceso, como lo encontrarán en Chiavenato (2011), Newstrom (2011) y Gibson, J. et. al. (2011).
Las teorías de contenido se centran en la motivación interna e individual de la persona, las cuales son necesidades que el individuo intenta satisfacer a partir del trabajo. Aquí se encuadran las siguientes teorías:
⮚ Jerarquía de las Necesidades de Maslow, ⮚ Motivación-Higiene de Herzberg, ⮚ ERC de Alderfer, ⮚ Necesidades secundarias de McClelland,
Las teorías de proceso intentan explicar cómo motivar a las personas. Estudiando los procesos de las tareas realizadas por los empleados, se determina cuáles son los factores por modificar o mantener bajo control para lograr la conducta deseada por parte del personal. En este caso, las relacionamos con las motivaciones extrínsecas. Aquí se encuadran las siguientes teorías: ⮚ la Teoría de las Expectativas de Vroom y Porter, ⮚ Equidad de Stacy Adam, ⮚ del Establecimiento de metas de Edwin Locke, ⮚ la Teoría de X e Y de McGregor, entre otras.

Prof. Mariana Valdés Sociología de las Organizaciones 2024 Facultad de Ciencias Económicas- UNNE
Robbins (2009) clasifica las teorías de motivación en dos grupos: las primeras teorías y las contemporáneas. Señala que la década de 1950 fue un período crucial para el desarrollo de los conceptos de motivación, ya que surgieron cuatro teorías específicas: la Jerarquía de las necesidades (Maslow), la Teoría X e Y (MacGregor), la Teoría de los dos factores (Herzberg) y la Teoría de las Necesidades (McClleand).
A pesar de que estas teorías han sido objeto de críticas en cuanto a su validez, es probable que sean las explicaciones más conocidas sobre la motivación de los empleados. Aunque carezcan de validez, Robbins (2009), menciona que no podemos dejar de estudiarlas, ya que constituyen el fundamento en el que se basan las teorías contemporáneas, y los gerentes profesionales siguen utilizándolas, así como su terminología, para explicar la motivación de los empleados (p.175).
Posteriormente, surgieron explicaciones más sólidas sobre la motivación, lo que dio origen a diferentes teorías contemporáneas: la Teoría de la evaluación cognitiva, la Teoría del establecimiento de metas, la Teoría de la eficacia personal, la Teoría del reforzamiento (justicia organizacional), la Teoría de la equidad, la Teoría de las expectativas y el Modelo de las características del trabajo (MCT).
Es importante destacar que las teorías no se excluyen mutuamente. El hecho de que una teoría sea válida no implica automáticamente que las demás estén equivocadas. De hecho, muchas de las teorías mencionadas en el capítulo son complementarias. Ahora, el desafío radica en integrarlas para que ayuden a comprender sus interrelaciones (Robbins, 2009, p.199).
5.3 FORMAS DE MOTIVAR EN LAS ORGANIZACIONES. LOS INCENTIVOS. SU INFLUENCIA EN LA ATRACCIÓN DEL PERSONAL Y RETENCIÓN DEL PERSONAL. Introducción
En este punto nos centraremos en las diferentes formas para motivar a los miembros de una Organización y lograr un mayor desempeño, mejorar su sentido de pertenencia y retención del personal. Es necesario, a estas alturas, tener una clara comprensión del concepto de motivación, sus diferentes componentes, tipos y perspectivas, como también las propuestas de

Prof. Mariana Valdés Sociología de las Organizaciones 2024 Facultad de Ciencias Económicas- UNNE cada teoría. Es muy importante, en esta instancia, la comprensión del ciclo motivacional, porque a partir del mismo, se logra entender la relación de todo lo desarrollado en esta unidad.
Las diferentes perspectivas de la motivación se constituyen en explicativas, porque nos indican donde debemos hacer énfasis para lograr motivar a las personas. Sin embargo, debemos analizarla de manera integral, es decir, considerando cómo las diferentes miradas se complementan.
Tal como vimos en la Unidad 4 y siguiendo a Naranjo Pereira (2009), “las personas son seres con conductas, emociones, necesidades, pensamientos, y todos estos se relacionan entre sí” (p. 167), por lo que no existe una única manera de incentivar y lograr la motivación en las personas, porque son sujetos únicos, sus expectativas y necesidades van variando según sus vivencias, experiencias y desarrollo.
Los administradores debemos tener presente estas cuestiones, y centrarnos en las necesidades y expectativas de los empleados. Una de las finalidades del sistema de recompensas es la satisfacción de los colaboradores, en el desarrollo de su trabajo. Suponemos que de esta manera hay una mayor posibilidad de compromiso contribución y esfuerzo en su trabajo,
Sistemas de compensaciones Como administradores una de las finalidades es promover el cumplimiento de los objetivos organizacionales y al mismo tiempo, los empleados puedan cumplir con sus propósitos individuales. La compensación es una parte importante de la administración y un recurso relevante para lograr la motivación de los trabajadores en el cumplimiento de los objetivos. Por tal razón, antes de abocarnos a las diferentes formas de motivar en un contexto de trabajo, es preciso definir qué entendemos por un sistema de compensaciones.
La compensación se puede definir “como todos aquellos pagos y recompensas, de carácter monetario —y también de tipo no monetario— que se entregan al trabajador como una contraprestación de los servicios laborales que este desarrolla en la organización” (Sánchez Henríquez, y Calderón Calderón, 2013, p.140).
Por su parte Morales y Velandia (1999), indican que el sistema de compensaciones o de salarios "...es el conjunto de políticas, técnicas y objetivos de compensación traducidos en las retribuciones financieras, prestaciones o beneficios tangibles que se dan a los empleados como parte de la relación laboral" (Malangón, 2006, p. 7)

Prof. Mariana Valdés Sociología de las Organizaciones 2024 Facultad de Ciencias Económicas- UNNE
En este sentido, el autor Chiavenato (2002), lo define “...como la remuneración producto del salario directo más el salario indirecto, que representa todo lo que el empleado recibe como fruto del trabajo que realiza en la organización” (Malangón, 2006, p. 7)
Diferentes autores mencionan distintos criterios y pasos a tener en cuenta en su planificación y diseño. Una de las cuestiones implica tener una retroalimentación, para saber si nuestros incentivos están siendo percibidos como positivos, si están cumpliendo los objetivos propuestos o si están produciendo resultados diferentes a los esperados.
Para diseñar un sistema de recompensas, una de las actividades a realizar es un relevamiento de todos los cargos de la empresa, para saber con exactitud las diferentes características de cada uno, y un relevamiento de las características personales de todos los empleados.
Tal lo mencionan Chiavenato (2002), Morales y Velandia (1999, citados en Malagón, 2006) tenemos diferentes criterios a la hora de establecer un sistema de recompensas, tales como:
● Estructuras salariales equitativas ● Base de salarios coherentes con el sistema de incentivos para que sea realmente válido y confiable ● Ser competitivo en relación a los salarios de otras empresas del sector
Por su parte Werther y Davis (2000) proponen, además: ● Analizar el impacto de la creación de un sistema no tradicional de incentivos ● Creación de un líder específico para el sistema de incentivos

A la hora de diseñar un sistema de compensaciones, Sánchez Henríquez y Calderón Calderón (2013) proponen pasar por seis diferentes etapas para que resulte efectivo.

Tabla 1: Etapas en el diseño de un sistema de compensaciones

ETAPAS
Diagnóstico y análisis de las necesidades de compensación.

ACTIVIDADES QUE SE DESARROLLAN EN CADA UNA Es la primera que se debe realizar en el proceso de compensación. Este análisis se debe efectuar sobre el ambiente tanto interno como externo, para

Prof. Mariana Valdés Sociología de las Organizaciones 2024 Facultad de Ciencias Económicas- UNNE posteriormente elaborar un plan de compensación acorde con los requerimientos de la empresa y su personal

Planificación y diseño

Es una de las etapas más importantes del proceso, ya que es aquella en la cual se establecen todas las variables que incluirá el plan de compensación, entre ellas objetivos, plazos, políticas, indicadores, tipos de compensación, etc.; esta etapa debe finalizar con la documentación del plan de compensación.

Revisión y comunicación

Es aquella en la cual tanto la gerencia como el área de recursos humanos revisan y dan su aprobación al plan de compensación.

Implementación:

Es donde se aplica todo lo que se ha determinado llevar a cabo en la planificación y el diseño y que ha sido aprobado.

Evaluación

En esta etapa se analiza toda la información proporcionada por los indicadores, se realizan entrevistas y otros medios a través de los cuales se pueda evaluar la efectividad del proceso, se determinan ajustes en caso de determinar necesidades de mejora. Toda esta información sirve como retroalimentación para la organización.

Retroalimentación

En la etapa de implementación se aplica el plan que ha sido anteriormente aprobado en la etapa de evaluación, dando a conocer la información correspondiente a los trabajadores. En esta etapa se aplican los indicadores establecidos anteriormente, los que darán a conocer información respecto al logro de los objetivos planteados y que pasarán a un proceso de análisis

Fuente: Elaboración propia en base a Sánchez Henríquez y Calderón Calderón, 2013, p.144

Formas de recompensar a las personas en un contexto laboral Existen diferentes formas de incentivar o recompensar a los trabajadores. Bajo un “sistema tradicional”, encontramos sólo los incentivos económicos, como ser: a) Salario en función de la cantidad de producción b) Salario de acuerdo con el tiempo invertido c) Salario por antigüedad d) Salario sobre la base de las necesidades

Prof. Mariana Valdés Sociología de las Organizaciones 2024 Facultad de Ciencias Económicas- UNNE

Sin embargo, también hay un “sistema no tradicional de incentivos”, que es aquel que no sólo contempla lo monetario, sino que también considera otros tipos de recompensas, que tienen que ver con cuestiones “no monetarias”; como las que menciona Chiavenato (2014, p.135):
a) Ofrecimiento de nuevas oportunidades para lograr una mayor visibilidad, b) Búsqueda de nuevas actividades que generen mayores desafíos, c) Invertir tiempo en las personas y en el tiempo de ellas, d) Compartir información relevante, e) Generar retroalimentación sobre el desempeño de los trabajadores, f) Convertir a los empleados en asociados, g) Atribuir facultades a las personas, h) Celebrar los éxitos, i) Ofrecer un horario flexible, y j) Aumentar las posibilidades de empleo

Con el transcurso del tiempo empezó a surgir una tendencia de integrar ambos sistemas, porque el sistema de compensaciones ya “excede” lo monetario exclusivamente. Se puede emplear diferentes “combinaciones” para lograr motivar a los empleados, teniendo siempre en cuenta sus expectativas, necesidades, requerimientos, como también las características del puesto de trabajo.
En este sentido Hai-Ming y Yi-Hua (2006, citados en Madero Gómez, 2009) mencionan diferentes tendencias que se fueron dando desde el sistema tradicional al sistema no tradicional de compensaciones. Estos autores clasifican las tendencias en seis dimensiones, sin embargo, me parece conveniente agruparlas de otra manera, considerando que todas van de una tendencia exclusivamente monetaria a una que también contempla incentivos no monetarios.

Tabla 2: Cambio de tendencias en el sistema de compensaciones

Sistema

Sistema no

Tendencias tradicional tradicional

De antigüedad A contribución La nueva tendencia en sistemas de compensación está basada en las competencias y desempeño del empleado.

Prof. Mariana Valdés Sociología de las Organizaciones 2024 Facultad de Ciencias Económicas- UNNE
Cabe mencionar que la palabra competencias habla de atributos, habilidades y/o conocimientos que constituyen un gran potencial para la creación de valor. El recompensar de acuerdo con las competencias y no sólo o exclusivamente por antigüedad, favorece a que los empleados se mantengan concentrados en alcanzar objetivos específicos y es un incentivo para exceder los objetivos.

De uno simple, A uno La nueva tendencia, aplicada por muchas compañías extrínseco y intrínseco, exitosas, es ofrecer un portafolio de compensaciones, el único múltiple y cual contiene diferentes métodos aplicados para distintos diferencial propósitos.

En otras palabras, se ha pasado de pagar solamente dinero a incluir no solamente compensaciones monetarias, sino también otros tipos de recompensas: entrenamiento, oportunidades educativas, horarios de trabajos flexibles, reconocimientos.

Hoy por hoy, las organizaciones y administradores dan mucha importancia a otros tipos de reconocimiento debido a que saben lo importante que es mantener motivados a los empleados para su buen desempeño.

Por los mismos motivos se ha pasado de tener un sistema único de compensaciones, es decir, se aplicaba de igual manera a todos los niveles de la organización, a uno flexible que se adecúe a las diferentes necesidades de los empleados, como también a los diferentes cargos que existen en una organización.

De uno A uno Tradicionalmente, las recompensas “extras” se dan al final periódico instantáneo del año o unas dos veces al año. Pero poco a poco esta tendencia ha ido cambiando, ahora las empresas recompensan a sus empleados de manera instantánea debido a los constantes cambios del entorno. La mejor manera de mantener a un empleado motivado es hacerle darse cuenta de cómo contribuye a los resultados de la

Prof. Mariana Valdés Sociología de las Organizaciones 2024 Facultad de Ciencias Económicas- UNNE empresa, lo que implica recompensar inmediatamente.

Ofrecer recompensas diferidas y a largo plazo hace que se pierda el poder o el verdadero significado de la recompensa.

De uno A uno Actualmente, los sistemas de compensaciones están independiente coordinado íntimamente relacionados con la misión, visión, valores, metas y entorno competitivo de la empresa con el fin de que el empleado pueda aportar el máximo valor a la empresa, cuando antes estaban totalmente desligados de las metas de la organización y su entorno.

Fuente: Elaboración propia en base a Madero Gómez, 2009, p.9

Como se evidencia en el cuadro anterior, existen muchas variantes a tener en cuenta, sin embargo, es importante destacar que no existe una fórmula o receta mágica que sirva para motivar a todos los empleados de una misma organización. Tal como se menciona en el punto anterior, debe partirse de un claro diagnóstico. “Para entender la naturaleza de la motivación, los administradores deben conocer las necesidades de sus subordinados” (Gibson, Ivancevich, Donnelly y Konopaske, 2011, p. 149).
Por otra parte, una combinación “exitosa” de incentivos en una empresa no necesariamente tendrá el mismo efecto en otra, ni por más que pertenezcan al mismo rubro. Cada organización tiene su propia identidad y singularidad.

Su influencia en la atracción del personal y retención del personal A lo largo del documento fuimos concluyendo que no hay una única forma de motivar a las personas, en la actualidad hay un sistema que trasciende el modo tradicional de recompensas, por tal motivo el administrador tiene muchos recursos para el diseño eficaz de un sistema de compensaciones que logre su objetivo: motivar a las personas.
Como sostiene Madero Gómez (2016), el sistema de recompensas o compensaciones laborales juega un papel importante en el proceso de atracción y retención del talento. El mismo debería cumplir con los requerimientos del proceso de empleo, de acuerdo a las políticas marcadas por la empresa.

Prof. Mariana Valdés Sociología de las Organizaciones 2024 Facultad de Ciencias Económicas- UNNE “Lo ideal es que los administradores pudieran desarrollar sistemas de recompensas que retuvieran a los empleados de mejor desempeño y ocasionaran que los malos se fueran; así, la eficacia general de una organización mejoraría” (Gibson et. al, 2011, p.178).
Ahora bien, aunque parezca lógico, cabe preguntarse ¿Cuáles son las razones relevantes para mantener al personal en una organización? Para responder a este interrogante, citamos al autor Gonzales Miranda (2009) quien expresa diferentes motivos que deben tenerse en cuenta, tales como:
● Cuando un empleado sale de la empresa, lo hace con el conocimiento que posee, de tal forma, la empresa no solo pierde al empleado como tal sino el saber que él lleva consigo;
● Desde el punto de vista del clima organizacional, la rotación del personal tiene también sus consecuencias. La movilidad del personal genera inestabilidad laboral y un imaginario por parte de los empleados de sentirse “utilizados”, poco reconocidos y cultiva un clima de desconfianza;
● La rotación del personal descontextualiza la ejecución de la estrategia la cual necesariamente está situada en un tiempo y espacio determinados (p. 52).
Conclusión Para cerrar y concluir con este punto, afirmamos que motivar consiste en generar un deseo genuino en las personas para realizar determinada conducta, pero la misma debe ser orientada y mantenerse en el tiempo, por lo que la persistencia es un factor importante cuando hablamos de motivación.
El administrador, tiene este desafío, por ello es tan relevante conocer y entender todos los componentes del ciclo motivacional, y comprender que las necesidades son la base de ese proceso. Por tal razón es imperante conocer a nuestros trabajadores, revisar si están satisfechos, conocer cuáles son las necesidades que están “operando” con mayor intensidad en ese momento.
El desafío es encontrar un esquema adecuado de compensaciones que logre su finalidad. No hay una “receta única y mágica” y la misma debe ser dinámica. Las necesidades de los sujetos van mutando en cuanto a tipo e intensidad, van cambiando según las vivencias y experiencias de los trabajadores, lo que demanda una atención constante en su planificación y una actitud proactiva.
En este sentido, citamos a Sánchez Henríquez y Calderón Calderón (2013), quienes mencionan:

Prof. Mariana Valdés Sociología de las Organizaciones 2024 Facultad de Ciencias Económicas- UNNE
Los administradores deben estar atentos a no caer en este juego vicioso de ser un actor pasivo y reactivo en la compensación y sólo reaccionar ante hechos como huelgas, disminución de productividad, paros, altos índices de absentismo, etc., y pensar que solo retribuyendo monetariamente se está compensando (p.142).
